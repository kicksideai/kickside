version: "1.0"
namespace: kickside.uploads.storage

entries:
  - name: types
    kind: library.lua
    source: file://types.lua

  - name: locations
    kind: library.lua
    source: file://locations.lua
    modules: [sql, time, uuid]
    imports:
      storage_types: kickside.uploads.storage:types

  - name: backend
    kind: library.lua
    source: file://backend.lua
    modules: [fs, cloudstorage, uuid, registry]
    imports:
      locations: kickside.uploads.storage:locations

  - name: policy
    kind: library.lua
    source: file://policy.lua
    modules: [contract, registry, env]
    imports:
      storage_types: kickside.uploads.storage:types

  - name: validate_policy
    kind: function.lua
    source: file://policy.lua
    method: validate
    modules: [contract, registry, env]
    imports:
      storage_types: kickside.uploads.storage:types

  - name: setting.policy
    kind: registry.entry
    meta:
      type: kickside.settings:definition
    namespace: kickside.uploads.storage
    key: policy
    value_type: json
    default: { mode: local, resource_id: "", prefix: uploads }
    title: Processed file storage
    description: Keep processed files locally or move their original and derived content to a configured private S3 resource. Applies to newly processed uploads.
    scope: global
    editable: true
    visible: true
    validate_func: kickside.uploads.storage:validate_policy
    schema:
      type: object
      additionalProperties: false
      required: [mode, resource_id, prefix]
      properties:
        mode: { type: string, enum: [local, s3] }
        resource_id: { type: string }
        prefix: { type: string, maxLength: 256 }

  - name: offload
    kind: library.lua
    source: file://offload.lua
    modules: [fs, cloudstorage, hash, time]
    imports:
      storage_types: kickside.uploads.storage:types
      locations: kickside.uploads.storage:locations
      backend: kickside.uploads.storage:backend
      uploads_resources: kickside.uploads.binding:uploads_resources

  - name: offload_job
    kind: process.lua
    source: file://offload_job.lua
    method: main
    meta:
      comment: Durable post-processing file placement; conversion and KB ingestion have independent retry budgets.
    security:
      actor: { id: system:kickside.uploads.storage.offload }
      policies:
        - kickside.uploads.storage.security:cloud
        - kickside.uploads.storage.security:filesystem
        - kickside.uploads.security:uploads_resource_access
        - kickside.uploads.security:retention_db_access
    imports:
      jobs: kickside.core.jobs:jobs
      job_types: kickside.core.jobs:types
      upload_types: kickside.uploads:types
      locations: kickside.uploads.storage:locations
      offload: kickside.uploads.storage:offload
      uploads_resources: kickside.uploads.binding:uploads_resources
      upload_query_repo: kickside.uploads.persist:upload_query_repo

  - name: inspect
    kind: function.lua
    source: file://inspect.lua
    method: handle
    modules: [http, security, registry, cloudstorage, uuid, env, contract, funcs]
    imports:
      backend: kickside.uploads.storage:backend
      policy: kickside.uploads.storage:policy
      uploads_resources: kickside.uploads.binding:uploads_resources

  - name: inspect.endpoint
    kind: http.endpoint
    method: GET
    path: /uploads/storage
    func: inspect

  - name: test.endpoint
    kind: http.endpoint
    method: POST
    path: /uploads/storage/test
    func: inspect

  - name: configure
    kind: function.lua
    source: file://inspect.lua
    method: configure
    modules: [http, security, registry, cloudstorage, uuid, env, contract, funcs]
    imports:
      backend: kickside.uploads.storage:backend
      policy: kickside.uploads.storage:policy
      uploads_resources: kickside.uploads.binding:uploads_resources

  - name: configure.endpoint
    kind: http.endpoint
    method: POST
    path: /uploads/storage
    func: configure

  - name: reset.endpoint
    kind: http.endpoint
    method: DELETE
    path: /uploads/storage
    func: configure
