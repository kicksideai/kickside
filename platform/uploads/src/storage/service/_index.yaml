version: "1.0"
namespace: kickside.uploads.storage.service
entries:
  - name: host
    kind: process.host
    lifecycle: { auto_start: true }

  - name: projection
    kind: library.lua
    source: file://projection.lua
    modules: [registry, hash]
    imports:
      policy: kickside.uploads.storage:policy
      locations: kickside.uploads.storage:locations
      uploads_resources: kickside.uploads.binding:uploads_resources
      canonical_json: kickside.contract:canonical_json

  - name: controller
    kind: process.lua
    source: file://controller.lua
    method: main
    modules: [process, channel, time, events, logger]
    imports:
      projection: kickside.uploads.storage.service:projection

  - name: controller.service
    kind: process.service
    host: kickside.uploads.storage.service:host
    process: kickside.uploads.storage.service:controller
    lifecycle:
      depends_on: [wippy.bootloader:bootloader.service]
      auto_start: true
      restart: { initial_delay: 2s, max_delay: 60s, max_attempts: 0 }
      security:
        groups: [kickside.uploads.storage.service:controller_scope]

  - name: reads
    kind: security.policy
    groups: [kickside.uploads.storage.service:controller_scope]
    policy:
      resources: '*'
      actions: [registry.get, registry.find, db.get, env.get, contract.get, contract.open, contract.call, funcs.call, events.subscribe, process.send, process.registry.register, process.registry.lookup]
      effect: allow

  - name: overlay_owner
    kind: security.policy
    groups: [kickside.uploads.storage.service:controller_scope]
    policy:
      resources: kickside.uploads.storage.service:controller
      actions: [registry.overlay.get, registry.overlay.apply]
      effect: allow

  - name: overlay_entries
    kind: security.policy
    groups: [kickside.uploads.storage.service:controller_scope]
    policy:
      resources: kickside.uploads.storage.runtime:*
      actions: [registry.overlay.create.cloudstorage.s3, registry.overlay.update.cloudstorage.s3, registry.overlay.delete.cloudstorage.s3, registry.overlay.create.registry.entry, registry.overlay.update.registry.entry, registry.overlay.delete.registry.entry]
      effect: allow

  - name: request
    kind: function.lua
    meta: { private: true }
    source: file://request.lua
    method: deliver
    modules: [process, channel, time, uuid]
    security:
      actor: { id: system:kickside.uploads.storage.request }
      policies: [kickside.uploads.storage.service:request_transport]

  - name: request_transport
    kind: security.policy
    meta: { private: true }
    policy:
      resources: '*'
      actions: [process.send, process.registry.lookup]
      effect: allow
