version: "1.0"
namespace: kickside.uploads.binding

entries:
  - name: uploads_resources
    kind: library.lua
    meta:
      comment: Resource accessors for KickSide uploads.
    source: file://resources.lua
    modules: [sql, env, cloudstorage, registry]
    imports:
      storage_backend: kickside.uploads.binding:storage_adapter_default

  - name: count_resources_func
    kind: function.lua
    meta:
      comment: Implements kickside.contract:resource_registry.count_resources for uploads.
    source: file://count_resources_func.lua
    modules: [security, json]
    imports:
      upload_query_repo: kickside.uploads.persist:upload_query_repo
    method: handle

  - name: get_content_func
    kind: function.lua
    meta:
      comment: Implements kickside.contract:content_provider.get_content for uploads.
    source: file://get_content_func.lua
    modules: [security, ctx]
    imports:
      artifact_parts_repo: kickside.uploads.persist:artifact_parts_repo
      metadata_sanitizer: kickside.uploads:metadata_sanitizer
      upload_query_repo: kickside.uploads.persist:upload_query_repo
      uploads_resources: kickside.uploads.binding:uploads_resources
    method: handle

  - name: get_info_func
    kind: function.lua
    meta:
      comment: Implements kickside.contract:content_provider.get_info for uploads.
    source: file://get_info_func.lua
    modules: [security, ctx]
    imports:
      artifact_parts_repo: kickside.uploads.persist:artifact_parts_repo
      metadata_sanitizer: kickside.uploads:metadata_sanitizer
      upload_query_repo: kickside.uploads.persist:upload_query_repo
    method: handle

  - name: list_resources_func
    kind: function.lua
    meta:
      comment: Implements kickside.contract:resource_registry.list_resources for uploads.
    source: file://list_resources_func.lua
    modules: [security, json]
    imports:
      metadata_sanitizer: kickside.uploads:metadata_sanitizer
      upload_query_repo: kickside.uploads.persist:upload_query_repo
    method: handle

  - name: file_provider_func
    kind: function.lua
    meta:
      comment: file_provider.get_info -- resolve a file_uuid to its upload record for session prompt building.
    source: file://file_provider_func.lua
    method: get_info
    imports:
      upload_query_repo: kickside.uploads.persist:upload_query_repo
      upload_response: kickside.uploads.api:upload_response

  - name: delete_uploads_func
    kind: function.lua
    meta:
      comment: kickside.contract:deletable.delete for the uploads component — tears down the actor's uploads, artifacts, chunks, and blob storage.
    security:
      policies:
      - kickside.uploads:thread_deleted_publish
    source: file://delete_uploads_func.lua
    method: handle
    modules: [ctx]
    imports:
      component: kickside.component:component
      upload_lib: kickside.uploads:uploads
      upload_query_repo: kickside.uploads.persist:upload_query_repo
      upload_read_model: kickside.uploads.persist:upload_read_model

  - name: storage_adapter_default
    kind: library.lua
    source: file://storage_adapter_default.lua
    modules:
    - fs
    - cloudstorage
    - uuid
    - logger
    imports:
      storage_location: kickside.uploads.binding:storage_location
  - name: storage_location
    kind: library.lua
    source: file://storage_location.lua
  - name: processing_hooks_default
    kind: library.lua
    source: file://processing_hooks_default.lua
  - name: storage_catalog
    kind: library.lua
    source: file://storage_catalog.lua
    modules:
    - sql
    - env
    imports:
      storage_location: kickside.uploads.binding:storage_location
