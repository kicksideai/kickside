version: "1.0"
namespace: app.legacy_storage
entries:
  - name: environment
    kind: library.lua
    source: file://environment.lua
    modules: [env]
  - name: catalog
    kind: library.lua
    source: file://../fixtures/storage_catalog.lua
    modules: [sql]
    imports:
      env: app.legacy_storage:environment
      storage_location: kickside.uploads.binding:storage_location
  - name: cleanup
    kind: library.lua
    source: file://../fixtures/relocation_cleanup_repo.lua
    modules: [json]
    imports:
      uploads_resources: kickside.uploads.binding:uploads_resources
      storage_catalog: app.legacy_storage:catalog
      persisted_json: kickside.contract:persisted_json
  - name: test
    kind: function.lua
    source: file://test.lua
    method: run
    meta: {type: test, suite: packed_storage}
    modules: [uuid, sql]
    imports:
      test: wippy.test:test
      catalog: app.legacy_storage:catalog
      configured_env: app.legacy_storage:environment
      cleanup: app.legacy_storage:cleanup
      adapter: app:packed_cloud_adapter
      cloud: app:packed_cloud_fake
      records: kickside.uploads.persist:upload_record_repo
      resources: kickside.uploads.binding:uploads_resources
