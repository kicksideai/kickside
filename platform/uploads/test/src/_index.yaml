  - name: archive_prepare_probe
    kind: function.lua
    source: file://archive_prepare_probe.lua
    method: prepare

  - name: archive_prepare_probe.stage
    kind: registry.entry
    meta:
      type: upload.stage
    scope: universal
    prepare_archive: app:archive_prepare_probe
