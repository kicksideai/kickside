      test: wippy.test:test

  - name: dep.kickside.security
    kind: ns.dependency
    component: kickside/security
    version: '*'
    parameters:
    - {name: api_router, value: app:api}
    - {name: ui_server, value: app:gateway}
    - {name: target_db, value: app:db}
