version: '1.0'
namespace: app
entries:
  - name: key_owner_test
    kind: function.lua
    meta: {type: test, suite: key_owner}
    source: file://../key_owner_test.lua
    method: run
    modules: [funcs, security, env]
    imports:
      test: wippy.test:test
      upload_tokens: kickside.uploads.persist:upload_tokens
  - name: key_owner_probe
    kind: function.lua
    source: file://../key_owner_test.lua
    method: probe
    modules: [funcs, security, env]
    imports:
      test: wippy.test:test
      upload_tokens: kickside.uploads.persist:upload_tokens

  - name: key_owner_caller
    kind: security.policy
    policy:
      resources: '*'
      actions: [funcs.call, funcs.security, registry.get, registry.find, db.get, store.get, store.key.get, store.key.set, process.registry.lookup, process.send, pg.open, pg.broadcast]
      effect: allow

  - name: key_owner_probe_call
    kind: security.policy
    policy:
      resources: [app:key_owner_probe]
      actions: [funcs.call, funcs.security]
      effect: allow
