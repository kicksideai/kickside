version: '1.0'
override:
  app:db:file: ${sqlite_path}
  kickside.core.jobs.service:worker.service:lifecycle.auto_start: false
workspace:
  replacements:
    kickside/realtime-dispatch: ../../../core/realtime-dispatch
    kickside/component: ../../../core/component
    kickside/contract: ../../../core/contract
    kickside/core: ../../../core/core
    kickside/jobs: ../../../core/jobs
    kickside/uploads: ..
    kickside/execution: ../../../core/execution
    kickside/users: ../../users
    kickside/security: ../../security
    kickside/realtime: ../../realtime
    kickside/settings: ../../settings
vars:
  sqlite_path: ':memory:'
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_uploads
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:dedup_migration_db:kind: db.sql.postgres
      app:dedup_migration_db:host: ${pg_host}
      app:dedup_migration_db:port: ${pg_port}
      app:dedup_migration_db:database: ${pg_database}
      app:dedup_migration_db:username: ${pg_username}
      app:dedup_migration_db:password: ${pg_password}
      app:dedup_migration_db:options.sslmode: disable
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
registry:
  dispatch_internal_kinds:
  - registry.entry
  - ns.requirement
  - ns.dependency
  - ns.definition
  - security.scope
