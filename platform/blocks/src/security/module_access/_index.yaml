version: '1.0'
namespace: kickside.blocks.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Blocks
    surface: kickside.blocks
    intent: module_access
    includes:
    - kickside.blocks.security:module_runtime
    - kickside.blocks.security:await_execution
  groups: []
  policy:
    resources:
    - kickside.blocks:*
    - kickside.blocks.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: await_execution
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.blocks:await
    actions:
    - process.spawn
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application group with member access to this module.
  targets:
  - entry: kickside.blocks.security:module_access
    path: .groups +=
  - entry: kickside.blocks.security:module_runtime
    path: .groups +=
  - entry: kickside.blocks.security:await_execution
    path: .groups +=
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.blocks:*
    - kickside.blocks.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
