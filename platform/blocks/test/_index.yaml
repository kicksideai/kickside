version: "1.0"
namespace: app

entries:
  - name: dep.kickside.security
    kind: ns.dependency
    version: '*'
    component: kickside/security
    parameters:
      - {name: api_router, value: app:api}
      - {name: ui_server, value: app:gateway}
      - {name: target_db, value: app:db}
      - {name: process_host, value: app:processes}

  - name: definition
    kind: ns.definition
    meta:
      title: Blocks Contract Test Application
      comment: Isolated harness for the canonical Block declaration and lowering contract.

  - name: public_block
    kind: registry.entry
    meta:
      type: kickside.block
      public: true
      title: Public proof Block
    data:
      block:
        api_version: kickside.block/v1
        input: { type: object, additionalProperties: true }
        config: { type: object, additionalProperties: false, properties: {} }
        output: { type: object, additionalProperties: true }
        ports: [{ id: result, direction: out }]
        execution: { kind: function, function_id: app:public_tool_table }

  - name: public_tool_table
    kind: function.lua
    meta:
      type: tool
      public: true
      title: Lookup account
      llm_description: Looks up one account by its exact identifier.
      icon: tabler:search
      input_schema:
        type: object
        additionalProperties: false
        required: [account_id]
        properties:
          account_id: { type: string }
          include_closed: { type: boolean }
      output_schema:
        type: object
        additionalProperties: false
        required: [name]
        properties:
          name: { type: string }
    source: file://tool_fixture.lua
    method: invoke

  - name: public_tool_json
    kind: function.lua
    meta:
      type: tool
      public: true
      private: false
      title: Score account
      input_schema: '{"type":"object","additionalProperties":false,"required":["score"],"properties":{"score":{"type":"number"}}}'
      output_schema: '{"type":"object","properties":{"accepted":{"type":"boolean"}}}'
    source: file://tool_fixture.lua
    method: invoke

  - name: malformed_schema_tool
    kind: function.lua
    meta:
      type: tool
      public: true
      title: Malformed schema proof
      input_schema: '{not-json'
      output_schema: 42
    source: file://tool_fixture.lua
    method: invoke

  - name: private_tool
    kind: function.lua
    meta: { type: tool, public: true, private: true, input_schema: '{"type":"object"}' }
    source: file://tool_fixture.lua
    method: invoke

  - name: missing_public_tool
    kind: function.lua
    meta: { type: tool, input_schema: '{"type":"object"}' }
    source: file://tool_fixture.lua
    method: invoke

  - name: malformed_private_tool
    kind: function.lua
    meta: { type: tool, public: true, private: "false", input_schema: '{"type":"object"}' }
    source: file://tool_fixture.lua
    method: invoke

  - name: wrong_kind_tool
    kind: library.lua
    meta: { type: tool, public: true, input_schema: '{"type":"object"}' }
    source: file://tool_fixture.lua

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    file: "${sqlite_path}"

  - name: env_storage
    kind: env.storage.file
    meta: { type: envstorage }
    file_path: ./.proof/native-wait.env
    auto_create: true

  - name: processes
    kind: process.host
    host: { max_processes: 100 }
    lifecycle: { auto_start: true }

  - name: gateway
    kind: http.service
    # An ephemeral port: harnesses of concurrent suite runs never collide on a
    # fixed port, whose failed bind would stall this runtime's service starts.
    addr: :0
    lifecycle: { auto_start: true }

  - name: api
    kind: http.router
    meta: { server: gateway }
    prefix: /proof

  - name: public_api
    kind: http.router
    meta: { server: gateway }
    prefix: /unused

  - name: proof_policy
    kind: security.policy
    groups: [proof_runtime, "app:proof_policy"]
    policy: { resources: '*', actions: '*', effect: allow }

  - name: user
    kind: security.policy
    groups: [proof_runtime]
    policy: { resources: '*', actions: '*', effect: allow }

  - name: dep.wippy.llm
    kind: ns.dependency
    component: wippy/llm
    version: "*"
    parameters:
      - { name: env_storage, value: app:env_storage }

  - name: dep.wippy.relay
    kind: ns.dependency
    component: wippy/relay
    version: "*"
    parameters:
      - { name: user_security_scope, value: app:user }
      - { name: env_storage, value: app:env_storage }
      - { name: application_host, value: app:processes }

  - name: dep.wippy.views
    kind: ns.dependency
    component: wippy/views
    version: "*"
    parameters:
      - { name: api_router, value: app:public_api }
      - { name: env_storage, value: app:env_storage }

  - name: dep.wippy.session
    kind: ns.dependency
    component: wippy/session
    version: "*"
    parameters:
      - { name: api_router, value: app:public_api }
      - { name: env_storage, value: app:env_storage }
      - { name: delegation_func_id, value: userspace.dataflow.session:delegate }

  - name: dep.wippy.bootloader
    kind: ns.dependency
    component: wippy/bootloader
    version: "*"
    parameters:
      - { name: application_host, value: app:processes }
      - { name: env_storage, value: app:env_storage }

  - name: dep.wippy.migration
    kind: ns.dependency
    component: wippy/migration
    version: "*"
    parameters:
      - { name: app_db, value: app:db }

  - name: dep.kickside.blocks
    kind: ns.dependency
    component: kickside/blocks
    version: "*"
    parameters:
      - { name: process_host, value: app:processes }

  - name: dep.kickside.core
    kind: ns.dependency
    component: kickside/core
    version: '*'
    parameters:
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 3
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.threads:user_security_scope
      value: app:user
    - name: kickside.core.threads:security_scope
      value: app:user
    - name: kickside.core.threads:env_storage
      value: app:env_storage
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.retention:security_scope
      value: app:user
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.jobs:process_host
      value: app:processes
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.jobs:process_host
      value: app:processes

  - name: dep.kickside.users
    kind: ns.dependency
    component: kickside/users
    version: "*"
    parameters:
      - { name: kickside.users:env_storage, value: app:env_storage }
      - { name: kickside.users:public_router, value: app:public_api }
      - { name: kickside.users:api_router, value: app:api }
      - { name: kickside.users:ui_server, value: app:gateway }
      - { name: kickside.users:target_db, value: app:db }
      - { name: kickside.users:user_security_scope, value: app:user }
      - { name: kickside.users:admin_security_scope, value: app:user }
      - { name: kickside.users:login_role_resource, value: app:* }
      - { name: kickside.settings:target_db, value: app:db }
      - { name: kickside.settings:api_router, value: app:api }
      - { name: kickside.settings:ui_server, value: app:gateway }

  - name: native_wait_start
    kind: function.lua
    source: file://native_wait_proof.lua
    method: start
    modules: [uuid]
    imports:
      client: userspace.dataflow:client
      consts: userspace.dataflow:consts

  - name: native_wait_arm
    kind: function.lua
    source: file://native_wait_arm.lua
    method: arm
    modules: [security, sql, funcs]

  - name: native_wait_phase_one
    kind: process.lua
    source: file://native_wait_phase.lua
    method: phase_one
    security:
      actor: { id: 'system:native-wait-owner', meta: { system: true } }
      policies: [app:proof_policy]
    modules: [funcs, security, sql, time]
    imports:
      resume: kickside.blocks:resume

  - name: native_wait_phase_two
    kind: process.lua
    source: file://native_wait_phase.lua
    method: phase_two
    security:
      actor: { id: 'system:native-wait-owner', meta: { system: true } }
      policies: [app:proof_policy]
    modules: [funcs, security, sql, time]
    imports:
      resume: kickside.blocks:resume
