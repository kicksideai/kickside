version: "1.0"
namespace: app.env

# Mirrors the real app's env storage id (app.env:store) so dep modules that
# resolve their env knobs against that storage id (kickside/users, session,
# relay, ...) work in isolation. Harness-only; excluded from publish.

entries:
  - name: store
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true
