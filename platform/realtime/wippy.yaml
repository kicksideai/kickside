repository: https://github.com/kicksideai/kickside
homepage: https://wippy.ai
keywords:
  - kickside
  - realtime
  - relay
  - broadcast
exclude:
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
