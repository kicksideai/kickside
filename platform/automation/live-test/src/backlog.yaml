version: "1.0"
namespace: kickside.automation
entries:
  - name: round_backlog_job
    kind: function.lua
    source: file://test_src/suites/round/backlog_job.lua
    method: run
    modules: [process, time, channel]
  - name: round_backlog_test
    kind: function.lua
    meta: { type: test, suite: kickside_automation_round_backlog }
    source: file://test_src/suites/round/backlog_test.lua
    method: run
    modules: [time, channel, process, uuid, registry, json]
    imports:
      test: wippy.test:test
      jobs: kickside.core.jobs:jobs
      slot: kickside.automation:slot
      jobs_config: kickside.core.jobs:config
      round_harness: kickside.automation:round_harness
  - name: round_backlog_worker
    kind: library.lua
    source: file://round_worker_source.lua
    imports:
      round_runner: kickside.automation:round_runner
  - name: round_backlog_entry
    kind: function.lua
    source: file://test_src/suites/round/backlog_entry.lua
    method: run
    modules: [time]
    imports:
      round_worker: kickside.automation:round_backlog_worker
      round_harness: kickside.automation:round_harness
