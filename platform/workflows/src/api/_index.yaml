    func: redo
    path: /workflows/{id}/redo

  - name: delete_workflow
    kind: function.lua
    meta: { comment: "DELETE /api/v1/workflows/{id} — delete a workflow through canonical teardown." }
    source: file://delete_workflow.lua
    method: handler
    modules: [http, security]
    imports:
