  - name: undo.endpoint
    kind: http.endpoint
    meta: {}
    method: POST
    func: undo
    path: /workflows/{id}/undo

  - name: redo
    kind: function.lua
    meta: { comment: "POST /api/v1/workflows/{id}/redo — redo the last undone batch." }
