version: "1.0"
namespace: kickside.workflows.api

# Authenticated definition-plane API. create/list/delete manage workflow components;
# state/events read the folded definition; apply/undo/redo write through the
# workflow writer. Routers are injected by the root kickside.workflows:api_router
# requirement. Access is gated per-endpoint via the component service.

entries:
  - name: exec_api
    kind: library.lua
    meta: { comment: "Execution-plane API helpers shared by the HTTP handlers and contract tests." }
    source: file://exec_api.lua
    modules: [http, json, security]
    imports:
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo
      version_publish: kickside.workflows.repo:version_publish
      version_read: kickside.workflows.repo:version_read
      runs_launch: kickside.workflows.runs:runs_launch
      runs_read: kickside.workflows.runs:runs_read
      runs_completion: kickside.workflows.runs:runs_completion
      runs_debug: kickside.workflows.runs:runs_debug
      runs_state: kickside.workflows.runs:runs_state

  - name: definitions_api
    kind: library.lua
    meta: { comment: "Flow artifact export, typed materialization, package declaration import, and draft creation helpers." }
    source: file://definitions_api.lua
    modules: [http, json, security]
    imports:
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo
      workflow: kickside.workflows:workflow
      workflow_state: kickside.workflows:workflow_state
      definitions: kickside.workflows.definitions:definitions_lib
      flow_contract: kickside.blocks:flow_contract
      version_read: kickside.workflows.repo:version_read
      types: kickside.workflows:types
      mapping: kickside.workflows.execution:mapping
  - name: create_workflow
    kind: function.lua
    meta: { comment: "POST /api/v1/workflows — create a workflow component; idempotency_key replays a duplicate create for the same actor." }
    source: file://create_workflow.lua
    method: handler
    modules: [http, json, security]
    imports:
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo

  - name: create_workflow.endpoint
    kind: http.endpoint
    meta: {}
    method: POST
    func: create_workflow
    path: /workflows

  - name: list_workflows
    kind: function.lua
    meta: { comment: "GET /api/v1/workflows — the caller's accessible workflows; published=true filters to published rows." }
    source: file://list_workflows.lua
    method: handler
    modules: [http, security]
    imports:
      http_params: kickside.contract:http_params
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo

  - name: list_workflows.endpoint
    kind: http.endpoint
    meta: {}
    method: GET
    func: list_workflows
    path: /workflows

  - name: list_published
    kind: function.lua
    meta:
      comment: GET /api/v1/workflows/published — exact published Flows the caller can bind to an Automation.
    source: file://list_published.lua
    method: handler
    modules: [http, security]
    imports:
      http_params: kickside.contract:http_params
      http_errors: kickside.contract:http_errors
      published_catalog: kickside.workflows.catalog:published_catalog

  - name: list_published.endpoint
    kind: http.endpoint
    meta: {}
    method: GET
    func: list_published
    path: /workflows/published

  - name: get_state
    kind: function.lua
    meta: { comment: "GET /api/v1/workflows/{id}/state — folded definition snapshot." }
    source: file://get_state.lua
    method: handler
    modules: [http, security]
    imports:
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo
      workflow: kickside.workflows:workflow

  - name: get_state.endpoint
    kind: http.endpoint
    meta: {}
    method: GET
    func: get_state
    path: /workflows/{id}/state

  - name: export_definition
    kind: function.lua
    meta: { comment: "GET /api/v1/workflows/{id}/export — READ-gated published Flow artifact; never compiled commands." }
    source: file://definitions_api.lua
    method: export_handler
    modules: [http, json, security]
    imports:
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo
      workflow: kickside.workflows:workflow
      workflow_state: kickside.workflows:workflow_state
      definitions: kickside.workflows.definitions:definitions_lib
      flow_contract: kickside.blocks:flow_contract
      version_read: kickside.workflows.repo:version_read
      types: kickside.workflows:types
      mapping: kickside.workflows.execution:mapping

  - name: export_definition.endpoint
    kind: http.endpoint
    meta: {}
    method: GET
    func: export_definition
    path: /workflows/{id}/export

  - name: import_definition
    kind: function.lua
    meta: { comment: "POST /api/v1/workflows/import — WRITE-gated explicit {flow,bindings} materialization; creates a new unpublished draft." }
    source: file://definitions_api.lua
    method: import_handler
    modules: [http, json, security]
    imports:
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo
      workflow: kickside.workflows:workflow
      workflow_state: kickside.workflows:workflow_state
      definitions: kickside.workflows.definitions:definitions_lib
      flow_contract: kickside.blocks:flow_contract
      version_read: kickside.workflows.repo:version_read
      types: kickside.workflows:types
      mapping: kickside.workflows.execution:mapping

  - name: import_definition.endpoint
    kind: http.endpoint
    meta: {}
    method: POST
    func: import_definition
    path: /workflows/import

  - name: get_events
    kind: function.lua
    meta: { comment: "GET /api/v1/workflows/{id}/events — event tail after from_seq." }
    source: file://get_events.lua
    method: handler
    modules: [http, security]
    imports:
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo
      workflow: kickside.workflows:workflow

  - name: get_events.endpoint
    kind: http.endpoint
    meta: {}
    method: GET
    func: get_events
    path: /workflows/{id}/events

  - name: apply
    kind: function.lua
    meta: { comment: "POST /api/v1/workflows/{id}/apply — apply a command batch through the workflow writer." }
    source: file://write_api.lua
    method: apply
    modules: [http, json, security]
    imports:
      http_errors: kickside.contract:http_errors
      workflow_repo: kickside.workflows.repo:repo
      workflow: kickside.workflows:workflow
      workflow_realtime: kickside.workflows:realtime
      workflow_types: kickside.workflows:types

  - name: apply.endpoint
    kind: http.endpoint
    meta: {}
    method: POST
    func: apply
    path: /workflows/{id}/apply

  - name: set_workflow_labels
    kind: function.lua
    meta: { comment: "POST /api/v1/workflows/{id}/labels — replace flat definition-owned workflow labels." }
    source: file://write_api.lua
    method: set_labels
    modules: [http, json, security]
    imports:
      http_errors: kickside.contract:http_errors
