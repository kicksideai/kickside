                "key",
                "title",
                "version",
                "refs",
                "document",
                "checksum"
              ],
              "additionalProperties": false
            }
          }
        }
      output_schema: |
        {
          "type": "object",
          "description": "Envelope for every action. Failures return no result and a typed tool error with a clear message.",
          "properties": {
            "success": {"type": "boolean", "const": true},
            "workflow": {
              "type": "object",
              "description": "create/import: the new draft. Its `id` is the workflow id every later action takes — read it from here, the envelope carries no top-level id for create."
            },
            "flow": {"type": "object", "description": "import/restore: the created draft (flow_id, title, status)."},
            "id": {"type": "string"},
            "events": {"type": "array", "description": "apply: produced definition events.", "items": {"type": "object"}},
            "head_seq": {"type": "integer", "description": "apply: definition head sequence after the batch."},
            "state": {"type": "object", "description": "apply: folded definition state after the batch."},
            "version": {"type": "integer", "description": "publish: the allocated immutable version."},
            "def_seq": {"type": "integer", "description": "publish: definition sequence frozen into the version."},
            "hash": {"type": "string", "description": "publish: content hash of the compiled revision."}
          },
          "required": ["success"]
        }
      llm_alias: WorkflowsManage
      llm_description: "Build and publish workflows, including Lua scripts with the Run Code Block from WorkflowsRead catalog. For recurring tasks (every minute, hourly, or cron), publish first then schedule its exact {kind: flow, id, version} with RecurringTasks from the Automations Manager capability. Manage workflows: create a draft, import a portable Flow artifact (from flows_read export) as a new unpublished draft, apply a definition command batch through the workflow writer, publish an immutable version, restore a frozen version as a new draft, or delete. Writes carry the same validation and realtime broadcast as the editor. Failures return no result and a typed tool error with a clear message."
      mcp:
        required_scopes: [state.write]
    source: file://flows_manage.lua
    method: handler
    modules: [security]
    imports:
      tool_result: kickside.contract:tool_result
      flows_support: kickside.workflows.agent:flows_support
      workflow_repo: kickside.workflows.repo:repo
      version_publish: kickside.workflows.repo:version_publish
      definitions_api: kickside.workflows.api:definitions_api
      workflow: kickside.workflows:workflow
      workflow_realtime: kickside.workflows:realtime
