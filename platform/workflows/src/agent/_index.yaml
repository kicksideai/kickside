                  "minimum": 1
                },
                "refs": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "key": {
                        "type": "string",
                        "minLength": 1
                      },
                      "kind": {
                        "type": "string",
                        "enum": [
                          "component",
                          "flow",
                          "value"
                        ]
                      },
                      "node_id": {
                        "type": "string",
                        "minLength": 1
                      },
                      "config_path": {
                        "type": "array",
                        "minItems": 1,
                        "items": {
                          "type": "string",
                          "minLength": 1
                        }
                      }
                    },
                    "required": [
                      "key",
                      "kind",
                      "node_id",
                      "config_path"
                    ],
                    "additionalProperties": false
                  }
                },
                "document": {
                  "type": "object",
                  "properties": {
                    "nodes": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "id": {
                            "type": "string",
                            "minLength": 1
                          },
                          "kind": {
                            "type": "string",
