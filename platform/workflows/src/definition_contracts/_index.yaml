version: "1.0"
namespace: kickside.workflows
entries:
  - name: workflow_kind
    kind: contract.binding
    meta:
      announced: false
      name: flow
      title: Workflow
      icon: tabler:route
      category: flows
      comment: A user-owned visual Workflow definition. The component id is the Workflow id; authoring and immutable published versions are module-owned. Execution is composed separately through exact references.
      class: flow
      thread: { class: flow }
      component:
        create:
          view: kickside.workflows:workflow_setup_view
        manage:
          view: kickside.workflows:workflow_builder_view
          deep_link: true
      group: Workflows
      events:
        input: []
        output:
          - type: kickside.workflows.runs.events:started
            system_only: true
          - type: kickside.workflows.runs.events:finished
            system_only: true
          - type: kickside.workflows.runs.events:failed
            system_only: true
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.workflows.binding:get_status_func
      - contract: kickside.contract:deletable
        methods:
          delete: kickside.workflows.binding:delete_workflow_func

  # ─── Published lifecycle source ports — canonical run events on a selected
  # Flow component thread. These make Flow chains wireable by the standard
  # automation source catalog; the output faces derive from Workflows-owned run events.
