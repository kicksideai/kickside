organization: kickside
module: workflows
type: plugin
description: Optional visual authoring, versioning, and run lifecycle for published Workflows composed from canonical Blocks and native Dataflow nodes.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/kickside
homepage: https://wippy.ai
keywords:
  - kickside
  - workflows
  - builder
  - automation
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
  environment:
    - test
    - demo
    - fixture
    - proof
embed:
  - kickside.workflows:ui_fs
exclude:
  - "app:**"
  - "app.env:**"
  - "ui/node_modules:**"
  - "ui/coverage:**"
  - "ui/node_modules/**"
  - "ui/coverage/**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - ".test-modules/**"
  - ".test-modules:**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
