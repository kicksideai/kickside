version: "1.0"
namespace: app

# Standalone harness for kickside/workflows. Provides the host resources the compiler,
# version plane, run launcher, and automation kind require (app:db, routers, process
# host, env storage, a permissive scope) and boots the automation + dataflow stack so
# its harness-owned suites run in isolation. The module loads once through its
# dependency replacement. Test source lives in this harness under suites/.
# Harness-only; excluded from publish.

entries:
  - name: definitions_api_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Flow artifact HTTP helpers — published READ export and new-draft import.
    source: file://../../suites/definitions_api_test.lua
    method: run
    modules: [funcs, security]
    imports:
      test: wippy.test:test
      types: kickside.workflows:types
      workflow_repo: kickside.workflows.repo:repo
      workflow: kickside.workflows:workflow
      version_publish: kickside.workflows.repo:version_publish
      version_read: kickside.workflows.repo:version_read
      definitions_api: kickside.workflows.api:definitions_api
      flow_contract: kickside.blocks:flow_contract

  - name: definitions_api_seam
    kind: function.lua
    meta:
      type: test_helper
      private: true
      environment: test
      comment: Actor-bound setup and import seam for Flow artifact API tests.
    source: file://../../suites/definitions_api_test.lua
    method: seam
    modules: [funcs, security]
    imports:
      test: wippy.test:test
      types: kickside.workflows:types
      workflow_repo: kickside.workflows.repo:repo
      workflow: kickside.workflows:workflow
      version_publish: kickside.workflows.repo:version_publish
      version_read: kickside.workflows.repo:version_read
      definitions_api: kickside.workflows.api:definitions_api
      flow_contract: kickside.blocks:flow_contract

  # ─── Flow component binding (authoring identity and teardown only) ──────
  - name: workflow_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Definition engine — batch validation atomicity, in-batch refs, cascade remove, layout viewport, seq monotonicity + isolation, delete purge.
    source: file://../../suites/workflow_test.lua
    method: run
    modules: [sql, json, uuid, funcs]
    imports:
      test: wippy.test:test
      workflow: kickside.workflows:workflow
      workflow_state: kickside.workflows:workflow_state
      version_publish: kickside.workflows.repo:version_publish
      store: kickside.workflows.store:store
      types: kickside.workflows:types

  - name: undo_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Undo/redo — inverse construction, id preservation, stack cap, redo clearing, DB replay.
    source: file://../../suites/undo_test.lua
    method: run
    modules: [sql, json, uuid, funcs, process, security, channel, time]
    imports:
      test: wippy.test:test
      workflow: kickside.workflows:workflow
      workflow_state: kickside.workflows:workflow_state
      workflow_inverse: kickside.workflows:workflow_inverse
      undo: kickside.workflows.undo:undo
      types: kickside.workflows:types

  - name: undo_restart_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Workflow undo history is durable and covers every committed write.
    source: file://../../suites/undo_restart_test.lua
    method: run
    modules: [sql, json, uuid, funcs, process, security, channel, time]
    imports:
      test: wippy.test:test
      workflow: kickside.workflows:workflow
      store: kickside.workflows.store:store
      workflow_state: kickside.workflows:workflow_state
      workflow_inverse: kickside.workflows:workflow_inverse
      undo: kickside.workflows.undo:undo
      types: kickside.workflows:types
      workflow_repo: kickside.workflows.repo:repo

  - name: undo_access_probe
    kind: function.lua
    meta:
      type: test_helper
      private: true
      environment: test
      comment: Workflow undo history is durable and covers every committed write.
    source: file://../../suites/undo_restart_test.lua
    method: access_probe
    modules: [sql, json, uuid, funcs, process, security, channel, time]
    imports:
      test: wippy.test:test
      workflow: kickside.workflows:workflow
      store: kickside.workflows.store:store
      workflow_state: kickside.workflows:workflow_state
      workflow_inverse: kickside.workflows:workflow_inverse
      undo: kickside.workflows.undo:undo
      types: kickside.workflows:types
      workflow_repo: kickside.workflows.repo:repo

  - name: workflow_signal_constrained
    kind: security.policy
    meta:
      comment: Runtime scope without process messaging authority, as a group principal holds; workflow signals reach their processes through workflows identities.
    policy:
      resources: '*'
      actions: [funcs.call, funcs.security, contract.get, contract.open, contract.call, contract.security,
        db.get, registry.get, registry.find, env.get, process.spawn, process.host]
      effect: allow

  - name: workflow_signal_probe
    kind: function.lua
    meta:
      type: test_helper
      comment: Runs the maintenance wake in the caller's frame.
    source: file://../../suites/maintenance_wake_probe.lua
    method: run
    imports:
      maintenance_wake: kickside.workflows.runs:maintenance_wake

  - name: versions_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Versions — publish folds+compiles+allocates head+1, refuses an invalid graph, enforces the size cap, appends the version.published marker, and lists/gets.
    source: file://../../suites/versions_test.lua
    method: run
    modules: [sql, json, uuid, funcs, env]
    imports:
      test: wippy.test:test
      workflow: kickside.workflows:workflow
      version_publish: kickside.workflows.repo:version_publish
      version_read: kickside.workflows.repo:version_read
      block_catalog: kickside.workflows.catalog:block_catalog
      canonical_json: kickside.contract:canonical_json
      store: kickside.workflows.store:store
      types: kickside.workflows:types

  - name: kind_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Flow component purity — authoring identity, management, deletion, lifecycle event declarations, and the separate Automation creation surface.
    source: file://../../suites/kind_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      types: kickside.workflows:types

  - name: destination_bindings_test
