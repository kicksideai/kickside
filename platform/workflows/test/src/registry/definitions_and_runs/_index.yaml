      admission: kickside.workflows.runs:admission
      store: kickside.workflows.store:store
      admission_scaffold: app:admission_scaffold

  - name: admission_payload_policy_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Admission rejects a creation payload above the owner-policy byte cap.
    source: file://../../suites/admission_payload_policy_test.lua
    method: run
    modules: [uuid, json, registry]
    imports:
      test: wippy.test:test
      admission: kickside.workflows.runs:admission
      store: kickside.workflows.store:store
      policy_config: kickside.workflows:policy_config
      run_time: kickside.workflows.runs:run_time
      launch_budget: kickside.workflows.runs:launch_budget

  - name: utc_timestamp_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Admission and definition timestamps are written in canonical UTC.
    source: file://../../suites/utc_timestamp_test.lua
    method: run
