    source: file://../../suites/destination_bindings_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      destination_bindings: kickside.workflows.binding:destination_bindings

  - name: admission_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Admission, recovery, capacity, and terminal publication invariants.
    source: file://../../suites/admission_test.lua
