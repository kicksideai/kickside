    imports:
      test: wippy.test:test
      store_state: kickside.workflows.store:store_state
      admission: kickside.workflows.runs:admission

  - name: launch_reconciliation_live_test
    kind: function.lua
    meta:
      type: test
      suite: workflows
      group: KickSide Workflows
      comment: Published Dataflow status, crash recovery, and idempotent terminal publication.
