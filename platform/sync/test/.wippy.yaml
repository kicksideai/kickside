version: '1.0'
override:
  app:db:file: ${sqlite_path}
  kickside.users:scope_resolver_binding:data:
    contracts:
    - contract: kickside.contract:scope_resolver
      methods:
        resolve: kickside.users.binding:scope_resolver_func
workspace:
  replacements:
    kickside/security: ../../security
    kickside/realtime-dispatch: ../../../core/realtime-dispatch
    kickside/inbox: ../../inbox
    kickside/blocks: ../../blocks
    kickside/sync: ..
    kickside/automation: ../../automation
    kickside/core: ../../../core/core
    kickside/jobs: ../../../core/jobs
    kickside/component: ../../../core/component
    kickside/contract: ../../../core/contract
    kickside/users: ../../users
    kickside/execution: ../../../core/execution
    kickside/transform: ../../transform
    kickside/connection: ../../connection
    kickside/oauth: ../../oauth
    kickside/settings: ../../settings
    kickside/atlassian: ../../../../providers/atlassian
vars:
  sqlite_path: ':memory:'
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_sync
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
registry:
  dispatch_internal_kinds:
  - registry.entry
  - ns.requirement
  - ns.dependency
  - ns.definition
  - security.scope
