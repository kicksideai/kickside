version: "1.0"
namespace: app

# Standalone harness for kickside/ui. The module's own src (incl. its nav_test
# suite — pure effective() merge logic) loads directly via directories.src=../src.
# This file supplies explicit module dependency parameters, a gateway for static
# UI, and the bootloader. Harness-only.

entries:
  - name: instance_config
    kind: registry.entry
    root: ""

  - name: branding_fs
    kind: fs.directory
    directory: "${instance_data_dir}/branding"
    auto_init: true
    mode: "0700"

  - name: module_source
    kind: fs.directory
    directory: ..

  - name: project_fs
    kind: fs.directory
    base: project
    directory: .

  - name: api.auth
    kind: http.router
    meta:
      server: gateway
    prefix: /api/auth
    middleware: [token_auth]
    options:
      token_store: kickside.users.security:tokens

  - name: upload_logo.endpoint
    kind: http.endpoint
    meta:
      router: api.auth
    method: POST
    path: /nav/logo
    func: kickside.ui.api:upload_logo

  - name: set_config.endpoint
    kind: http.endpoint
    meta:
      router: api.auth
    method: PUT
    path: /nav/config
    func: kickside.ui.api:set_config

  - name: list_nav.endpoint
    kind: http.endpoint
    meta:
      router: api.auth
    method: GET
    path: /nav/list
    func: kickside.ui.api:list_nav

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    file: "${sqlite_path}"

  - name: user
    kind: security.policy
    groups: [ui_test]
    policy: { resources: '*', actions: '*', effect: allow }

  - name: admin
    kind: security.policy
    groups: [ui_test, app:ui_test_admin]
    policy: { resources: '*', actions: '*', effect: allow }

  # An administrator scope without realtime broadcast or process messaging
  # authority, as a narrowly granted operator holds.
  - name: admin_without_broadcast
    kind: security.policy
    groups: [app:ui_test_admin_without_broadcast]
    policy:
      resources: '*'
      actions: [access, funcs.call, funcs.security, funcs.context, contract.get, contract.open, contract.call,
        contract.security, contract.implementations, contract.context, db.get, registry.get, registry.find, env.get,
        store.get, store.key.get, store.key.set, store.key.delete]
      effect: allow

  - name: nav_realtime_binding
    kind: contract.binding
    meta:
      comment: Harness realtime implementation recording nav broadcasts and their authorization.
    contracts:
      - contract: kickside.contract:realtime
        default: true
        methods:
          broadcast: kickside.ui:nav_realtime_broadcast
          notify: kickside.ui:nav_realtime_notify

  # A non-admin member: full runtime capability without the UI administrator
  # gate or the settings write endpoint.
  - name: member
    kind: security.policy
    policy: { resources: '*', actions: '*', effect: allow }

  - name: member_admin_denied
    kind: security.policy
    policy:
      resources:
        - kickside.ui:system_onboarding
        - kickside.settings.api:put_settings.endpoint
        - kickside.settings.api:list_settings.endpoint
      actions: access
      effect: deny

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server.
    addr: :19110
    lifecycle:
      auto_start: true

  # Mirror the application facade wiring so the resolver test reads the real
  # static CSS variable map instead of an unbound requirement.
  - name: facade_content_fs
    kind: fs.directory
    directory: ../../../app/static

  - name: api
    kind: http.router
    meta:
      comment: Test API router.
      server: gateway
    prefix: /api

  - name: api.public
    kind: http.router
    meta:
      comment: Test public API router.
      server: gateway
    prefix: /api/public

  - name: api.views
    kind: http.router
    meta:
      comment: Separate router for the generic Views API pulled in by kickside/users.
      server: gateway
    prefix: /views

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: dep.wippy.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Bootloader boots the harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  - name: dep.kickside.ui
    version: '*'
    kind: ns.dependency
    meta:
      comment: UI mounted as a root so mandatory host requirements are exercised.
    component: kickside/ui
    parameters:
    - name: kickside.ui:api_router
      value: app:api
    - name: kickside.ui:public_api_router
      value: app:api.public
    - name: kickside.ui:branding_fs
      value: app:branding_fs
    - name: kickside.ui:ui_server
      value: app:gateway
    - name: kickside.ui.security:admin_scope
      value: app:admin

  - name: dep.kickside.settings
    version: "*"
    kind: ns.dependency
    component: kickside/settings
    parameters:
      - name: kickside.settings:target_db
        value: app:db
      - name: kickside.settings:api_router
        value: app:api
      - name: kickside.settings:ui_server
        value: app:gateway

  - name: projection_caller
    kind: security.policy
    policy:
      actions: funcs.call
      resources: kickside.security.binding:materialize_group_set
      effect: allow

  - name: dep.kickside.security
    kind: ns.dependency
    version: '*'
    component: kickside/security
    parameters:
      - {name: api_router, value: app:api}
      - {name: ui_server, value: app:gateway}
      - {name: target_db, value: app:db}
      - {name: process_host, value: app:processes}

  # Users supplies the real per-user profile contract the splash seen list lives
  # in.
  - name: dep.kickside.users
    version: '*'
    kind: ns.dependency
    meta:
      comment: Real profile contract and kickside_profile storage for the splash suites.
    component: kickside/users
    parameters:
    - name: kickside.users:env_storage
      value: app:env_storage
    - name: kickside.users:public_router
      value: app:api.public
    - name: kickside.users:api_router
      value: app:api
    - name: kickside.users:ui_server
      value: app:gateway
    - name: kickside.users:target_db
      value: app:db
    - name: kickside.users:user_security_scope
      value: app:user
    - name: kickside.users:admin_security_scope
      value: app:admin
    - name: kickside.users:login_role_resource
      value: app:*
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:admin
        subject_type: group
        access_mask: 3
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.projections:process_host
      value: app:processes
    - name: kickside.core.jobs:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:env_storage
      value: app:env_storage
    - name: kickside.core.projections:env_storage
      value: app:env_storage
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user
    - name: wippy.views:api_router
      value: app:api.views
    - name: wippy.views:env_storage
      value: app:env_storage

  - name: dep.wippy.migration
    version: "*"
    kind: ns.dependency
    component: wippy/migration
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: dep.wippy.test
    version: "*"
    kind: ns.dependency
    component: wippy/test

  - name: dep.wippy.facade
    version: "*"
    kind: ns.dependency
    meta:
      comment: Facade contract provider for the resolver binding exercised by the UI module.
    component: "wippy/facade"
    parameters:
      - name: server
        value: app:gateway
      - name: router
        value: app:api.public
      - name: content_fs
        value: app:facade_content_fs
      - name: css_variables
        value: "fs://css-variables.facade.json"

  - name: user_endpoint_policy_test
    kind: function.lua
    meta:
      type: test
      suite: member_endpoint_policy
    source: file://user_endpoint_policy_test.lua
    method: run
    modules:
    - registry
    - security
    imports:
      test: wippy.test:test

  - name: dep.member_endpoint_contract
    kind: ns.dependency
    component: kickside/contract
    version: '*'
    parameters:
    - name: kickside.contract.http:user_security_scope
      value: app:user
