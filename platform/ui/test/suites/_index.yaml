version: "1.0"
namespace: kickside.ui

entries:
  - name: nav_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_nav
      group: KickSide UI
      comment: effective() merge — overrides hide/reorder/recategorize, custom items, contributed + custom categories, first-wins dedupe, provided-item validation, layout.
    source: file://nav_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      nav: kickside.ui:nav
      ui_types: kickside.ui:types

  - name: nav_providers_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_nav
      group: KickSide UI
      comment: Nav provider fan-out — priority order, args pass-through, contribution caps and drop counts, and a failing provider failing the whole collection (no partial menu).
    source: file://nav_providers_test.lua
    method: run
    imports:
      test: wippy.test:test
      nav_providers: kickside.ui:nav_providers
      ui_types: kickside.ui:types

  - name: nav_seam_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_nav
      group: KickSide UI
      comment: Provider seam integration — the registry source is discovered and called through the nav_provider contract, and GET /nav/list serves what the providers contributed.
    source: file://nav_seam_test.lua
    method: run
    modules: [contract, security, http_client, json, registry]
    imports:
      test: wippy.test:test

  # Harness-only surfaces the seam suite asserts on, so it never depends on which
  # nav items other modules happen to ship.
  - name: nav_item.ui_test_surface
    kind: registry.entry
    meta:
      type: ui.nav_item
      path: /ui-test-surface
      route_name: ui-test-surface
      title: UI Test Surface
      icon: tabler:flask
      category: ui_test
      order: 900
      render: component
      component_tag: ui-test-surface

  - name: nav_category.ui_test
    kind: registry.entry
    meta:
      type: ui.nav_category
      key: ui_test
      title: UI Test Group
      icon: tabler:test-pipe
      order: 900

  - name: nav_badges_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_nav
      group: KickSide UI
      comment: Nav badge resolver — single component.query, singleton fail-closed, TEXT coercion, hide_zero, field-absent retains component_id, tone selection.
    source: file://nav_badges_test.lua
    method: run
    imports:
      test: wippy.test:test
      nav_badges: kickside.ui:nav_badges
      ui_types: kickside.ui:types

  - name: security_policy_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_nav
      group: KickSide UI
      comment: Public branding security policy tests.
    source: file://security_policy_test.lua
    method: run
    modules: [security]
    imports:
      test: wippy.test:test

  - name: facade_resolver_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_nav
      group: KickSide UI
      comment: Public facade CSS must carry the configured appearance base tone from the real settings service.
    source: file://facade_resolver_test.lua
    method: run
    modules: [contract, json, registry, security, funcs]
    imports:
      test: wippy.test:test
      ui_types: kickside.ui:types

  - name: dependency_seam_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_nav
      group: KickSide UI
      comment: Dependency and narrow facade-handler requirement contract checks.
    source: file://dependency_seam_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test

  # Splash scope suite: per-user seen list vs instance completion, through the
  # real profile and settings contracts.
  - name: splash_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_splash
      group: KickSide UI
      comment: Instance splash completes once for every admin (admin-gated, reset clears it); per-user splash stays per user.
    source: file://splash_test.lua
    method: run
    modules: [funcs, contract, security]
    imports:
      test: wippy.test:test
      ui_types: kickside.ui:types

  - name: splash_probe
    kind: function.lua
    meta:
      comment: Harness-only probe that runs one splash library operation under the caller's actor and scope.
    source: file://splash_probe.lua
    method: run
    modules: [security]
    imports:
      splash: kickside.ui:splash

  # Harness-only per-user splash, so the suite never depends on which splashes
  # other modules ship.
  - name: splash.ui_test_tour
    kind: registry.entry
    meta:
      type: ui.splash
      id: ui_test_tour
      presentation: dialog
      title: UI Test Tour
      icon: tabler:flask
      priority: 10
      audience: all

  - name: branding_storage_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_branding
      group: KickSide UI
    source: file://branding_storage_test.lua
    method: run
    modules: [fs, registry, http_client, json, security, sql, base64]
    imports:
      test: wippy.test:test
      principal_fixture: kickside.ui:principal_fixture
  - name: nav_broadcast_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_ui_branding
      group: KickSide UI
      comment: A configuration write broadcasts nav.changed without caller realtime or process messaging authority.
    source: file://nav_broadcast_test.lua
    method: run
    modules: [security, http_client, json, sql, registry]
    imports:
      test: wippy.test:test
      principal_fixture: kickside.ui:principal_fixture

  - name: nav_realtime_broadcast
    kind: function.lua
    source: file://nav_realtime_fake.lua
    method: broadcast
    modules: [sql, security]

  - name: nav_realtime_notify
    kind: function.lua
    source: file://nav_realtime_fake.lua
    method: notify
    modules: [sql, security]

  - name: eligibility_false
    kind: function.lua
    source: file://eligibility_false.lua
    method: check
    modules: [security]
  - name: splash.ineligible
    kind: registry.entry
    meta:
      type: ui.splash
      id: ineligible
      scope: user
      priority: 200
      eligibility: kickside.ui:eligibility_false

  - name: shell_access_test
    kind: function.lua
    meta: {type: test, suite: kickside_ui_shell}
    source: file://shell_access_test.lua
    method: run
    modules: [funcs, security, contract]
    imports: {test: wippy.test:test, shell: kickside.ui:shell_discovery, ui_types: kickside.ui:types,
      policy_composition: kickside.security:policy_composition}
  - name: shell_settings_probe
    kind: function.lua
    source: file://shell_access_test.lua
    method: settings
    modules: [funcs, security, contract]
    imports: {test: wippy.test:test, shell: kickside.ui:shell_discovery, ui_types: kickside.ui:types,
      policy_composition: kickside.security:policy_composition}
  - name: shell_access_probe
    kind: function.lua
    source: file://shell_access_test.lua
    method: discover
    modules: [funcs, security, contract]
    imports: {test: wippy.test:test, shell: kickside.ui:shell_discovery, ui_types: kickside.ui:types,
      policy_composition: kickside.security:policy_composition}
  - name: shell_nav_probe
    kind: function.lua
    source: file://shell_access_test.lua
    method: nav
    modules: [funcs, security, contract]
    imports: {test: wippy.test:test, shell: kickside.ui:shell_discovery, ui_types: kickside.ui:types,
      policy_composition: kickside.security:policy_composition}
  - name: nav.gated_fixture
    kind: registry.entry
    meta: {type: ui.nav_item, path: /gated-fixture, route_name: gated_fixture, title: Gated fixture}
    access: kickside.ui:fixture_management
  - name: tab.gated_fixture
    kind: registry.entry
    meta: {type: ui.settings_tab}
    key: gated_fixture
    access: kickside.ui:fixture_management
  - name: shell_access_deny
    kind: security.policy
    policy: {actions: access, resources: 'kickside.ui:fixture_management', effect: deny}

  - name: principal_fixture
    kind: library.lua
    source: file://principal_fixture.lua
    modules: [security, crypto]
    imports:
      user_repo: kickside.users.persist:user_repo
      user_groups_repo: kickside.users.persist:user_groups_repo

  - name: nav_settings_failure
    kind: library.lua
    source: file://nav_settings_failure.lua
  - name: nav_http
    kind: library.lua
    source: file://nav_http.lua
  - name: nav_subject
    kind: library.lua
    source: file://nav_subject.lua
    modules: [registry, logger]
    imports:
      security: kickside.ui:nav_caller
      http: kickside.ui:nav_http
      contract: kickside.ui:nav_settings_failure
      nav: kickside.ui:nav
      nav_providers: kickside.ui:nav_providers
      nav_badges: kickside.ui:nav_badges
      splash: kickside.ui:splash
      ui_types: kickside.ui:types
      branding: kickside.ui:branding
  - name: nav_settings_error_test
    kind: function.lua
    meta: {type: test, suite: kickside_ui_nav}
    source: file://nav_settings_error_test.lua
    method: run
    imports:
      test: wippy.test:test
      nav_subject: kickside.ui:nav_subject
      nav_settings_failure: kickside.ui:nav_settings_failure

  - name: nav_caller
    kind: library.lua
    source: file://nav_caller.lua

  - name: registry_provider_subject
    kind: library.lua
    source: file://registry_provider_subject.lua
    imports:
      shell: kickside.ui:nav_settings_failure
      ui_types: kickside.ui:types
  - name: contributions_subject
    kind: library.lua
    source: file://contributions_subject.lua
    imports:
      shell: kickside.ui:nav_settings_failure
  - name: discovery_subject
    kind: library.lua
    source: file://discovery_subject.lua
    modules: [security]
    imports:
      registry: kickside.ui:nav_settings_failure
  - name: ui_discovery_errors_test
    kind: function.lua
    meta: {type: test, suite: kickside_ui_nav}
    source: file://ui_discovery_errors_test.lua
    method: run
    imports:
      test: wippy.test:test
      declarations: kickside.ui:registry_provider_subject
      contributions: kickside.ui:contributions_subject
      discovery: kickside.ui:discovery_subject
      source: kickside.ui:nav_settings_failure
