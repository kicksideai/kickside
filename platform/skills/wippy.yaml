organization: kickside
module: skills
type: plugin
description: KickSide skills — reusable agent procedures stored as a component plus a versioned markdown body. Owns the skills + skill_versions schema and store, a six-route CRUD/read API, and the Skills agent capability (dual-mode Skill tool + pin-by-context build func) that agents discover via the registry.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/kickside
homepage: https://wippy.ai
keywords:
  - kickside
  - skills
  - agents
  - capabilities
embed:
  - kickside.skills:ui_fs
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
exclude:
  - "app:**"
  - "app.env:**"
  - "ui/node_modules/**"
  - "ui/node_modules:**"
  - "ui/coverage/**"
  - "ui/coverage:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
