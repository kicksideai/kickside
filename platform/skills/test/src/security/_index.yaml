version: "1.0"
namespace: app.security

# Canonical user-runtime policies required by deferred skill projections. These
# are the same bounded product-runtime grants used by the application; the
# harness intentionally does not define a wildcard test policy.
entries:
  - name: user.runtime_contracts
    kind: security.policy
    meta:
      type: app.security.policy_binding
      surface: app.runtime.contracts
      intent: trusted_product_runtime
      comment: Contract/function execution required to preserve caller actor/scope through canonical component and thread ports.
    groups:
      - app.security:user
    policy:
      resources:
        - kickside.*
        - userspace.dataflow:*
        - userspace.dataflow.*
        - wippy.session:*
        - wippy.session.*
        - wippy.agent:*
        - wippy.agent.*
        - wippy.llm:*
        - wippy.llm.*
        - security
      actions:
        - contract.get
        - contract.open
        - contract.call
        - contract.implementations
        - contract.security
        - funcs.call
        - funcs.security
      effect: allow

  - name: user.runtime_contract_methods
    kind: security.policy
    meta:
      type: app.security.policy_binding
      surface: app.runtime.contracts
      intent: trusted_product_runtime
      comment: Contract method dispatch is guarded by method name; discovery and open remain constrained by user.runtime_contracts.
    groups:
      - app.security:user
    policy:
      resources: '*'
      actions:
        - contract.call
      effect: allow

  - name: user.runtime_data_access
    kind: security.policy
    meta:
      type: app.security.policy_binding
      surface: app.runtime.data
      intent: trusted_product_runtime
      comment: Runtime data primitives needed by trusted KickSide modules behind user-scoped entrypoints.
    groups:
      - app.security:user
    policy:
      resources:
        - app:db
        - app:uploads
      actions:
        - db.get
        - fs.get
        - store.get
        - store.info
        - store.key.get
        - store.key.list
        - store.key.set
        - store.key.delete
        - store.key.has
      effect: allow

  - name: user.runtime_registry_read
    kind: security.policy
    meta:
      type: app.security.policy_binding
      surface: app.runtime.registry
      intent: trusted_product_runtime
      comment: Read-only registry discovery for trusted product runtime metadata.
    groups:
      - app.security:user
    policy:
      resources:
        - kickside.*
        - userspace.dataflow:*
        - userspace.dataflow.*
        - wippy.views:*
        - wippy.session:*
        - wippy.session.*
        - wippy.agent:*
        - wippy.agent.*
        - wippy.llm:*
        - wippy.llm.*
        - app.api.websocket:*
        - app.env:*
      actions:
        - registry.get
        - registry.find
      effect: allow
