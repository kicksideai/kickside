version: '1.0'
namespace: app
entries:
- name: dep.wippy.test
  kind: ns.dependency
  component: wippy/test
  version: "*"
- name: db
  kind: db.sql.sqlite
  foreign_keys: true
  meta:
    comment: In-memory database backing identity link tests.
  file: ${sqlite_path}
- name: env_storage
  kind: env.storage.file
  meta:
    type: envstorage
  file_path: ./.wippy/test.env
  auto_create: true
- name: processes
  kind: process.host
  lifecycle:
    auto_start: true
- name: gateway
  kind: http.service
  meta:
    comment: Test HTTP server.
  addr: :0
  lifecycle:
    auto_start: false
- name: api
  kind: http.router
  meta:
    comment: Test API router.
    server: gateway
  prefix: /api
- name: api.public
  kind: http.router
  meta:
    comment: Public router for transitive session and view dependencies.
    server: gateway
  prefix: /public
- name: user
  kind: security.policy
  meta:
    comment: Authenticated-user scope for the standalone identity harness.
  groups:
  - identity_test
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: dep.kickside.identity
  kind: ns.dependency
  component: kickside/identity
  version: '*'
  parameters:
  - name: kickside.identity:target_db
    value: app:db
  - name: kickside.identity:api_router
    value: app:api
  - name: kickside.identity:ui_server
    value: app:gateway
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.relay:application_host
    value: app:processes
  - name: wippy.relay:user_security_scope
    value: app:user
  - name: wippy.relay:env_storage
    value: app:env_storage
  - name: wippy.session:api_router
    value: app:api
  - name: wippy.session:env_storage
    value: app:env_storage
  - name: wippy.session:delegation_func_id
    value: userspace.dataflow.session:delegate
  - name: wippy.views:api_router
    value: app:api.public
  - name: wippy.views:env_storage
    value: app:env_storage
- name: user_endpoint_policy_test
  kind: function.lua
  meta:
    type: test
    suite: member_endpoint_policy
  source: file://user_endpoint_policy_test.lua
  method: run
  modules:
  - registry
  - security
  imports:
    test: wippy.test:test
- name: dep.member_endpoint_contract
  kind: ns.dependency
  component: kickside/contract
  version: '*'
  parameters:
  - name: kickside.contract.http:user_security_scope
    value: app:user
