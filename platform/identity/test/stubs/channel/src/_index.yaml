    kind: library.lua
    meta:
      comment: Identity-harness stub for channel session teardown (reports success).
    source: file://channel_stub.lua

  - name: complete_unlink
    kind: library.lua
    meta:
      comment: Identity-harness stub for Channel-owned unlink count finalization.
    source: file://channel_stub.lua
