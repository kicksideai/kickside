version: '1.0'
namespace: app
entries:
- name: dep.kickside.security
  kind: ns.dependency
  version: '*'
  component: kickside/security
  parameters:
  - name: api_router
    value: app:api
  - name: ui_server
    value: app:gateway
  - name: target_db
    value: app:db
  - name: process_host
    value: app:processes
- name: scope_unrestricted
  kind: security.policy
  groups:
  - app.security:scope_unrestricted
  policy:
    actions: '*'
    resources: '*'
    effect: allow
- name: db
  kind: db.sql.sqlite
  foreign_keys: true
  meta:
    comment: In-memory database for the users suite.
  file: ${sqlite_path}
- name: env_storage
  kind: env.storage.file
  meta:
    type: envstorage
  file_path: ./.wippy/test.env
  auto_create: true
- name: processes
  kind: process.host
  lifecycle:
    auto_start: true
- name: gateway
  kind: http.service
  meta:
    comment: Test HTTP server.
  addr: :0
  lifecycle:
    auto_start: true
- name: api
  kind: http.router
  meta:
    comment: Test API router.
    server: gateway
  prefix: /api
  middleware:
  - token_auth
  post_middleware:
  - endpoint_firewall
  options:
    token_store: kickside.users.security:tokens
- name: api.public
  kind: http.router
  meta:
    comment: Test public (no-auth) router for the kickside login endpoint.
    server: gateway
  prefix: /api/public
- name: api.views
  kind: http.router
  meta:
    comment: Separate router for the generic Views API so its tag route cannot overlap
      component share routes.
    server: gateway
  prefix: /views
- name: user
  kind: security.policy
  meta:
    comment: Permissive scope for the suite.
  groups:
  - users_test
  - app.security:user
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: test_runtime
  kind: security.policy
  meta:
    comment: Full capability policy scoped to the publish-excluded Users test harness.
  policy:
    resources: '*'
    actions: '*'
    effect: allow
  groups:
  - app.security:admin
- name: dep.kickside.users
  version: '*'
  kind: ns.dependency
  meta:
    comment: Users mounted as the single package root; this app harness supplies all
      host and transitive seams.
  component: kickside/users
  parameters:
  - name: kickside.users:env_storage
    value: app.env:store
  - name: kickside.users:public_router
    value: app:api.public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app.security:user
  - name: kickside.users:admin_security_scope
    value: app.security:admin
  - name: kickside.users:login_role_resource
    value: app.security:*
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
  - name: kickside.component:target_db
    value: app:db
  - name: kickside.component:api_router
    value: app:api
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: app.security:user
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app.security:admin
      subject_type: group
      access_mask: 3
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.projections:process_host
    value: app:processes
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.projections:env_storage
    value: app:env_storage
  - name: kickside.core.retention:user_security_scope
    value: app.security:user
  - name: kickside.core.threads:user_security_scope
    value: app.security:user
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.views:api_router
    value: app:api.views
  - name: wippy.views:env_storage
    value: app.env:store
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
- name: dep.wippy.bootloader
  version: '*'
  kind: ns.dependency
  meta:
    comment: Bootloader applies every dep's migrations on boot.
  component: wippy/bootloader
  parameters:
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
  - name: kickside.users:public_router
    value: app:api.public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app.security:user
  - name: kickside.users:admin_security_scope
    value: app.security:admin
  - name: kickside.users:login_role_resource
    value: app.security:*
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.views:api_router
    value: app:api.views
  - name: wippy.views:env_storage
    value: app.env:store
- name: dep.wippy.test
  kind: ns.dependency
  component: wippy/test
  version: '*'
- name: dep.kickside.identity
  kind: ns.dependency
  component: kickside/identity
  version: '*'
  parameters:
  - name: kickside.identity:credential_eligibility
    value: kickside.users.binding:credential_eligibility
  - name: kickside.identity:target_db
    value: app:db
  - name: kickside.identity:api_router
    value: app:api
  - name: kickside.identity:ui_server
    value: app:gateway
  - name: kickside.agents:api_router
    value: app:api
  - name: kickside.agents:ui_server
    value: app:gateway
  - name: kickside.channel:target_db
    value: app:db
  - name: kickside.channel:ui_server
    value: app:gateway
  - name: kickside.channel:process_host
    value: app:processes
  - name: kickside.connection:api_router
    value: app:api
  - name: kickside.connection:ui_server
    value: app:gateway
  - name: kickside.uploads:api_router
    value: app:api
  - name: kickside.uploads:ui_server
    value: app:gateway
  - name: wippy.session:api_router
    value: app:api
  - name: wippy.session:env_storage
    value: app:env_storage
  - name: wippy.session:database_resource
    value: app:db
  - name: wippy.session:default_host
    value: app:processes
  - name: wippy.session:checkpoint_function_id
    value: wippy.session.funcs:checkpoint
  - name: wippy.relay:env_storage
    value: app:env_storage
  - name: wippy.relay:application_host
    value: app:processes
  - name: wippy.llm:env_storage
    value: app:env_storage
  - name: wippy.llm:process_host
    value: app:processes
  - name: kickside.automation:ui_server
    value: app:gateway
  - name: kickside.automation:api_router
    value: app:api
  - name: kickside.automation:target_db
    value: app:db
  - name: kickside.automation.engine:process_host
    value: app:processes
  - name: kickside.uploads:env_storage
    value: app:env_storage
  - name: kickside.identity.security:user_security_scope
    value: app.security:identity_only
- name: dep.kickside.dm
  kind: ns.dependency
  component: kickside/dm
  version: '*'
- name: bot_accounts_test
  kind: function.lua
  source: file://bot_accounts_test.lua
  method: run
  meta:
    type: test
    suite: identity_bot_accounts
    timeout: 300s
  security:
    actor:
      id: app:test_runner
    policies:
    - app:test_runtime
  modules:
  - sql
  - crypto
  - security
  - json
  - registry
  - http_client
  - time
  - funcs
  imports:
    test: wippy.test:test
    users: kickside.users.persist:user_repo
    groups: kickside.users.persist:user_groups_repo
    lifecycle: kickside.users.persist:user_lifecycle_repo
    session_index: kickside.users.persist:session_index
    links: kickside.identity:link_service
    dm: kickside.dm:receive_func
- name: identity_only_data
  kind: security.policy
  groups:
  - app.security:identity_only
  policy:
    resources: app:db
    actions: db.get
    effect: allow
- name: identity_only_registry
  kind: security.policy
  groups:
  - app.security:identity_only
  policy:
    resources: '*'
    actions: registry.get
    effect: allow
- name: identity_config_only_registry
  kind: security.policy
  policy:
    resources: kickside.identity:db_config
    actions: registry.get
    effect: allow
- name: identity_only_ingress
  kind: security.policy
  groups:
  - app.security:identity_only
  policy:
    resources: kickside.dm:receive
    actions: channel.receive.inject
    effect: allow
- name: identity_only_actions
  kind: security.policy
  groups:
  - app.security:identity_only
  policy:
    resources:
    - app:limited_identity_actions
    - kickside.dm:receive_func
    actions: funcs.call
    effect: allow
- name: limited_identity_actions
  kind: function.lua
  method: read
  source: file://limited_identity_actions.lua
  imports:
    links: kickside.identity:link_service
