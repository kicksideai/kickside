version: '1.0'
namespace: kickside.identity.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Identity
    surface: kickside.identity
    intent: module_access
    includes:
    - kickside.identity.security:module_runtime
    - kickside.identity:credential_eligibility_call
    - kickside.identity.security:identity_endpoint_access
  groups: []
  policy:
    resources:
    - kickside.identity:*
    - kickside.identity.api:*
    - kickside.identity.migrations:*
    - kickside.identity.security:*
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: identity_endpoint_access
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.identity.api:generate_link_code.endpoint
    - kickside.identity.api:list_links.endpoint
    - kickside.identity.api:unlink.endpoint
    actions: access
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.identity:*
    - kickside.identity.api:*
    - kickside.identity.migrations:*
    - kickside.identity.security:*
    actions:
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application group with member access to this module.
  targets:
  - entry: kickside.identity.security:module_access
    path: .groups +=
  - entry: kickside.identity.security:module_runtime
    path: .groups +=
  - entry: kickside.identity:credential_eligibility_call
    path: .groups +=
  - entry: kickside.identity.security:identity_endpoint_access
    path: .groups +=
