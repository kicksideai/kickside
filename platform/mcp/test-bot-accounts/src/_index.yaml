version: '1.0'
namespace: app
entries:
- name: dep.kickside.security
  kind: ns.dependency
  version: '*'
  component: kickside/security
  parameters:
  - name: api_router
    value: app:api
  - name: ui_server
    value: app:gateway
  - name: target_db
    value: app:db
  - name: process_host
    value: app:processes
- name: scope_unrestricted
  kind: security.policy
  groups:
  - app.security:scope_unrestricted
  policy:
    actions: '*'
    resources: '*'
    effect: allow
- name: db
  kind: db.sql.sqlite
  foreign_keys: true
  meta:
    comment: In-memory database for the users suite.
  file: ${sqlite_path}
- name: env_storage
  kind: env.storage.file
  meta:
    type: envstorage
  file_path: ./.wippy/test.env
  auto_create: true
- name: processes
  kind: process.host
  lifecycle:
    auto_start: true
- name: gateway
  kind: http.service
  meta:
    comment: Test HTTP server.
  addr: :0
  lifecycle:
    auto_start: true
- name: api
  kind: http.router
  meta:
    comment: Test API router.
    server: gateway
  prefix: /api
  middleware:
  - websocket_relay
  - token_auth
  post_middleware:
  - endpoint_firewall
  options:
    token_store: kickside.users.security:tokens
- name: api.public
  kind: http.router
  meta:
    comment: Test public (no-auth) router for the kickside login endpoint.
    server: gateway
  prefix: /api/public
- name: api.views
  kind: http.router
  meta:
    comment: Separate router for the generic Views API so its tag route cannot overlap
      component share routes.
    server: gateway
  prefix: /views
  middleware: [token_auth]
  post_middleware: [endpoint_firewall]
  options: {token_store: kickside.users.security:tokens}
- name: user
  kind: security.policy
  meta:
    comment: Permissive scope for the suite.
  groups:
  - users_test
  - app.security:user
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: test_runtime
  kind: security.policy
  meta:
    comment: Full capability policy scoped to the publish-excluded Users test harness.
  policy:
    resources: '*'
    actions: '*'
    effect: allow
  groups:
  - app.security:admin
- name: dep.kickside.users
  version: '*'
  kind: ns.dependency
  meta:
    comment: Users mounted as the single package root; this app harness supplies all
      host and transitive seams.
  component: kickside/users
  parameters:
  - name: kickside.users:env_storage
    value: app.env:store
  - name: kickside.users:public_router
    value: app:api.public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app.security:user
  - name: kickside.users:admin_security_scope
    value: app.security:admin
  - name: kickside.users:login_role_resource
    value: app.security:*
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
  - name: kickside.component:target_db
    value: app:db
  - name: kickside.component:api_router
    value: app:api
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: app.security:user
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app.security:admin
      subject_type: group
      access_mask: 3
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.projections:process_host
    value: app:processes
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.projections:env_storage
    value: app:env_storage
  - name: kickside.core.retention:user_security_scope
    value: app.security:user
  - name: kickside.core.threads:user_security_scope
    value: app.security:user
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.views:api_router
    value: app:api.views
  - name: wippy.views:env_storage
    value: app.env:store
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
- name: dep.wippy.bootloader
  version: '*'
  kind: ns.dependency
  meta:
    comment: Bootloader applies every dep's migrations on boot.
  component: wippy/bootloader
  parameters:
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
  - name: kickside.users:public_router
    value: app:api.public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app.security:user
  - name: kickside.users:admin_security_scope
    value: app.security:admin
  - name: kickside.users:login_role_resource
    value: app.security:*
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.views:api_router
    value: app:api.views
  - name: wippy.views:env_storage
    value: app.env:store
- name: dep.kickside.mcp
  kind: ns.dependency
  component: kickside/mcp
  version: '*'
  parameters:
  - name: kickside.mcp:credential_eligibility
    value: kickside.users.binding:credential_eligibility
  - name: kickside.mcp:target_db
    value: app:db
  - name: kickside.mcp:api_router
    value: app:api
  - name: kickside.mcp:public_router
    value: app:api.public
  - name: kickside.mcp:ui_server
    value: app:gateway
- name: dep.wippy.test
  kind: ns.dependency
  component: wippy/test
  version: '*'
- name: credential_actions
  kind: function.lua
  source: file://credential_actions.lua
  method: run
  modules:
  - security
  imports:
    repo: kickside.mcp.persist:repo
    flow: kickside.mcp.oauth:flow
- name: bot_accounts_test
  kind: function.lua
  source: file://bot_accounts_test.lua
  method: run
  meta:
    type: test
    suite: mcp_bot_accounts
    timeout: 300s
  security:
    actor:
      id: app:test_runner
    policies:
    - app:test_runtime
  modules:
  - sql
  - crypto
  - funcs
  - security
  - json
  - registry
  - http_client
  imports:
    test: wippy.test:test
    users: kickside.users.persist:user_repo
    groups: kickside.users.persist:user_groups_repo
    lifecycle: kickside.users.persist:user_lifecycle_repo
    repo: kickside.mcp.persist:repo
    oauth_repo: kickside.mcp.oauth:repo
    flow: kickside.mcp.oauth:flow
    session_index: kickside.users.persist:session_index
- name: echo_tool
  kind: function.lua
  meta: {type: tool, llm_alias: bot_accounts_echo}
  source: file://echo_tool.lua
  method: run

- name: host_credentials_test
  kind: function.lua
  source: file://host_credentials_test.lua
  method: run
  meta: {type: test, suite: mcp_bot_accounts, timeout: 300s}
  security:
    actor: {id: app:test_runner}
    policies: [app:test_runtime]
  modules: [sql, crypto, funcs, security, registry]
  imports:
    test: wippy.test:test
    users: kickside.users.persist:user_repo
    groups: kickside.users.persist:user_groups_repo
    lifecycle: kickside.users.persist:user_lifecycle_repo
- name: allow_credentials
  kind: function.lua
  source: file://host_credential_fixtures.lua
  method: allow
- name: invalid_credentials
  kind: function.lua
  source: file://host_credential_fixtures.lua
  method: invalid
- name: refuse_credentials
  kind: function.lua
  source: file://host_credential_fixtures.lua
  method: refuse

- name: session_admission_test
  kind: function.lua
  source: file://session_admission_test.lua
  method: run
  meta: {type: test, suite: mcp_bot_accounts, timeout: 300s}
  security:
    actor: {id: app:test_runner}
    policies: [app:test_runtime]
  modules: [sql, crypto, security, funcs, registry, http_client, json]
  imports:
    test: wippy.test:test
    users: kickside.users.persist:user_repo
    groups: kickside.users.persist:user_groups_repo
    lifecycle: kickside.users.persist:user_lifecycle_repo
    session_index: kickside.users.persist:session_index
- name: session_error_typing_test
  kind: function.lua
  source: file://session_admission_test.lua
  method: error_typing
  meta: {type: test, suite: mcp_bot_accounts, timeout: 300s}
  security:
    actor: {id: app:test_runner}
    policies: [app:test_runtime]
  modules: [sql, crypto, security, funcs, registry, http_client, json]
  imports:
    test: wippy.test:test
    users: kickside.users.persist:user_repo
    groups: kickside.users.persist:user_groups_repo
    lifecycle: kickside.users.persist:user_lifecycle_repo
    session_index: kickside.users.persist:session_index
- name: session_admission_views.endpoint
  kind: http.endpoint
  meta: {router: app:api.views}
  method: GET
  path: /session-admission
  func: kickside.users.api:me

- name: session_admission_mint
  kind: function.lua
  source: file://session_admission_fixtures.lua
  method: mint
  modules: [security]
