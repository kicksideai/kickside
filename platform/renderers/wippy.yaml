organization: kickside
module: renderers
type: plugin
description: KickSide Content Renderers — isolated, reusable content-viewer web components. <wc-resource-view> host picks + mounts a viewer (<wc-render-markdown>/<wc-render-pdf>/<wc-render-image>) by content-type; each viewer is its own lazy bundle so heavy deps never enter a host. Used by the wiki, uploads, inbox, anywhere a resource needs inline rendering.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/kickside
homepage: https://wippy.ai
keywords:
  - kickside
  - renderers
  - web-component
  - shared
embed:
  - kickside.renderers:ui_fs
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
exclude:
  - "app:**"
  - "app.env:**"
  - "ui/node_modules/**"
  - "ui/node_modules:**"
  - "ui/coverage/**"
  - "ui/coverage:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
