version: '1.0'
namespace: kickside.renderers.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Renderers
    surface: kickside.renderers
    intent: module_access
    includes:
    - kickside.renderers.security:module_runtime
    - kickside.renderers:renderers_endpoint_access
  groups: []
  policy:
    resources:
    - kickside.renderers.api:list_renderers.endpoint
    actions: access
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.renderers:*
    - kickside.renderers.api:*
    - kickside.renderers.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
