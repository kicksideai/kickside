version: '1.0'
namespace: app
entries:
- name: db
  kind: db.sql.sqlite
  file: "${sqlite_path}"
- name: processes
  kind: process.host
  lifecycle:
    auto_start: false
- name: gateway
  kind: http.service
  addr: :19040
  lifecycle:
    auto_start: false
- name: api
  kind: http.router
  meta:
    server: app:gateway
  prefix: /api
- name: dep.test
  kind: ns.dependency
  component: wippy/test
  version: '*'
- name: dep.module
  kind: ns.dependency
  component: kickside/renderers
  version: '*'
  parameters:
  - name: kickside.renderers:ui_server
    value: app:gateway
  - name: kickside.renderers:user_security_scope
    value: app:user
  - name: kickside.renderers:api_router
    value: app:api
