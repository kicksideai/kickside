version: '1.0'
namespace: app
entries:
- name: dep.kickside.security
  kind: ns.dependency
  version: '*'
  component: kickside/security
  parameters:
  - name: api_router
    value: app:api
  - name: ui_server
    value: app:gateway
  - name: target_db
    value: app:db
  - name: process_host
    value: app:processes
- name: db
  kind: db.sql.sqlite
  foreign_keys: true
  meta:
    comment: In-memory database for the users suite.
  file: ${sqlite_path}
- name: env_storage
  kind: env.storage.file
  meta:
    type: envstorage
  file_path: ./.wippy/test.env
  auto_create: true
- name: processes
  kind: process.host
  lifecycle:
    auto_start: true
- name: gateway
  kind: http.service
  meta:
    comment: Test HTTP server.
  addr: :0
  lifecycle:
    auto_start: true
- name: api
  kind: http.router
  meta:
    comment: Test API router.
    server: gateway
  prefix: /api
  middleware:
  - websocket_relay
  - token_auth
  post_middleware:
  - endpoint_firewall
  options:
    token_store: kickside.users.security:tokens
- name: api.public
  kind: http.router
  meta:
    comment: Test public (no-auth) router for the kickside login endpoint.
    server: gateway
  prefix: /api/public
- name: api.views
  kind: http.router
  meta:
    comment: Separate router for the generic Views API so its tag route cannot overlap
      component share routes.
    server: gateway
  prefix: /views
  middleware:
  - token_auth
  post_middleware:
  - endpoint_firewall
  options:
    token_store: kickside.users.security:tokens
- name: dep.kickside.users
  version: '*'
  kind: ns.dependency
  meta:
    comment: Users mounted as the single package root; this app harness supplies all
      host and transitive seams.
  component: kickside/users
  parameters:
  - name: kickside.users:env_storage
    value: app.env:store
  - name: kickside.users:public_router
    value: app:api.public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app.security:user
  - name: kickside.users:admin_security_scope
    value: app.security:admin
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
  - name: kickside.component:target_db
    value: app:db
  - name: kickside.component:api_router
    value: app:api
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: app.security:user
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app.security:admin
      subject_type: group
      access_mask: 3
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.projections:process_host
    value: app:processes
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.projections:env_storage
    value: app:env_storage
  - name: kickside.core.retention:user_security_scope
    value: app.security:user
  - name: kickside.core.threads:user_security_scope
    value: app.security:user
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.views:api_router
    value: app:api.views
  - name: wippy.views:env_storage
    value: app.env:store
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
  - name: kickside.users:login_role_resource
    value: app.security:*
- name: dep.wippy.bootloader
  version: '*'
  kind: ns.dependency
  meta:
    comment: Bootloader applies every dep's migrations on boot.
  component: wippy/bootloader
  parameters:
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
  - name: kickside.users:public_router
    value: app:api.public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app.security:user
  - name: kickside.users:admin_security_scope
    value: app.security:admin
  - name: kickside.users:login_role_resource
    value: app.security:*
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.views:api_router
    value: app:api.views
  - name: wippy.views:env_storage
    value: app.env:store
- name: dep.wippy.test
  kind: ns.dependency
  component: wippy/test
  version: '*'
- name: test_runtime
  kind: security.policy
  policy:
    actions: '*'
    resources: '*'
    effect: allow
- name: security_admin
  kind: security.policy
  policy:
    actions: access
    resources: &id001
    - kickside.security.api:delegation_save.endpoint
    - kickside.security.api:delegation_revoke.endpoint
    - kickside.security.api:delegation_list.endpoint
    - kickside.security.api:delegation_roots.endpoint
    effect: allow
  groups:
  - app.security:security_admin
- name: security_reads
  kind: security.policy
  policy:
    actions:
    - registry.get
    - registry.find
    - registry.snapshot
    - security.policy_group.get
    resources: '*'
    effect: allow
  groups:
  - app.security:security_admin
- name: security_database
  kind: security.policy
  policy:
    actions: db.get
    resources: app:db
    effect: allow
  groups:
  - app.security:security_admin
- name: security_writer
  kind: security.policy
  policy:
    actions: registry.apply
    resources: kickside.delegate:*
    effect: allow
  groups:
  - app.security:policy_writer
- name: users_manager
  kind: security.policy
  policy:
    actions: access
    resources: kickside.users.api:*
    effect: allow
  groups:
  - app.security:users_manager
- name: component_admin
  kind: security.policy
  policy:
    actions: kickside.component.admin
    resources: '*'
    effect: allow
  groups:
  - app.security:component_admin
- name: component_endpoints
  kind: security.policy
  policy:
    actions: access
    resources: *id001
    effect: allow
  groups:
  - app.security:component_admin
- name: role_security_admin
  kind: registry.entry
  meta:
    type: kickside.security.role
  role_id: app.security:security_admin
- name: role_policy_writer
  kind: registry.entry
  meta:
    type: kickside.security.role
  role_id: app.security:policy_writer
- name: role_users_manager
  kind: registry.entry
  meta:
    type: kickside.security.role
  role_id: app.security:users_manager
- name: role_component_admin
  kind: registry.entry
  meta:
    type: kickside.security.role
  role_id: app.security:component_admin
- name: role_operators
  kind: registry.entry
  meta:
    type: kickside.security.role
  role_id: app.security:operators
- name: operator_marker
  kind: security.policy
  policy:
    actions: access
    resources: app:operator_marker
    effect: allow
  groups:
  - app.security:operators
- name: unavailable_subject_directory
  kind: library.lua
  source: file://unavailable_subject_directory.lua
- name: delegation_http_test
  kind: function.lua
  source: file://delegation_http_test.lua
  method: run
  meta:
    type: test
    suite: security_bot_accounts_http
    timeout: 300s
  security:
    actor:
      id: app:test_runner
    policies:
    - app:test_runtime
  modules:
  - sql
  - uuid
  - security
  - registry
  - http_client
  - json
  imports:
    test: wippy.test:test
    users: kickside.users.persist:user_repo
    groups: kickside.users.persist:user_groups_repo
    lifecycle: kickside.users.persist:user_lifecycle_repo
    session_index: kickside.users.persist:session_index
    execution_identity: kickside.execution:execution_identity
    trigger_reconcile: kickside.security:trigger_reconcile
