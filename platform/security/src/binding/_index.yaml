version: "1.0"
namespace: kickside.security.binding

entries:
  - name: materialize_group_set
    kind: function.lua
    meta:
      private: true
    source: file://materialize_group_set.lua
    method: materialize
    security:
      policies:
      - kickside.security.service:reconcile_request_access
      - kickside.security.service:group_set_registry_read
      - kickside.security.service:group_set_db
    modules:
    - security
    imports:
      error_envelope: kickside.contract:error_envelope
      trigger_reconcile: kickside.security:trigger_reconcile
      scope_projection: kickside.security.service:scope_projection
  - name: list_scopes_func
    kind: function.lua
    meta: { comment: "kickside.contract:security_scopes — list." }
    source: file://list_scopes_func.lua
    method: list
    modules: [security]
    imports:
      scope_catalog: kickside.security.api:scope_catalog

  - name: classify_membership_effect
    kind: function.lua
    meta: {private: true}
    source: file://classify_membership_effect.lua
    method: classify
    modules: [security, registry]
    imports:
      policy_groups: kickside.security.service:policy_groups
      error_envelope: kickside.contract:error_envelope

