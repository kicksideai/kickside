version: "1.0"
namespace: kickside.security.binding

entries:
  - name: materialize_group_set
    kind: function.lua
    meta:
      private: true
    source: file://materialize_group_set.lua
    method: materialize
    security:
      policies:
      - kickside.security.service:reconcile_request_access
      - kickside.security.service:group_set_registry_read
      - kickside.security.service:group_set_db
    modules:
    - security
    imports:
      error_envelope: kickside.contract:error_envelope
      trigger_reconcile: kickside.security:trigger_reconcile
      scope_projection: kickside.security.service:scope_projection
  - name: registry_observer
    kind: function.lua
    meta:
      type: registry.observer
      priority: 10
      private: true
      comment: Waits for the scope projection after Keeper applies a registry changeset, so a module install returns with its permissions in force.
    source: file://registry_observer.lua
    method: run
    security:
      policies: [kickside.security.service:reconcile_request_access]
    imports:
      trigger_reconcile: kickside.security:trigger_reconcile

  - name: list_scopes_func
    kind: function.lua
    meta: { comment: "kickside.contract:security_scopes — list." }
    source: file://list_scopes_func.lua
    method: list
    modules: [security, funcs]
    imports:
      scope_catalog: kickside.security.api:scope_catalog
  - name: read_assignable_scopes
    kind: function.lua
    meta:
      private: true
      comment: Non-internal scope catalog read under Security's registry and database authority.
    source: file://read_assignable_scopes.lua
    method: read
    security:
      policies:
      - kickside.security.service:group_set_registry_read
      - kickside.security.service:group_set_db
    imports:
      scope_catalog: kickside.security.api:scope_catalog

  - name: classify_membership_effect
    kind: function.lua
    meta: {private: true}
    source: file://classify_membership_effect.lua
    method: classify
    modules: [security, registry]
    imports:
      error_envelope: kickside.contract:error_envelope
      policy_coverage: kickside.security:policy_coverage
      scope_key: kickside.security.projection:scope_key

