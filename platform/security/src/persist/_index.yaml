version: "1.0"
namespace: kickside.security.persist

# Persistence layer: DB CRUD for admin-authored custom scopes. The only layer
# that touches sql. The projection service reads from here; it never writes the registry
# from this layer.

entries:

  - name: scope_store
    kind: library.lua
    meta: { comment: DB CRUD for admin-authored custom scopes (kickside_security_scopes). }
    source: file://scope_store.lua
    modules: [sql, json, time, registry]
    imports:
      security_consts: kickside.security:security_consts
      trigger_reconcile: kickside.security:trigger_reconcile
      committed_error: kickside.contract:committed_error
      policy_composition: kickside.security:policy_composition
      persisted_json: kickside.contract:persisted_json
