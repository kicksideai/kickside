      test: wippy.test:test
      security_consts: kickside.security:security_consts
      canonical_json: kickside.contract:canonical_json
  - name: legacy_policy_binding_continuity_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_security
      group: KickSide Security
    source: file://legacy_policy_binding_continuity_test.lua
