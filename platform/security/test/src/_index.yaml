      policy_groups: kickside.security.service:policy_groups
      trigger_reconcile: kickside.security:trigger_reconcile
      scope_writer: app:registry_fixture
      scope_store: kickside.security.persist:scope_store
      scope_projection: kickside.security.service:scope_projection
      source_scope: app:source_scope
      test: wippy.test:test
      security_consts: kickside.security:security_consts
      canonical_json: kickside.contract:canonical_json

  - name: policy_coverage_test
    kind: function.lua
    meta: {type: test, suite: kickside_security}
    source: file://policy_coverage_test.lua
    method: run
    imports:
      policy_coverage: kickside.security:policy_coverage
      test: wippy.test:test

  - name: catalog_registry_failure_test
    kind: function.lua
    meta: {type: test, suite: kickside_security}
    source: file://catalog_registry_failure_test.lua
    method: run
    imports:
      test: wippy.test:test
      registry: app:security_dependency_fixture
      catalog: app:catalog_registry_probe
      scopes: kickside.security.persist:scope_store

  - name: security_dependency_fixture
    kind: library.lua
    source: file://security_dependency_fixture.lua

  - name: catalog_registry_probe
    kind: library.lua
    source: file://catalog_source.lua
    imports:
      scope_key: kickside.security.projection:scope_key
      registry: app:security_dependency_fixture
      security_consts: kickside.security:security_consts
      scope_store: kickside.security.persist:scope_store
      security_types: kickside.security:security_types

  - name: database_config_probe
    kind: library.lua
    source: file://database_config_source.lua
    imports:
      registry: app:security_dependency_fixture
  - name: database_config_test
    kind: function.lua
    meta: {type: test, suite: kickside_security}
    source: file://database_config_test.lua
    method: run
    imports:
      group_resolver: kickside.security.runtime:groups
      trigger_reconcile: kickside.security:trigger_reconcile
      scope_writer: app:registry_fixture
      projection: kickside.security.service:scope_projection
      test: wippy.test:test
      registry_fixture: app:security_dependency_fixture
      configured: app:database_config_probe
      security_consts: kickside.security:security_consts
      scopes: kickside.security.persist:scope_store

  - name: trigger_request_probe
    kind: library.lua
    source: file://trigger_request_source.lua
    modules: [channel, time]
    imports:
      funcs: app:security_dependency_fixture
      security_consts: kickside.security:security_consts
  - name: trigger_request_failure_test
    kind: function.lua
    meta: {type: test, suite: kickside_security}
    source: file://trigger_request_failure_test.lua
    method: run
    imports:
      test: wippy.test:test
      funcs_fixture: app:security_dependency_fixture
      trigger: app:trigger_request_probe

  - name: projection_registry_probe
