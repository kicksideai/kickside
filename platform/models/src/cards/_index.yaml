version: "1.0"
namespace: kickside.models.cards

# The model cards contract. This namespace is outside the member module grant
# (kickside.models.security:module_runtime); a module calls it only through
# kickside.models.security:card_registrar.

entries:
  - name: database_config_read
    kind: security.policy
    meta:
      private: true
      comment: Read the Models database binding when reading, retiring or deleting a stored card.
    policy:
      resources: [kickside.models:db_config]
      actions: [registry.get]
      effect: allow

  - name: registry_cards_read
    kind: security.policy
    meta:
      private: true
      comment: Read the registry-declared llm.model cards the catalog merges with stored cards, so card readers answer registry cards and their routes.
    policy:
      resources: '*'
      actions: [registry.find, registry.get]
      effect: allow

  - name: cards
    kind: contract.definition
    meta:
      title: Model Cards
      description: Read, register, retire and delete model cards without the admin HTTP surface. Upserts share the PUT /models/cards save path. Retirement keeps the stored row; deleting a retired card removes it. Both refresh the cache.
    methods:
      - name: list_cards
        description: list_cards({}) -> { success, models?, error? }. Every catalog card in its public projection, registry-declared and stored, disabled cards included.
        input_schemas:
          - definition: |
              { "type": "object", "properties": {} }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "models": { "type": "array", "items": { "type": "object" } }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json
      - name: get_card
        description: get_card({ name }) -> { success, model?, error? }. One catalog card in its public projection, disabled cards included. model.routes lists every route in order with provider_id, provider_model, provider_profile_id, options, and any route-owned pricing and limits.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": { "name": { "type": "string", "minLength": 1 } },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "model": { "type": "object" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json
      - name: list_card_summaries
        description: Page compact public card summaries, including disabled cards, in name order. Filter by a case-insensitive substring of the name, title or provider model.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": { "q": { "type": "string" }, "limit": { "type": "integer", "minimum": 1, "maximum": 100 }, "cursor": { "type": "string" } } }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "cards": { "type": "array", "items": { "type": "object" } }, "next_cursor": { "type": "string" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json
      - name: upsert_card
        description: upsert_card(card) -> { success, model?, error? }. Creates or updates the card by name; omitted fields keep the saved values.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": {
                  "name": { "type": "string", "minLength": 1 },
                  "title": { "type": "string" },
                  "description": { "type": "string" },
                  "provider_id": { "type": "string", "description": "Provider entry id" },
                  "provider_profile_id": { "type": "string", "description": "Provider profile the card routes through" },
                  "provider_model": { "type": "string", "description": "Model name at the provider" },
                  "capabilities": { "type": "array", "items": { "type": "string" } },
                  "class": { "type": "array", "items": { "type": "string" } },
                  "priority": { "type": "number" },
                  "max_tokens": { "type": "number" },
                  "output_tokens": { "type": "number" },
                  "dimensions": { "type": "number" },
                  "pricing": { "type": "object" },
                  "options": { "type": "object" },
                  "source": { "type": "string" },
                  "enabled": { "type": "boolean" },
                  "metadata": {
                    "type": "object",
                    "properties": {
                      "train": {
                        "type": "object",
                        "properties": {
                          "weights_digest": { "type": "string" },
                          "manifest_sha256": { "type": "string" },
                          "lineage": { "description": "Parent cards, datasets and runs the weights derive from" }
                        },
                        "required": ["weights_digest", "manifest_sha256"]
                      }
                    }
                  }
                },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "model": { "type": "object" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json
      - name: disable_card
        description: disable_card({ name }) -> { success, model?, error? }. Disables a stored card and keeps its row; disabling a disabled card succeeds.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": { "name": { "type": "string", "minLength": 1 } },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "model": { "type": "object" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json
      - name: delete_card
        description: delete_card({ name }) -> { success, error? }. Deletes a stored card that is disabled; an enabled card is in use and is refused, so a caller retires a card with disable_card before deleting it.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": { "name": { "type": "string", "minLength": 1 } },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json

  - name: list_cards
    kind: function.lua
    meta:
      comment: cards contract -- every catalog card, disabled cards included.
    source: file://cards_contract.lua
    method: list_cards
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
      keyset: kickside.contract:keyset
    security:
      policies:
        - kickside.models.cards:registry_cards_read
        - kickside.models.cards:database_config_read
        - kickside.models.catalog:catalog_database
        - kickside.models.catalog:catalog_read
        - kickside.models:reload_profiles_call

  - name: list_card_summaries
    kind: function.lua
    meta:
      comment: cards contract -- page compact public card summaries, disabled cards included.
    source: file://cards_contract.lua
    method: list_card_summaries
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
      keyset: kickside.contract:keyset
    security:
      policies:
        - kickside.models.cards:registry_cards_read
        - kickside.models.cards:database_config_read
        - kickside.models.catalog:catalog_database
        - kickside.models.catalog:catalog_read
        - kickside.models:reload_profiles_call

  - name: get_card
    kind: function.lua
    meta:
      comment: cards contract -- one catalog card by name, disabled cards included.
    source: file://cards_contract.lua
    method: get_card
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
      keyset: kickside.contract:keyset
    security:
      policies:
        - kickside.models.cards:registry_cards_read
        - kickside.models.cards:database_config_read
        - kickside.models.catalog:catalog_database
        - kickside.models.catalog:catalog_read
        - kickside.models:reload_profiles_call

  - name: upsert_card
    kind: function.lua
    meta:
      comment: cards contract -- create or update a card by name through the shared card service.
    source: file://cards_contract.lua
    method: upsert_card
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
      keyset: kickside.contract:keyset
    security:
      policies:
        - kickside.models.catalog:catalog_database
        - kickside.models.catalog:catalog_read
        - kickside.models.catalog:provider_binding_read
        - kickside.models:reload_profiles_call

  - name: disable_card
    kind: function.lua
    meta:
      comment: cards contract -- retire a stored card and keep its row.
    source: file://cards_contract.lua
    method: disable_card
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
      keyset: kickside.contract:keyset
    security:
      policies:
        - kickside.models.cards:database_config_read
        - kickside.models.catalog:catalog_database
        - kickside.models:reload_profiles_call

  - name: delete_card
    kind: function.lua
    meta:
      comment: cards contract -- delete a retired stored card.
    source: file://cards_contract.lua
    method: delete_card
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
      keyset: kickside.contract:keyset
    security:
      policies:
        - kickside.models.cards:database_config_read
        - kickside.models.catalog:catalog_database
        - kickside.models:reload_profiles_call

  - name: cards_binding
    kind: contract.binding
    meta:
      title: Model Cards Service
      comment: Canonical implementation of kickside.models.cards:cards.
    contracts:
      - contract: kickside.models.cards:cards
        default: true
        methods:
          list_cards: kickside.models.cards:list_cards
          list_card_summaries: kickside.models.cards:list_card_summaries
          get_card: kickside.models.cards:get_card
          upsert_card: kickside.models.cards:upsert_card
          disable_card: kickside.models.cards:disable_card
          delete_card: kickside.models.cards:delete_card
