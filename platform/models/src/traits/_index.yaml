version: "1.0"
namespace: kickside.models.traits

# Agent surface over the kickside.models.cards:cards and
# kickside.models.profiles:profiles contracts. The namespace is outside the member
# module grant; a group receives a trait and its tools through the
# kickside.models.security:card_tools and :profile_tools policies.

entries:
  - name: card_manager
    kind: registry.entry
    meta:
      type: agent.trait
      title: Model Card Manager
      public: true
      icon: tabler:cpu
      comment: Lists, reads, saves, retires and deletes model catalog cards.
      tags: [models, catalog, cards, management]
    prompt: |
      You can manage the model catalog with **ModelCardsRead** and **ModelCardsManage**.

      Call ModelCardsRead action=list for compact card summaries in pages of 25
      by default; pass next_cursor as cursor for the next page and q to filter
      by name, title or provider model. Call action=get with a card name for the
      full card, including its options, pricing and metadata.

      ModelCardsManage action=upsert takes card {name, provider_profile_id or
      provider_id, provider_model, ...} and creates or updates the card
      card.name names; fields
      the card omits keep their saved values. A card routes through a provider
      profile (provider_profile_id) or a provider entry (provider_id) and names
      the provider's model in provider_model. Credentials belong on the provider
      profile: card fields and URLs never carry them. action=disable retires a
      card and keeps its row; upsert with enabled true restores it. action=delete
      removes a card and accepts only a disabled one, so disable a card first.
      A refusal returns success false with the reason.
    tools:
      - kickside.models.traits:cards_read
      - kickside.models.traits:cards_manage

  - name: cards_client
    kind: library.lua
    meta:
      comment: Opens the model cards contract as the caller and maps its replies onto tool results.
    source: file://cards_client.lua
    modules: [contract, security]
    imports:
      tool_result: kickside.contract:tool_result

  - name: cards_read
    kind: function.lua
    meta:
      type: tool
      title: Model Cards Read
      public: true
      mcp:
        required_scopes: [state.read]
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": { "type": "string", "enum": ["list", "get"], "description": "list: compact card summaries in pages. get: one full card by name." },
            "name": { "type": "string", "minLength": 1, "description": "get: the card name." },
            "q": { "type": "string", "description": "list: case-insensitive substring of the card name, title or provider model." },
            "limit": { "type": "integer", "minimum": 1, "maximum": 100, "description": "list: cards per page; default 25." },
            "cursor": { "type": "string", "description": "list: the next_cursor of the previous page." }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "The action's record. Failures return no result and a typed tool error with a clear message; a contract refusal returns success false with its error.",
          "properties": {
            "success": { "type": "boolean" },
            "error": { "type": "string", "description": "Present with success false: the contract's refusal." },
            "count": { "type": "integer", "description": "list: number of cards in this page." },
            "cards": {
              "type": "array",
              "description": "list: compact summaries (name, title, enabled, source, provider_id, provider_model, provider_profile_id, class, capabilities, priority, error). Use get for the full card.",
              "items": { "type": "object" }
            },
            "next_cursor": { "type": "string", "description": "list: pass as cursor for the next page; absent on the last page." },
            "card": { "type": "object", "description": "get: the full card in its public projection." }
          },
          "required": ["success"]
        }
      llm_alias: ModelCardsRead
      llm_description: "Read the model catalog: list compact card summaries in pages of 25 by default (limit at most 100, q filters by name, title or provider model; pass next_cursor as cursor for the next page), or get one full card by name. Disabled cards are included. Read-only. Failures return a typed tool error; a refusal returns success false with its error."
    source: file://cards_read.lua
    method: handler
    imports:
      cards_client: kickside.models.traits:cards_client
      tool_action: kickside.contract:tool_action
      tool_result: kickside.contract:tool_result
      keyset: kickside.contract:keyset

  - name: cards_manage
    kind: function.lua
    meta:
      type: tool
      title: Model Cards Manage
      public: true
      mcp:
        required_scopes: [state.write]
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": { "type": "string", "enum": ["upsert", "disable", "delete"], "description": "upsert: card (card.name names the card). disable, delete: name. delete accepts only a disabled card; an enabled one is refused with code card_enabled." },
            "name": { "type": "string", "minLength": 1, "description": "disable, delete: the card name." },
            "card": {
              "type": "object",
              "description": "upsert: the card, created or updated by name; omitted fields keep their saved values.",
              "properties": {
                "name": { "type": "string", "minLength": 1 },
                "title": { "type": "string" },
                "description": { "type": "string" },
                "provider_id": { "type": "string", "description": "Provider entry id" },
                "provider_profile_id": { "type": "string", "description": "Provider profile the card routes through" },
                "provider_model": { "type": "string", "description": "Model name at the provider" },
                "capabilities": { "type": "array", "items": { "type": "string" } },
                "class": { "type": "array", "items": { "type": "string" } },
                "priority": { "type": "number" },
                "max_tokens": { "type": "number" },
                "output_tokens": { "type": "number" },
                "dimensions": { "type": "number" },
                "pricing": { "type": "object" },
                "options": { "type": "object" },
                "source": { "type": "string" },
                "enabled": { "type": "boolean" },
                "metadata": { "type": "object", "description": "metadata.train, when present, carries weights_digest and manifest_sha256." }
              },
              "required": ["name"]
            }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "The action's record. Failures return no result and a typed tool error with a clear message; a contract refusal returns success false with its error.",
          "properties": {
            "success": { "type": "boolean" },
            "error": { "type": "string", "description": "Present with success false: the contract's refusal." },
            "card": { "type": "object", "description": "upsert, disable: the stored card in its public projection." },
            "name": { "type": "string", "description": "delete: the deleted card." }
          },
          "required": ["success"]
        }
      llm_alias: ModelCardsManage
      llm_description: "Manage model catalog cards. upsert {action: upsert, card: {name, provider_profile_id or provider_id, provider_model, class, capabilities, enabled, ...}} creates or updates the card card.name names (omitted fields keep saved values; credentials belong on the provider profile, never on the card). disable retires a card and keeps its row; upsert with enabled true restores it. delete removes a disabled card; an enabled card is refused with code card_enabled: disable it first. Failures return a typed tool error; a refusal returns success false with its error."
    source: file://cards_manage.lua
    method: handler
    imports:
      cards_client: kickside.models.traits:cards_client
      tool_action: kickside.contract:tool_action
      tool_result: kickside.contract:tool_result

  - name: profile_manager
    kind: registry.entry
    meta:
      type: agent.trait
      title: Model Provider Profile Manager
      public: true
      icon: tabler:plug-connected
      comment: Lists, reads, creates, updates and deletes model provider profiles.
      tags: [models, providers, profiles, management]
    prompt: |
      You can manage model provider profiles with **ModelProfilesRead** and **ModelProfilesManage**.

      ModelProfilesRead action=list returns every profile; action=get with an id
      returns one. A profile never reveals a secret value: has_api_key and
      secret_fields name the credentials that are stored, and config shows the
      public settings, including any *_env pointers.

      ModelProfilesManage action=create saves a profile (name, provider_id, config
      settings such as base_url, enabled) and, when enabled, tests it, so the
      reply's status is healthy or unhealthy with the reason; a disabled profile
      remains untested and unknown; action=test with an id tests it again,
      and with model (the provider_model of a card being routed) probes that
      model; action=update with an id changes it and
      keeps every setting and stored secret the patch omits; action=delete removes
      the profile and the cards routed through it.

      Prefer an environment reference for credentials: set api_key_env (or the
      provider's *_env setting such as access_key_env, secret_key_env,
      session_token_env, google_credentials_env or access_token_env) to the name of
      an environment variable the runtime holds, so no secret passes through the
      tool. When no variable exists, pass the credential once as api_key,
      access_key, secret_key, session_token, google_credentials, access_token or
      headers; it is stored encrypted and never returned. A refusal returns
      success false with the reason.
    tools:
      - kickside.models.traits:profiles_read
      - kickside.models.traits:profiles_manage

  - name: profiles_client
    kind: library.lua
    meta:
      comment: Opens the provider profiles contract as the caller and maps its replies onto tool results.
    source: file://profiles_client.lua
    modules: [contract, security]
    imports:
      tool_result: kickside.contract:tool_result

  - name: profiles_read
    kind: function.lua
    meta:
      type: tool
      title: Model Profiles Read
      public: true
      mcp:
        required_scopes: [state.read]
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": { "type": "string", "enum": ["list", "get"], "description": "list: every provider profile. get: one profile by id." },
            "id": { "type": "string", "minLength": 1, "description": "get: the profile id." }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "The action's record. Failures return no result and a typed tool error with a clear message; a contract refusal returns success false with its error. Secret values never appear.",
          "properties": {
            "success": { "type": "boolean" },
            "error": { "type": "string", "description": "Present with success false: the contract's refusal." },
            "count": { "type": "integer", "description": "list: number of profiles." },
            "profiles": { "type": "array", "description": "list: profiles in the public projection.", "items": { "type": "object" } },
            "profile": { "type": "object", "description": "get: id, name, provider_id, enabled, config (public settings and *_env pointers), status, has_api_key, has_api_key_env and secret_fields (names of stored secrets)." }
          },
          "required": ["success"]
        }
      llm_alias: ModelProfilesRead
      llm_description: "Read model provider profiles: list every profile or get one by id. Replies show public settings, *_env pointers and the names of stored secrets, never secret values. Read-only. Failures return a typed tool error; a refusal returns success false with its error."
    source: file://profiles_read.lua
    method: handler
    imports:
      profiles_client: kickside.models.traits:profiles_client
      tool_action: kickside.contract:tool_action
      tool_result: kickside.contract:tool_result

  - name: profiles_manage
    kind: function.lua
    meta:
      type: tool
      title: Model Profiles Manage
      public: true
      mcp:
        required_scopes: [state.write]
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": { "type": "string", "enum": ["create", "update", "delete", "test"], "description": "create: profile. update: id and profile patch. delete: id; also removes the cards routed through the profile, refused with code profile_in_use naming the holders while records of another module (a driver profile's route) name it. test: id, optional model; checks every *_env reference resolves, probes the provider (with model, the card's model) and, without model, records the profile status (healthy, unhealthy). create tests an enabled profile the same way; a disabled profile remains untested and unknown." },
            "id": { "type": "string", "minLength": 1, "description": "update, delete, test: the profile id." },
            "model": { "type": "string", "minLength": 1, "description": "test: the provider_model of the card being routed through the profile; the probe generates with that model and records no profile status. Without it the probe uses the profile's test_model or the first model the provider lists, and records the profile status." },
            "profile": {
              "type": "object",
              "description": "create: the profile. update: the fields to change; omitted settings and stored secrets keep their saved values.",
              "properties": {
                "id": { "type": "string", "description": "create: stable id; derived from the name when omitted." },
                "name": { "type": "string", "minLength": 1 },
                "provider_id": { "type": "string", "description": "Registered llm.provider entry id, e.g. wippy.llm.openai_compat:provider." },
                "icon": { "type": "string" },
                "enabled": { "type": "boolean" },
                "config": { "type": "object", "description": "Public settings (base_url, timeout, retry, test_model, ...). *_env keys name environment variables that hold credentials." },
                "api_key_env": { "type": "string", "description": "Environment variable holding the API key; preferred over api_key." },
                "api_key": { "type": "string", "description": "Write-only credential, stored encrypted and never returned. Prefer api_key_env." },
                "headers": { "type": "object", "description": "Write-only provider request headers, stored encrypted." }
              },
              "required": []
            }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "The action's record. Failures return no result and a typed tool error with a clear message; a contract refusal returns success false with its error. Secret values never appear.",
          "properties": {
            "success": { "type": "boolean" },
            "error": { "type": "string", "description": "Present with success false: the contract's refusal." },
            "code": { "type": "string", "description": "Present with some refusals: profile_in_use (delete of a held profile), profile_unhealthy (a failed test)." },
            "holders": { "type": "array", "description": "profile_in_use: each record naming the profile, { kind, id, title? }.", "items": { "type": "object" } },
            "profile": { "type": "object", "description": "create, update: the stored profile in its public projection; secret_fields names the stored secrets." },
            "test": { "type": "object", "description": "test: the probe's result (mode, model, message)." },
            "id": { "type": "string", "description": "delete: the deleted profile id." }
          },
          "required": ["success"]
        }
      llm_alias: ModelProfilesManage
      llm_description: "Manage model provider profiles. create saves a profile and tests it when enabled, returning healthy or unhealthy status with the reason; a disabled profile remains untested and unknown. update patches one by id and keeps omitted settings and stored secrets; delete removes it with its cards, refused with code profile_in_use while another module's records name it; test checks its *_env references and provider (pass model, a card's provider_model, to probe the model being routed) and without model records its status. Prefer api_key_env (an environment variable name) over api_key; credentials passed in are stored encrypted and never returned. Every write is logged. Failures return a typed tool error; a refusal returns success false with its error."
    source: file://profiles_manage.lua
    method: handler
    imports:
      profiles_client: kickside.models.traits:profiles_client
      tool_action: kickside.contract:tool_action
      tool_result: kickside.contract:tool_result
