version: "1.0"
namespace: kickside.models
entries:
  - name: preset.openai_compatible_plain
    kind: registry.entry
    meta:
      type: kickside.models:provider_profile_preset
      comment: OpenAI-compatible endpoint that requires plain string Chat Completions message content.
    key: openai-compatible-plain
    title: OpenAI Compatible (plain chat)
    description: Use for compatible APIs that reject structured content arrays in chat messages.
    icon: tabler:message
    provider_id: kickside.models:openai_compat_plain.provider
    profile_editor_tag: kickside-model-provider-openai-compatible
    # Niche variant (endpoints that reject structured content); kept out of the
    # onboarding picker to avoid a duplicate "OpenAI Compatible" tile. Still
    # available in full Models settings.
    onboarding: false
    order: 10.5
    config:
      base_url: http://localhost:11434/v1
      timeout: 600

