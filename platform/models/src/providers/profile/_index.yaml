version: "1.0"
namespace: kickside.models.providers.profile
entries:
  - name: status
    kind: function.lua
    source: file://driver.lua
    method: status
    modules: [base64, crypto, ctx, json, registry]
    imports:
      canonical: kickside.contract:canonical_json
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
      platform_cap: kickside.models.providers.profile:platform_cap
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models:reload_profiles_call, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context, kickside.models.providers.profile:platform_usage, kickside.models.providers.profile:platform_usage_database]
  - name: generate
    kind: function.lua
    source: file://driver.lua
    method: generate
    modules: [base64, crypto, ctx, json, registry]
    imports:
      canonical: kickside.contract:canonical_json
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
      platform_cap: kickside.models.providers.profile:platform_cap
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models:reload_profiles_call, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context, kickside.models.providers.profile:platform_usage, kickside.models.providers.profile:platform_usage_database]
  - name: embed
    kind: function.lua
    source: file://driver.lua
    method: embed
    modules: [base64, crypto, ctx, json, registry]
    imports:
      canonical: kickside.contract:canonical_json
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
      platform_cap: kickside.models.providers.profile:platform_cap
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models:reload_profiles_call, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context, kickside.models.providers.profile:platform_usage, kickside.models.providers.profile:platform_usage_database]
  - name: structured_output
    kind: function.lua
    source: file://driver.lua
    method: structured_output
    modules: [base64, crypto, ctx, json, registry]
    imports:
      canonical: kickside.contract:canonical_json
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
      platform_cap: kickside.models.providers.profile:platform_cap
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models:reload_profiles_call, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context, kickside.models.providers.profile:platform_usage, kickside.models.providers.profile:platform_usage_database]
  - name: evaluate
    kind: function.lua
    source: file://driver.lua
    method: evaluate
    modules: [base64, crypto, ctx, json, registry]
    imports:
      canonical: kickside.contract:canonical_json
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
      platform_cap: kickside.models.providers.profile:platform_cap
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models:reload_profiles_call, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context, kickside.models.providers.profile:platform_usage, kickside.models.providers.profile:platform_usage_database]
  - name: provider_contract
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [wippy.llm:provider]
      actions: [contract.get]
      effect: allow
  - name: provider_call
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [status, generate, embed, structured_output, evaluate]
      actions: [contract.call]
      effect: allow
  - name: provider_context
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [context]
      actions: [contract.context]
      effect: allow
  - name: platform_cap
    kind: library.lua
    meta:
      comment: Monthly token cap for profiles that use the deploying platform's model key.
    source: file://platform_cap.lua
    modules: [env, sql, time]
    imports:
      models_types: kickside.models:models_types
  - name: platform_usage
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [KICKSIDE_PLATFORM_LLM_API_KEY, KICKSIDE_PLATFORM_TOKEN_MONTHLY_CAP]
      actions: [env.get]
      effect: allow
  - name: platform_usage_database
    kind: security.policy
    meta: {private: true}
    policy:
      resources: []
      actions: [db.get]
      effect: allow
