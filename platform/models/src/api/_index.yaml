version: "1.0"
namespace: kickside.models.api

# Read-only model-discovery HTTP API. These endpoints attach to the host-wired
# api_router (auth + endpoint_firewall enforced there) and remain available to
# normal authenticated users. Admin/provider-profile and model-card editor
# endpoints live under kickside.models.api.admin.

entries:

  - name: list_models
    kind: function.lua
    meta:
      comment: "GET /models/list[?capability=generate|embed|<cap>] — models by capability and the caller's Models setup access."
    source: file://list_models.lua
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models:reload_profiles_call, kickside.models.api:provider_presentation_read]
    modules: [http, security]
    imports:
      models: kickside.models.catalog:model_catalog
      provider_read_model: kickside.models.providers:provider_read_model
    method: handler

  - name: list_models.endpoint
    kind: http.endpoint
    meta: {}
    method: GET
    func: list_models
    path: /models/list

  - name: list_model_classes
    kind: function.lua
    meta:
      comment: GET /models/classes — model classes (fast/balanced/…) with their members.
    source: file://list_model_classes.lua
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models:reload_profiles_call, kickside.models.api:provider_presentation_read]
    modules: [http]
    imports:
      models: kickside.models.catalog:model_catalog
      provider_read_model: kickside.models.providers:provider_read_model
      classes_read_model: kickside.models.classes:read_model
    method: handler

  - name: list_model_classes.endpoint
    kind: http.endpoint
    meta: {}
    method: GET
    func: list_model_classes
    path: /models/classes

  - name: models_by_name
    kind: function.lua
    meta:
      comment: "GET /models/by-name?models=a,b — resolve names or class:<name> refs to name/title/description."
    source: file://get_models_by_name.lua
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models:reload_profiles_call]
    modules: [http]
    imports:
      models: kickside.models.catalog:model_catalog
    method: handler

  - name: models_by_name.endpoint
    kind: http.endpoint
    meta: {}
    method: GET
    func: models_by_name
    path: /models/by-name

  - name: provider_presentation_read
    kind: security.policy
    meta:
      private: true
      comment: Model list handlers read registry-declared provider presentation, including installed extensions.
    policy:
      resources: '*'
      actions: [registry.find]
      effect: allow
