version: "1.0"
namespace: kickside.models.persist

entries:

  - name: repo
    kind: library.lua
    meta:
      comment: Persistence for model provider profiles and DB-backed cards -- SQL, the write-through snapshot, and the profile.changed broadcast.
    source: file://repo.lua
    modules: [sql, uuid, funcs, process]
    imports:
      models_types: kickside.models:models_types
      models_cache: kickside.models.service:models_cache
      catalog_policy: kickside.models.catalog:policy
      catalog_card_policy: kickside.models.catalog:card_policy

  # Profile change delivery runs under the models identity: writing principals
  # need no process messaging authority.

  - name: profile_changed_transport
    kind: security.policy
    meta:
      private: true
      comment: Lets the profile change signal message the registered profile.changed subscriber.
    policy:
      resources: '*'
      actions: process.send
      effect: allow

  - name: profile_changed_signal
    kind: function.lua
    meta:
      private: true
      comment: Delivers one committed profile change to the registered profile.changed subscriber.
    source: file://repo.lua
    method: deliver_profile_changed
    modules: [sql, uuid, funcs, process]
    imports:
      models_types: kickside.models:models_types
      models_cache: kickside.models.service:models_cache
      catalog_policy: kickside.models.catalog:policy
      catalog_card_policy: kickside.models.catalog:card_policy
    security:
      actor:
        id: kickside.models.persist:profile_changed_signal
      policies:
        - kickside.models.persist:profile_changed_transport

  - name: models_secrets
    kind: library.lua
    meta: { comment: "AES encryption for provider profile secrets, keyed by ENCRYPTION_KEY." }
    source: file://secrets.lua
    modules: [env, crypto]
    imports:
      canonical: kickside.contract:canonical_json
      secret_cipher: kickside.contract:secret_cipher


  - name: reload_profiles
    kind: function.lua
    meta: {private: true}
    source: file://repo.lua
    method: reload_profiles
    modules: [sql, uuid, funcs, process]
    imports:
      models_types: kickside.models:models_types
      models_cache: kickside.models.service:models_cache
      catalog_policy: kickside.models.catalog:policy
      catalog_card_policy: kickside.models.catalog:card_policy
    security:
      policies:
        - kickside.models.catalog:catalog_database
        - kickside.models.persist:publish_profile_cache
        - kickside.models.persist:decode_profiles_call

  - name: decode_profiles
    kind: function.lua
    meta: {private: true}
    source: file://profile_reload.lua
    method: run
    imports:
      models_secrets: kickside.models.persist:models_secrets
      catalog_policy: kickside.models.catalog:policy
      models_types: kickside.models:models_types
    security:
      policies: [kickside.models:secret_key_access]

  - name: decode_profiles_call
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [kickside.models.persist:decode_profiles]
      actions: [funcs.call, funcs.security]
      effect: allow

  - name: profile_changed_call
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [kickside.models.persist:profile_changed_signal]
      actions: [funcs.call, funcs.security]
      effect: allow

  - name: publish_profile_cache
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [kickside.models:cache]
      actions: [store.get, store.key.set]
      effect: allow
