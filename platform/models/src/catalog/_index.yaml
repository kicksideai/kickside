version: "1.0"
namespace: kickside.models.catalog

# The live model catalog. Models are NOT declared statically here — they are
# discovered from a configured provider profile during onboarding
# (Settings -> Models -> add provider -> discover), then assigned to capability
# classes (fast/nano/balanced/premium/embed) from the UI. Class tiers are
# declared in kickside.models.classes; discovered llm.model entries reference them.

entries:

  - name: policy
    kind: library.lua
    meta:
      comment: Provider profile policy for input cleaning, config/secret separation, sensitive scrubbing, provider hooks, and public projections.
    source: file://policy.lua
    modules: [json, registry, funcs]
    imports:
      models_types: kickside.models:models_types
      models_secrets: kickside.models.persist:models_secrets
      llm_transport: wippy.llm.util:transport


  - name: card_policy
    kind: library.lua
    meta:
      comment: Model card projections and input cleaning.
    source: file://card_policy.lua
    imports:
      catalog_policy: kickside.models.catalog:policy
      models_types: kickside.models:models_types
      model_mapper: kickside.models.discovery:mapper
      registry_models: wippy.llm.discovery:models

  - name: model_catalog
    kind: library.lua
    meta:
      comment: Merged registry + DB/cache model catalog used by UI APIs and the LLM resolver.
    source: file://model_catalog.lua
    imports:
      registry_models: wippy.llm.discovery:models
      models_repo: kickside.models.persist:repo
      catalog_card_policy: kickside.models.catalog:card_policy

  - name: model_resolver_func
    kind: function.lua
    source: file://resolver.lua
    method: resolve
    security:
      policies:
        - kickside.models.catalog:catalog_read
        - kickside.models.catalog:provider_binding_read
        - kickside.models:reload_profiles_call
    imports:
      model_catalog: kickside.models.catalog:model_catalog
      providers: wippy.llm.discovery:providers
      route_policy: wippy.llm.util:route

  - name: provider_binding_read
    kind: security.policy
    meta:
      private: true
      comment: Resolve the driver binding selected by a saved provider, including custom providers.
    policy:
      resources: '*'
      actions: [registry.get]
      effect: allow

  - name: catalog_read
    kind: security.policy
    meta:
      private: true
      comment: Model readers open the private snapshot inside their execution boundary.
    policy:
      resources: [kickside.models:cache]
      actions: [store.get, store.key.get]
      effect: allow

  - name: catalog_database
    kind: security.policy
    meta: {private: true}
    policy:
      resources: []
      actions: [db.get]
      effect: allow

  - name: card_service
    kind: library.lua
    meta:
      comment: Single write path for model cards, shared by the admin handlers and the cards contract.
    source: file://card_service.lua
    imports:
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo

  - name: profile_service
    kind: library.lua
    meta:
      comment: Single write path for provider profiles, shared by the admin handlers and the profiles contract; records each write.
    source: file://profile_service.lua
    modules: [security, logger]
    imports:
      models_repo: kickside.models.persist:repo
