version: "1.0"
namespace: app

# Agent tools over kickside.models.profiles:profiles. The tools run from the
# registry as shipped, under the scope the profile tools policy composes; no
# provider is contacted.

entries:
  - name: profile_tools_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_models_profile_tools
      comment: Listing, reading, saving and deleting provider profiles through the profile agent tools.
    source: file://test.lua
    modules: [funcs, security, registry, json]
    method: run
    imports:
      test: wippy.test:test
      models_repo: kickside.models.persist:repo

  # A profile holder: it holds the profile pt-held-profile with one fixture driver.
  - name: profile_holder_fixture
    kind: function.lua
    meta:
      comment: Answers the fixture driver holding pt-held-profile.
    source: file://holder.lua
    method: holders

  - name: profile_holder_binding
    kind: contract.binding
    meta:
      comment: The fixture's implementation of kickside.models.profiles:profile_holder.
    contracts:
      - contract: kickside.models.profiles:profile_holder
        methods:
          holders: app:profile_holder_fixture
