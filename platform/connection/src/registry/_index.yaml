version: "1.0"
namespace: kickside.connection.registry

# Canonical implementation of the kickside.connection:connections contract.
# Single source file (connections.lua) provides all 7 methods; each contract
# method maps to one function.lua entry that selects the right method via
# the `method:` field.

entries:
