    kind: function.lua
    meta:
      comment: connections registry — register
    source: file://connections.lua
    method: register
    modules: [contract, registry, security]
    imports:
      component: kickside.component:component
      conn_types: kickside.connection:types
      envelope: kickside.component:envelope

