version: "1.0"
override:
  "app.client_test:server:addr": ":${provider_http_port}"
  "app.client_test:probe:meta.endpoint": "http://127.0.0.1:${provider_http_port}/provider"
  "app:db:file": "${sqlite_path}"
workspace:
  replacements:
    kickside/uploads: ../../uploads
    kickside/security: ../../security
    kickside/realtime-dispatch: ../../../core/realtime-dispatch
    kickside/identity: ../../identity
    kickside/channel: ../../channel
    kickside/agents: ../../agents
    kickside/connection: ..
    kickside/automation: ../../automation
    kickside/core: ../../../core/core
    kickside/jobs: ../../../core/jobs
    kickside/component: ../../../core/component
    kickside/contract: ../../../core/contract
    kickside/users: ../../users
    kickside/execution: ../../../core/execution
    kickside/settings: ../../settings
vars:
  provider_http_port: 19185
  sqlite_path: ":memory:"
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_connection
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      "app:db:kind": db.sql.postgres
      "app:db:host": "${pg_host}"
      "app:db:port": "${pg_port}"
      "app:db:database": "${pg_database}"
      "app:db:username": "${pg_username}"
      "app:db:password": "${pg_password}"
      "app:db:options.sslmode": disable
      "app:db:pool.max_open": 16
      "app:db:pool.max_idle": 8

registry:
  dispatch_internal_kinds: [registry.entry, ns.requirement, ns.dependency, ns.definition, security.scope]
