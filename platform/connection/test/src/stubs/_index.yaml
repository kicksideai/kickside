version: "1.0"
namespace: kickside.plugins.stubs

# Shared stub handlers for the per-provider connection / reply_provider bindings
# the registry suites resolve. In the live app these methods live in each
# provider plugin; here they stand in so connection's registries can register,
# find, delete, and validate provider bindings in isolation.

entries:
