version: '1.0'
namespace: kickside.jobs_admin.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Jobs administration
    surface: kickside.jobs_admin
    intent: module_access
    includes:
    - kickside.jobs_admin.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.jobs_admin:*
    - kickside.jobs_admin.api:*
    - kickside.jobs_admin.security:*
    actions:
    - registry.get
    - registry.find
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
    comment: Runtime calls within the Jobs admin module.
  groups: []
  policy:
    resources:
    - kickside.jobs_admin:*
    - kickside.jobs_admin.api:*
    - kickside.jobs_admin.security:*
    actions:
    - registry.get
    - registry.find
    - funcs.call
    - funcs.security
    effect: allow
- name: admin_access
  kind: security.policy
  meta:
    title: Jobs performance administration
    surface: kickside.jobs_admin
    intent: admin_access
    includes:
    - kickside.core.jobs.security:policy_admin
  groups: []
  policy:
    resources:
    - kickside.jobs_admin.api:get_policy.endpoint
    - kickside.jobs_admin.api:put_policy.endpoint
    actions: access
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application member group receiving module discovery and runtime access.
  targets:
  - entry: kickside.jobs_admin.security:module_access
    path: .groups +=
  - entry: kickside.jobs_admin.security:module_runtime
    path: .groups +=
