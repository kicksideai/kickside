version: "1.0"
namespace: app

# Real-LLM eval harness for kickside/transform. Same bootloader/dataflow/session/
# views/relay stack the unit harness wires, PLUS a live models module (app.models)
# so the generator's class:fast reasoning calls and the llm transform kind resolve
# a real model. The transform_eval suite is gated by KICKSIDE_INTEGRATION_TESTS and
# probes the model before running, so a bare `wippy run test` here still passes
# offline (it skips). Harness-only.

entries:
  - name: dep.kickside.security
    kind: ns.dependency
    version: '*'
    component: kickside/security
    parameters:
      - {name: api_router, value: app:api}
      - {name: ui_server, value: app:gateway}
      - {name: target_db, value: app:db}
      - {name: process_host, value: app:processes}

  - name: dep.kickside.transform
    version: '*'
    kind: ns.dependency
    meta:
      comment: Local transform module under evaluation.
    component: kickside/transform
    parameters:
    - name: kickside.transform:api_router
      value: app:api
    - name: kickside.transform:ui_server
      value: app:gateway
    - name: kickside.transform.security:user_security_scope
      value: app:user
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api

  - name: dep.kickside.code_execution
    version: '*'
    kind: ns.dependency
    meta:
      comment: Real sandboxed executor used by the optional code-strategy evaluation.
    component: kickside/code-execution
    parameters:
    - name: kickside.code_execution:api_router
      value: app:api
    - name: kickside.code_execution:ui_server
      value: app:gateway
    - name: kickside.widgets:api_router
      value: app:api
    - name: kickside.widgets:ui_server
      value: app:gateway
    - name: wippy.migration:app_db
      value: app:db

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: In-memory database for the dataflow runtime the generator flow uses.
    file: "${sqlite_path}"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server for the dataflow/session/views deps.
    addr: :0
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      comment: Test API router.
      server: gateway
    prefix: /api

  - name: api_public
    kind: http.router
    meta:
      comment: Separate public router for wippy/views to avoid route collisions.
      server: gateway
    prefix: /public

  - name: user
    kind: security.policy
    meta:
      comment: Permissive scope the harness runs its actor under.
    groups:
      - transform_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: dep.wippy.relay
    version: "*"
    kind: ns.dependency
    meta:
      comment: Relay — transitive dep of session/views.
    component: "wippy/relay"
    parameters:
      - name: user_security_scope
        value: app:user
      - name: env_storage
        value: app.env:store
      - name: application_host
        value: app:processes

  - name: dep.wippy.views
    version: "*"
    kind: ns.dependency
    meta:
      comment: Views — transitive dep of session (artifact rendering).
    component: "wippy/views"
    parameters:
      - name: api_router
        value: app:api_public
      - name: env_storage
        value: app.env:store

  - name: dep.kickside.users
    kind: ns.dependency
    version: '*'
    meta:
      comment: "Users \u2014 owns the app_users table wippy/session's migrations reference; its migrations run before session\
        \ 02 on both engines."
    component: kickside/users
    parameters:
    - name: target_db
      value: app:db
    - name: env_storage
      value: app:env_storage
    - name: public_router
      value: app:api_public
    - name: api_router
      value: app:api
    - name: ui_server
      value: app:gateway
    - name: user_security_scope
      value: app:user
    - name: admin_security_scope
      value: app:user
    - name: login_role_resource
      value: app:user
    - name: kickside.settings:target_db
      value: app:db
    - name: kickside.settings:api_router
      value: app:api
    - name: kickside.settings:ui_server
      value: app:gateway
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 3
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.jobs:process_host
      value: app:processes

  - name: dep.wippy.session
    version: "*"
    kind: ns.dependency
    meta:
      comment: Session — backs wippy/dataflow's session artifact repo.
    component: "wippy/session"
    parameters:
      - name: api_router
        value: app:api
      - name: env_storage
        value: app.env:store
      - name: delegation_func_id
        value: userspace.dataflow.session:delegate

  - name: dep.wippy.dataflow
    version: "*"
    kind: ns.dependency
    meta:
      comment: Dataflow — the durable engine the generator flow compiles to.
    component: "wippy/dataflow"
    parameters:
      - name: target_db
        value: app:db
      - name: process_host
        value: app:processes
      - name: api_router
        value: app:api

  - name: dep.wippy.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Bootloader applies every dep's migrations on boot.
    component: "wippy/bootloader"
    parameters:
      - name: application_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: eval_test
    kind: function.lua
    meta:
      type: test
      suite: transform_eval
      comment: Real-LLM eval of the transform generator; gated by KICKSIDE_INTEGRATION_TESTS, self-skips with no live model.
    source: file://eval_test.lua
    method: run
    modules: [json, env, funcs, time]
    imports:
      test: wippy.test:test
      llm: wippy.llm:llm
      prompt: wippy.llm:prompt
      generator: kickside.transform:generator
