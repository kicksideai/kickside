version: "1.0"
namespace: app.env

# Mirrors the real app's env storage id (app.env:store) as a router over the local
# test.env file and OS env, so the eval gate and model-id variables
# register against a present storage and pick up KICKSIDE_INTEGRATION_TESTS /
# KICKSIDE_TRANSFORM_EVAL_MODEL from the process environment. Harness-only.

entries:
  - name: file
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: os
    kind: env.storage.os
    meta:
      type: envstorage

  - name: store
    kind: env.storage.router
    storages:
      - app.env:file
      - app.env:os

  # Model the eval resolves; defaults to class:fast (the app.models entry). Set
  # KICKSIDE_TRANSFORM_EVAL_MODEL to point the eval at another resolvable id.
  - name: eval_model
    kind: env.variable
    meta:
      comment: Model id the transform_eval suite resolves; defaults to class:fast.
    storage: app.env:store
    variable: KICKSIDE_TRANSFORM_EVAL_MODEL
    default: "class:fast"

  - name: integration_tests_gate
    kind: env.variable
    meta:
      comment: Enables the optional live transform evaluation.
    storage: app.env:store
    variable: KICKSIDE_INTEGRATION_TESTS
