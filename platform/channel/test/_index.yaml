version: "1.0"
namespace: app

# Exercises selected Channel runtime units directly from the production source,
# with harness-owned imports bound to deterministic test collaborators.
entries:
  - name: execution_authority_test
    kind: function.lua
    meta:
      type: test
      suite: channel_execution_authority
    source: file://execution_authority_test.lua
    method: run
    imports:
      test: wippy.test:test
      identity_restrictions: app:identity_restrictions
      execution_identity: app:execution_identity

  - name: dep.wippy_test
    kind: ns.dependency
    component: wippy/test
    version: "*"

  - name: dep.kickside_contract
    kind: ns.dependency
    component: kickside/contract
    version: "*"

  - name: dep.wippy_migration
    kind: ns.dependency
    component: wippy/migration
    version: "*"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: dep.wippy_bootloader
    kind: ns.dependency
    component: wippy/bootloader
    version: "*"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
      - name: wippy.migration:app_db
        value: app:db

  - name: env_storage
    kind: env.storage.file
    file_path: ./.wippy/channel-test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: In-memory database backing channel persist tests.
    file: "${sqlite_path}"

  - name: restart_db_access
    kind: security.policy
    policy:
      resources: '*'
      actions: [db.get]
      effect: allow

  - name: persist
    kind: library.lua
    source: file://src_link/persist/repo.lua
    modules: [sql, uuid, time, json, crypto, hash]
    imports:
      session_acquire: app:session_acquire
      conversation_gc: app:conversation_gc
      channel_retention_policy: app:retention_policy_stub
      channel_conversation: app:channel_conversation
      row_size: app:row_size

  - name: row_size
    kind: library.lua
    source: file://core_link/row_size.lua

  - name: turn_recovery
    kind: library.lua
    source: file://src_link/persist/turn_recovery.lua
    modules: [sql, time]
    imports:
      channel_conversation: app:channel_conversation
  - name: channel_conversation
    kind: library.lua
    source: file://src_link/persist/conversation.lua
    modules: [sql, time]
    imports:
      row_size: app:row_size

  - name: conversation_gc
    kind: library.lua
    source: file://src_link/persist/conversation_gc.lua
    modules: [sql]
    imports:
      channel_conversation: app:channel_conversation

  - name: session_acquire
    kind: library.lua
    source: file://src_link/persist/session_acquire.lua
    modules: [sql, uuid, time, json]
    imports:
      channel_retention_policy: app:retention_policy_stub
      channel_conversation: app:channel_conversation
      row_size: app:row_size

  - name: channel_retention
    kind: library.lua
    source: file://src_link/persist/retention.lua
    modules: [sql]
    imports:
      channel_conversation: app:channel_conversation

  - name: channel_archive_retention
    kind: library.lua
    source: file://src_link/persist/archive_retention.lua
    modules: [sql]
    imports:
      session_service: app:session_service_stub
      session_delete_proof: app:session_delete_proof
      channel_conversation: app:channel_conversation

  - name: complete_unlink
    kind: function.lua
    source: file://src_link/binding/cleanup_conversation_func.lua
    method: complete_unlink
    imports:
      channel_persist: app:persist
      channel_consts: app:channel_consts
      session_service: app:session_service_stub
      session_delete_proof: app:session_delete_proof
      channel_conversation: app:channel_conversation
      conversation_gc: app:conversation_gc

  - name: session_delete_proof
    kind: library.lua
    source: file://src_link/persist/session_delete_proof.lua

  - name: channel_idle_retention
    kind: library.lua
    source: file://src_link/persist/idle_retention.lua
    modules: [sql, time]
    imports:
      channel_conversation: app:channel_conversation

  - name: hub_signal_constrained
    kind: security.policy
    meta:
      comment: Runtime scope of a group principal without process messaging authority; hub messages reach the hub through the channel identity.
    policy:
      resources: '*'
      actions: [funcs.call, funcs.security, registry.get, registry.find, env.get, db.get]
      effect: allow

  - name: hub_signal_probe
    kind: function.lua
    meta: { type: test_helper, comment: Hands one hub message to the session hub through the ingress seam. }
    source: file://hub_signal_probe.lua
    method: run
    imports:
      receive: app:receive

  - name: hub_signal_test
    kind: function.lua
    meta: { type: test, suite: channel }
    source: file://hub_signal_test.lua
    method: run
    modules: [security, funcs, uuid, channel, time, process]
    imports:
      test: wippy.test:test
      channel_consts: app:channel_consts

  - name: archive_retention_test
    kind: function.lua
    meta: { type: test, suite: channel }
    source: file://archive_retention_test.lua
    method: run
    modules: [sql, time]
    imports:
      channel_conversation: app:channel_conversation
      test: wippy.test:test
      persist: app:persist
      retention_policy_stub: app:retention_policy_stub
      receive_fixture: app:receive_fixture
      channel_archive_retention: app:channel_archive_retention
      channel_idle_retention: app:channel_idle_retention
      session_service_stub: app:session_service_stub
      channel_retention_tick: app:channel_retention_tick

  - name: channel_retention_tick
    kind: library.lua
    source: file://src_link/retention.lua
    modules: [time]
    imports:
      channel_consts: app:channel_consts
      channel_retention: app:channel_retention
