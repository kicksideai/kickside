version: '1.0'
namespace: kickside.widgets.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Widgets
    surface: kickside.widgets
    intent: module_access
    includes:
    - kickside.widgets.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.widgets.api:create_view_resolver.endpoint
    actions: access
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.widgets:*
    - kickside.widgets.api:*
    - kickside.widgets.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
