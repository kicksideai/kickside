version: '1.0'
namespace: app
entries:
- name: dep.kickside.security
  kind: ns.dependency
  version: '*'
  component: kickside/security
  parameters:
    - {name: api_router, value: app:api}
    - {name: ui_server, value: app:gateway}
    - {name: target_db, value: app:db}
    - {name: process_host, value: app:processes}

- name: db
  kind: db.sql.sqlite
  file: "${sqlite_path}"
- name: processes
  kind: process.host
  lifecycle:
    auto_start: false
- name: gateway
  kind: http.service
  addr: :19040
  lifecycle:
    auto_start: false
- name: api
  kind: http.router
  meta:
    server: app:gateway
  prefix: /api
- name: dep.test
  kind: ns.dependency
  component: wippy/test
  version: '*'
- name: dep.module
  kind: ns.dependency
  component: kickside/sessions
  version: '*'
  parameters:
  - name: kickside.sessions:api_router
    value: app:api
  - name: kickside.sessions:ui_server
    value: app:gateway
- version: '*'
  name: dep.session
  kind: ns.dependency
  meta: {}
  component: wippy/session
  parameters:
  - name: wippy.session:api_router
    value: app:api
  - name: wippy.session:database_resource
    value: app:db
  - name: wippy.session:default_host
    value: app:processes
  - name: wippy.session:env_storage
    value: app.env:store
  - name: wippy.session:delegation_func_id
    value: userspace.dataflow.session:delegate
  - name: wippy.session:token_checkpoint_threshold
    value: '128000'
  - name: wippy.session:max_message_limit
    value: '500'
  - name: wippy.session:gc_interval
    value: 300s
- name: api.views
  kind: http.router
  meta:
    server: app:gateway
  prefix: /views
- name: dep.bootloader
  kind: ns.dependency
  component: wippy/bootloader
  version: '*'
  parameters:
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app.env:store
- name: dep.views
  kind: ns.dependency
  component: wippy/views
  version: '*'
  parameters:
  - name: wippy.views:env_storage
    value: app.env:store
  - name: wippy.views:api_router
    value: app:api.views
- name: api.public
  kind: http.router
  meta:
    server: app:gateway
  prefix: /api/public
- name: dep.users
  kind: ns.dependency
  component: kickside/users
  version: '*'
  parameters:
  - name: kickside.users:env_storage
    value: app.env:store
  - name: kickside.users:public_router
    value: app:api.public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app.security:user
  - name: kickside.users:admin_security_scope
    value: app.security:admin
  - name: kickside.users:login_role_resource
    value: app.security:*
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
  - name: kickside.component:target_db
    value: app:db
  - name: kickside.component:api_router
    value: app:api
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: app.security:user
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app.security:admin
      subject_type: group
      access_mask: 3
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.projections:process_host
    value: app:processes
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.projections:env_storage
    value: app.env:store
  - name: kickside.core.retention:user_security_scope
    value: app.security:user
  - name: kickside.core.threads:user_security_scope
    value: app.security:user
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.views:api_router
    value: app:api.views
  - name: wippy.views:env_storage
    value: app.env:store
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app.env:store
- name: test_runtime
  kind: security.policy
  groups:
  - app.security:user
  - app.security:admin
  policy:
    resources: '*'
    actions: '*'
    effect: allow
