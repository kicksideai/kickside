version: '1.0'
namespace: kickside.settings.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Settings
    surface: kickside.settings
    intent: module_access
    includes:
    - kickside.settings.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.settings:*
    - kickside.settings.api:*
    - kickside.settings.migrations:*
    - kickside.settings.persist:*
    - kickside.settings.security:*
    - kickside.settings.service:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.settings:*
    - kickside.settings.api:*
    - kickside.settings.migrations:*
    - kickside.settings.persist:*
    - kickside.settings.security:*
    - kickside.settings.service:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: performance_admin
  kind: security.policy
  meta:
    comment: "Performance admin."
    title: Performance administration
    surface: kickside.settings.performance
    intent: admin_access
    includes:
    - kickside.settings.security:performance_policy_write
  groups: []
  policy:
    resources:
    - kickside.settings.api:get_performance.endpoint
    - kickside.settings.api:put_performance.endpoint
    actions: access
    effect: allow
- name: performance_policy_write
  kind: security.policy
  meta: {comment: "Performance policy write.", private: true}
  groups: []
  policy:
    resources: kickside.core.jobs:policy
    actions: jobs.policy.write
    effect: allow
