version: "1.0"
override:
  "kickside.settings.api:get_performance:modules": [json]
  "kickside.settings.api:get_performance:imports.http": app:performance_http
  "kickside.settings.api:put_performance:modules": [json]
  "kickside.settings.api:put_performance:imports.http": app:performance_http
  "kickside.core.jobs.service:worker.service:lifecycle.auto_start": false
  "app:db:file": "${sqlite_path}"
workspace:
  replacements:
    kickside/settings: ..
    kickside/jobs: ../../../core/jobs
    kickside/execution: ../../../core/execution
    kickside/contract: ../../../core/contract
vars:
  sqlite_path: ":memory:"
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_settings
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      "app:db:kind": db.sql.postgres
      "app:db:host": "${pg_host}"
      "app:db:port": "${pg_port}"
      "app:db:database": "${pg_database}"
      "app:db:username": "${pg_username}"
      "app:db:password": "${pg_password}"
      "app:db:options.sslmode": disable
      "app:db:pool.max_open": 16
      "app:db:pool.max_idle": 8
