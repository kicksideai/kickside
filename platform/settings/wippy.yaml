organization: kickside
module: settings
type: plugin
description: KickSide settings — runtime, admin-editable, DB-backed application settings. Modules declare typed setting definitions in the registry; the DB stores only admin overrides; reads fall back to declared defaults.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/kickside
homepage: https://wippy.ai
keywords:
  - kickside
  - settings
  - config
  - admin
embed:
  - kickside.settings:ui_fs
exclude:
  - "app:**"
  - "app.env:**"
  - "ui/node_modules/**"
  - "ui/node_modules:**"
  - "ui/coverage/**"
  - "ui/coverage:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
