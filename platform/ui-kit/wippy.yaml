organization: kickside
module: ui-kit
type: library
description: Shared frontend vocabulary (CSS) that modules consume at build time.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/kickside
homepage: https://wippy.ai
keywords:
  - kickside
  - ui-kit
  - design-system
  - shared
  - frontend

# The package directory IS the deliverable, so it must be embedded. A declared
# but unembedded artifact publishes a module that carries none of its files, and
# a consumer then fails to boot on the missing directory. Embedding also enables
# the publish-time check that package.json's version equals the version being
# published.
embed:
  - kickside.ui_kit:package_fs

exclude:
  - "app:**"
  - "app.env:**"
  - ".wippy/**"
  - ".wippy:**"
  - "test/**"
  - "test:**"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
