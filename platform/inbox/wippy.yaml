organization: kickside
module: inbox
type: plugin
description: KickSide inbox — central review/approval inbox with declarative, web-component-rendered item types and realtime updates.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/kickside
homepage: https://wippy.ai
keywords:
  - kickside
  - inbox
  - review
  - approvals
  - realtime
embed:
  - kickside.inbox:ui_fs
exclude:
  - "app:**"
  - "app.env:**"
  - "ui/node_modules/**"
  - "ui/node_modules:**"
  - "ui/coverage/**"
  - "ui/coverage:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
