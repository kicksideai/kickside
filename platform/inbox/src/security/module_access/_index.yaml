version: '1.0'
namespace: kickside.inbox.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Inbox
    surface: kickside.inbox
    intent: module_access
    includes:
    - kickside.inbox.security:module_runtime
    - kickside.inbox.security:inbox_endpoint_access
  groups: []
  policy:
    resources:
    - kickside.inbox:*
    - kickside.inbox.api:*
    - kickside.inbox.events:*
    - kickside.inbox.persist:*
    - kickside.inbox.security:*
    - kickside.inbox.sink:*
    - kickside.inbox.traits:*
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: inbox_endpoint_access
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.inbox.api:create_item.endpoint
    - kickside.inbox.api:delete_item.endpoint
    - kickside.inbox.api:file_content.endpoint
    - kickside.inbox.api:list_inbox.endpoint
    - kickside.inbox.api:list_item_types.endpoint
    - kickside.inbox.api:resolve_item.endpoint
    actions: access
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.inbox:*
    - kickside.inbox.api:*
    - kickside.inbox.events:*
    - kickside.inbox.persist:*
    - kickside.inbox.security:*
    - kickside.inbox.sink:*
    - kickside.inbox.traits:*
    actions:
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application group with member access to this module.
  targets:
  - entry: kickside.inbox.security:module_access
    path: .groups +=
  - entry: kickside.inbox.security:module_runtime
    path: .groups +=
  - entry: kickside.inbox.security:inbox_endpoint_access
    path: .groups +=
