version: '1.0'
namespace: app
entries:
  - name: addressed_http_context
    kind: library.lua
    source: file://addressed_http_context.lua

  - name: create_addressed_subject
    kind: library.lua
    source: file://create_http_subject.lua
    modules: [json, security]
    imports:
      http: app:addressed_http_context
      inbox_writer: kickside.inbox.persist:inbox_writer
      inbox_types: kickside.inbox:inbox_types

  - name: delete_addressed_subject
    kind: library.lua
    source: file://delete_http_subject.lua
    modules: [security]
    imports:
      http: app:addressed_http_context
      inbox_writer: kickside.inbox.persist:inbox_writer
      http_errors: kickside.contract:http_errors

  - name: addressed_team
    kind: security.scope
    meta: { title: Inbox review team }

  - name: retention_team
    kind: security.scope
    meta: { title: Isolated Inbox retention test team }

  - name: addressed_team_policy
    kind: security.policy
    groups: [app:addressed_team, app:retention_team]
    policy: { actions: registry.get, resources: app:addressed_type, effect: allow }

  - name: addressed_probe
    kind: function.lua
    source: file://addressed_probe.lua
    method: run
    modules: [json, contract, security, funcs]
    security:
      policies: [kickside.inbox.security:sink_output_publish, kickside.inbox.security:resolve_output_publish, kickside.inbox.security:delete_output_publish]
    imports:
      inbox_writer: kickside.inbox.persist:inbox_writer
      inbox_resolve: kickside.inbox:inbox_resolve
      create_handler: app:create_addressed_subject
      delete_handler: app:delete_addressed_subject
      list_handler: kickside.inbox.api:list_inbox_lib
      http_context: app:addressed_http_context
      addressed: kickside.inbox.persist:addressed
      component: kickside.component:component

  - name: addressed_type
    kind: registry.entry
    meta:
      type: inbox.item_type
      value: addressed_review
      actions: [dismiss]
      send_permission: app.inbox.send

  - name: other_addressed_type
    kind: registry.entry
    meta:
      type: inbox.item_type
      value: other_addressed_review
      actions: [dismiss]
      send_permission: app.inbox.send

  - name: addressed_app_db
    kind: security.policy
    policy: { resources: "app:db", actions: db.get, effect: allow }

  - name: addressed_runtime
    kind: security.policy
    policy:
      resources: '*'
      actions: '*'
      effect: allow
      conditions:
        - { field: action, operator: ne, value: app.inbox.send }
        - { field: action, operator: ne, value: threads.output.publish }

  - name: addressed_send
    kind: security.policy
    policy:
      resources: [app:addressed_type, app:other_addressed_type, app:callback_addressed_type, app:terminal_addressed_type]
      actions: app.inbox.send
      effect: allow

  - name: addressed_test
    kind: function.lua
    source: file://addressed_test.lua
    method: run
    meta: { type: test, suite: kickside_inbox }
    modules: [funcs, contract, security, uuid, json, sql, time, channel]
    imports:
      test: wippy.test:test
      test_identity: app:test_identity
      component: kickside.component:component
      user_groups: kickside.users.persist:user_groups_repo
      addressed: kickside.inbox.persist:addressed
      jobs: kickside.core.jobs:jobs
      retention_prune: kickside.core.retention:prune

  - name: addressed_other_send
    kind: security.policy
    policy: { resources: app:other_addressed_type, actions: app.inbox.send, effect: allow }

  - name: addressed_groups_fail
    kind: security.policy
    policy: { resources: groups, actions: contract.call, effect: deny }

  - name: callback_addressed_type
    kind: registry.entry
    meta:
      type: inbox.item_type
      value: callback_addressed_review
      actions: [dismiss]
      send_permission: app.inbox.send
      on_validate: app:addressed_callback
      on_resolve: app:addressed_callback

  - name: addressed_callback
    kind: function.lua
    source: file://addressed_callback.lua
    method: run
    modules: [security]

  - name: upgrade_signal
    kind: function.lua
    source: file://upgrade_signal.lua
    method: create
    modules: [uuid]
    imports:
      client: userspace.dataflow:client
      consts: userspace.dataflow:consts

  - name: addressed_realtime
    kind: function.lua
    source: file://addressed_realtime.lua
    method: notify
    modules: [sql, json, security]

  - name: addressed_realtime_binding
    kind: contract.binding
    contracts:
      - contract: kickside.contract:realtime
        default: true
        methods: { notify: 'app:addressed_realtime', broadcast: 'app:addressed_realtime' }

  - name: notification_team
    kind: security.scope
  - name: notification_page_team
    kind: security.scope

  - name: notification_test
    kind: function.lua
    source: file://notification_test.lua
    method: run
    meta: { type: test, suite: kickside_inbox }
    imports:
      test: wippy.test:test
      notifier: kickside.inbox.persist:addressed_notifier

  - name: notification_team_policy
    kind: security.policy
    groups: [app:notification_team]
    policy: { actions: registry.get, resources: app:addressed_type, effect: allow }

  - name: notification_window_team
    kind: security.scope
  - name: notification_window_policy
    kind: security.policy
    groups: [app:notification_window_team]
    policy: { actions: registry.get, resources: app:addressed_type, effect: allow }

  - name: addressed_race_probe
    kind: function.lua
    source: file://addressed_race_probe.lua
    method: run
    modules: [channel]
    imports:
      addressed: kickside.inbox.persist:addressed

  - name: delete_team
    kind: security.scope
  - name: cleanup_team
    kind: security.scope
  - name: delete_team_policy
    kind: security.policy
    groups: [app:delete_team]
    policy: { actions: registry.get, resources: app:addressed_type, effect: allow }
  - name: cleanup_team_policy
    kind: security.policy
    groups: [app:cleanup_team]
    policy: { actions: registry.get, resources: app:addressed_type, effect: allow }

  - name: addressed_no_assignment
    kind: security.policy
    policy: { resources: 'kickside.inbox:item_type.flow_decision', actions: inbox.assign, effect: deny }

  - name: terminal_addressed_type
    kind: registry.entry
    meta:
      type: inbox.item_type
      value: terminal_addressed_review
      actions: [dismiss, approve]
      send_permission: app.inbox.send
      on_resolve: app:terminal_callback

  - name: terminal_callback
    kind: function.lua
    source: file://terminal_callback.lua
    method: run
    modules: [funcs, security, sql, time]
    security:
      policies: [kickside.inbox.security:sink_output_publish]
    imports:
      inbox_writer: kickside.inbox.persist:inbox_writer

  - name: addressed_fold_probe_access
    kind: security.policy
    groups: [app:user]
    policy: { resources: 'app:addressed_probe', actions: [funcs.call, registry.get], effect: allow }

  - name: addressed_boundary_test
    kind: function.lua
    source: file://addressed_boundary_test.lua
    method: run
    meta: { type: test, suite: kickside_inbox }
    modules: [funcs, security, uuid]
    imports:
      test: wippy.test:test
      test_identity: app:test_identity

  - name: notification_authority_test
    kind: function.lua
    source: file://addressed_boundary_test.lua
    method: notifications
    meta: { type: test, suite: kickside_inbox }
    modules: [funcs, security, uuid]
    imports:
      test: wippy.test:test
      test_identity: app:test_identity

  - name: addressed_member_probe
    kind: security.policy
    policy:
      resources: [app:inbox_read_probe, app:addressed_probe]
      actions: [funcs.call, funcs.security]
      effect: allow

  - name: addressed_contract_context
    kind: security.policy
    policy:
      resources: '*'
      actions: [contract.security, contract.call]
      effect: allow

  - name: addressed_notification_target_test
    kind: function.lua
    source: file://addressed_test.lua
    method: target
    meta: { type: test, suite: kickside_inbox }
    modules: [funcs, contract, security, uuid, json, sql, time, channel]
    imports:
      test: wippy.test:test
      test_identity: app:test_identity
      component: kickside.component:component
      user_groups: kickside.users.persist:user_groups_repo
      addressed: kickside.inbox.persist:addressed
      jobs: kickside.core.jobs:jobs
      retention_prune: kickside.core.retention:prune
