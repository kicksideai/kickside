version: '1.0'
namespace: app
entries:
  - name: content_admission_test
    kind: function.lua
    meta: { type: test, suite: knowledge_admission }
    source: file://content_admission_test.lua
    method: run
    security:
      actor: { id: "system:knowledge-tests" }
    modules: [sql, uuid, json, funcs, security, contract, http_client, registry]
    imports:
      test: wippy.test:test
      session: kickside.users:session
      groups: kickside.users.persist:user_groups_repo
      component: kickside.component:component
      fixture_cleanup: app:fixture_cleanup
      provision: kickside.core.threads:provision
      upload_types: kickside.uploads:types
      uploads: kickside.uploads:uploads
      upload_records: kickside.uploads.persist:upload_record_repo
      artifacts: kickside.uploads.persist:artifact_content_repo
  - name: admission_get_content
    kind: function.lua
    source: file://admission_provider.lua
    method: get_content
  - name: admission_content_provider
    kind: contract.binding
    contracts:
      - contract: kickside.contract:content_provider
        default: true
        methods:
          get_content: app:admission_get_content
          get_info: app:admission_get_content
  - name: admission_structured_output
    kind: function.lua
    source: file://admission_provider.lua
    method: structured_output
  - name: admission_driver
    kind: contract.binding
    contracts:
      - contract: wippy.llm:structured_output
        methods:
          structured_output: app:admission_structured_output
  - name: admission_provider
    kind: registry.entry
    meta: { type: llm.provider, name: admission-test, title: Admission test }
    driver: { id: app:admission_driver }
  - name: admission-fast
    kind: registry.entry
    meta: { type: llm.model, name: admission-fast, title: Admission fast, capabilities: [structured_output, generate], class: [fast], priority: 100 }
    max_tokens: 100000
    output_tokens: 32768
    providers: [{ id: app:admission_provider, provider_model: admission-fast }]
  - name: admission-embed
    kind: registry.entry
    meta: { type: llm.model, name: admission-embed, title: Admission embed, capabilities: [embed], class: [embed], priority: 100 }
    dimensions: 512
    providers: [{ id: app:admission_provider, provider_model: admission-embed }]

  - name: admission_refuse
    kind: function.lua
    source: file://admission_provider.lua
    method: refuse
  - name: admission_refusing_engine
    kind: contract.binding
    contracts:
      - contract: kickside.contract:embeddable
        context_required: [component_id]
        methods:
          embed_content: app:admission_refuse
          embed_reference: kickside.knowledge.binding:embed_reference_func
