    imports:
      util: kickside.knowledge:util
  - name: composer_knowledge_bases_catalog_rows
    kind: function.lua
    meta:
      comment: Composer catalog projection rows for accessible knowledge bases.
    source: file://composer_catalog.lua
    method: knowledge_bases
    modules: [contract, security]

    imports:
      util: kickside.knowledge:util
  - name: composer_knowledge_bases_catalog
    kind: registry.entry
    meta:
      type: kickside.composer.catalog
      catalog: knowledge_bases
      title: Knowledge bases
      comment: Knowledge base instances the composer can pin into trait_contexts.
      projection_ref: kickside.knowledge.registry:composer_knowledge_bases_catalog_rows
      row_schema:
        type: object
        required: [id, title, description]
        properties:
          id: { type: string }
          title: { type: string }
          description: { type: string }

  # ─── binding ─────────────────────────────────────────────────────────
  - name: knowledge_bases_registry
    kind: contract.binding
    meta:
      title: Knowledge Bases Registry
      comment: Canonical orchestrator for kickside.knowledge:knowledge_bases
      tags: [knowledge_bases, registry, canonical]
    contracts:
      - contract: kickside.knowledge:knowledge_bases
        default: true
        methods:
          create: kickside.knowledge.registry:kb_create
          find: kickside.knowledge.registry:kb_find
          upsert: kickside.knowledge.registry:kb_upsert
          update: kickside.knowledge.registry:kb_update
          delete: kickside.knowledge.registry:kb_delete
          list: kickside.knowledge.registry:kb_list
