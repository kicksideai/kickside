version: "1.0"
namespace: app

entries:
  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    file: "${sqlite_path}"

  - name: env_storage
    kind: env.storage.file
    file_path: ./.wippy/test.env
    auto_create: true

  - name: uploads
    kind: fs.directory
    directory: ./storage
    auto_init: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server for the hub static mount.
    # An ephemeral port: harnesses of concurrent suite runs never collide on a
    # fixed port, whose failed bind would stall this runtime's service starts.
    addr: :0
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      comment: Test API router.
      server: gateway
    prefix: /api

  - name: api_public
    kind: http.router
    meta:
      comment: Test public API router used by transitive view/session services.
      server: gateway
    prefix: /api/public

  - name: user
    kind: security.policy
    groups: [hub_test_user]
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: admin
    kind: security.policy
    groups: [hub_test_admin]
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: dep.kickside.hub
    kind: ns.dependency
    component: kickside/hub
    version: '*'
    parameters:
    - name: kickside.hub:api_router
      value: app:api
    - name: kickside.hub:ui_server
      value: app:gateway
    - name: keeper:api_router
      value: app:api
    - name: keeper:app_db
      value: app:db
    - name: keeper:admin_scope
      value: app:admin
    - name: keeper:env_storage
      value: app:env_storage
    - name: keeper:public_gateway
      value: app:gateway
    - name: keeper:ui_server
      value: app:gateway
    - name: keeper:process_host
      value: app:processes
    - name: userspace.dataflow:target_db
      value: app:db
    - name: wippy.bootloader:application_host
      value: app:processes
    - name: wippy.bootloader:env_storage
      value: app:env_storage
    - name: wippy.llm:process_host
      value: app:processes
    - name: wippy.llm:env_storage
      value: app:env_storage
    - name: wippy.migration:app_db
      value: app:db
    - name: wippy.session:api_router
      value: app:api
    - name: wippy.session:database_resource
      value: app:db
    - name: wippy.session:default_host
      value: app:processes
    - name: wippy.session:delegation_func_id
      value: userspace.dataflow.session:delegate
    - name: wippy.session:env_storage
      value: app:env_storage
    - name: wippy.views:api_router
      value: app:api_public
    - name: wippy.views:env_storage
      value: app:env_storage
    - name: kickside.agents:api_router
      value: app:api
    - name: kickside.agents:ui_server
      value: app:gateway
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl
    - name: kickside.automation:target_db
      value: app:db
    - name: kickside.automation:api_router
      value: app:api
    - name: kickside.automation:ui_server
      value: app:gateway
    - name: kickside.workflows:target_db
      value: app:db
    - name: kickside.workflows:api_router
      value: app:api
    - name: kickside.workflows:ui_server
      value: app:gateway
    - name: kickside.transform:api_router
      value: app:api
    - name: kickside.transform:ui_server
      value: app:gateway
    - name: kickside.transform:env_storage
      value: app:env_storage
    - name: kickside.transform.security:user_security_scope
      value: app:user
    - name: kickside.models:target_db
      value: app:db
    - name: kickside.models:api_router
      value: app:api
    - name: kickside.models:ui_server
      value: app:gateway
    - name: kickside.models:process_host
      value: app:processes
    - name: kickside.memory:ui_server
      value: app:gateway
    - name: kickside.users:env_storage
      value: app:env_storage
    - name: kickside.users:public_router
      value: app:api_public
    - name: kickside.users:api_router
      value: app:api
    - name: kickside.users:ui_server
      value: app:gateway
    - name: kickside.users:target_db
      value: app:db
    - name: kickside.users:user_security_scope
      value: app:user
    - name: kickside.users:admin_security_scope
      value: app:user
    - name: kickside.users:login_role_resource
      value: app:*
    - name: kickside.settings:target_db
      value: app:db
    - name: kickside.settings:api_router
      value: app:api
    - name: kickside.settings:ui_server
      value: app:gateway
    - name: kickside.uploads:database_resource
      value: app:db
    - name: kickside.uploads:storage_id
      value: app:uploads
    - name: kickside.uploads:env_storage
      value: app:env_storage
    - name: kickside.uploads:api_router
      value: app:api
    - name: kickside.uploads:ui_server
      value: app:gateway
    - name: kickside.uploads.security:user_security_scope
      value: app:user
    - name: kickside.connection:api_router
      value: app:api
    - name: kickside.connection:ui_server
      value: app:gateway
    - name: wippy.relay:user_security_scope
      value: app:user
    - name: wippy.relay:env_storage
      value: app:env_storage
    - name: wippy.relay:application_host
      value: app:processes
    - name: userspace.dataflow:process_host
      value: app:processes
    - name: userspace.dataflow:api_router
      value: app:api
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        access_mask: 2
        subject_id: app:user
        subject_type: group
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        access_mask: 3
        subject_id: app:user
        subject_type: group
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.projections:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:env_storage
      value: app:env_storage
    - name: kickside.core.projections:env_storage
      value: app:env_storage
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.jobs:process_host
      value: app:processes
    - name: kickside.core.jobs:api_router
      value: app:api
    - name: kickside.core.scheduler:env_storage
      value: app:env_storage
    - name: kickside.core.scheduler:process_host
      value: app:processes
    - name: kickside.blocks:process_host
      value: app:processes
    - name: kickside.code_execution:api_router
      value: app:api
    - name: kickside.workflows:process_host
      value: app:processes
    - name: kickside.workflows.security:user_security_scope
      value: app:user
    - name: kickside.hub.instruments:admin_security_scope
      value: app:admin

  - name: onboarding_profile.fixture
    kind: registry.entry
    meta:
      type: kickside.hub:onboarding_profile
    profile: fixture
    title: Consumer fixture
    description: Test-only application composition profile.
    icon: tabler:package
    order: 10
    packages:
      - component: example/workspace

  - name: hub_smoke_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_hub
      comment: Checks the hub UI tab and the keeper hub token-provider port used by the harness.
    source: file://hub_smoke_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
    method: run

  - name: dep.kickside.users
    kind: ns.dependency
    component: kickside/users
    version: '*'

  - name: dep.kickside.security
    kind: ns.dependency
    component: kickside/security
    version: '*'
    parameters:
    - {name: api_router, value: app:api}
    - {name: ui_server, value: app:gateway}
    - {name: target_db, value: app:db}
    - {name: process_host, value: app:processes}

  - name: required_setup_test
    kind: function.lua
    meta: {type: test, suite: kickside_hub}
    source: file://required_setup_test.lua
    method: run
    imports:
      test: wippy.test:test
      setup: kickside.hub.api:required_setup_runtime
