version: '1.0'
registry:
  dispatch_internal_kinds:
    - registry.entry
    - ns.requirement
    - ns.dependency
    - ns.definition
    - security.scope
vars:
  instance_data_dir: ./.wippy/instance
  sqlite_path: ':memory:'
  http_port: 19120
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_root_install_test
  pg_username: kickside
  pg_password: kickside
override:
  wippy.terminal:host:lifecycle.depends_on: [app:gateway]
  app:db:kind: db.sql.sqlite
  app:db:file: ${sqlite_path}
  app:gateway:addr: :${http_port}
  app:data_dir:directory: ${instance_data_dir}
  app:uploads:directory: ${instance_data_dir}/uploads
  app:tmp:directory: ${instance_data_dir}/tmp
  app:branding_fs:directory: ./branding
  app:app_fs:directory: ../../static
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
