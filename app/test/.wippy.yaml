version: '1.0'
override:
  "app:db:file": "${sqlite_path}"
registry:
  dispatch_internal_kinds: [registry.entry, ns.requirement, ns.dependency, ns.definition, security.scope]
workspace:
  replacements:
    kickside/oauth: ../../platform/oauth
    kickside/mcp-client: ../../../providers/mcp-client
    kickside/realtime-dispatch: ../../core/realtime-dispatch
    kickside/app-security-test: .
    kickside/contract: ../../core/contract
    kickside/component: ../../core/component
    kickside/core: ../../core/core
    kickside/jobs: ../../core/jobs
    kickside/execution: ../../core/execution
    kickside/sessions: ../../platform/sessions
    kickside/users: ../../platform/users
    kickside/security: ../../platform/security
    kickside/settings: ../../platform/settings
    kickside/renderers: ../../platform/renderers
    kickside/connection: ../../platform/connection
vars:
  sqlite_path: ':memory:'
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_app
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
