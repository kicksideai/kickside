version: "1.0"
namespace: app.ui

# Declarative navigation surfaces. Each ui.nav_item registry entry maps a route
# in the SPA to a nav entry. kickside/ui discovers these, merges admin system
# controls (layout/overrides/categories/custom items), and serves /nav/list;
# nothing about the surface set is hardcoded in the frontend bundle.
entries:
  # Tabbed System page (users, modules, appearance, settings) in src/pages/system.vue;
  # shown to callers that may list System tabs.
  - name: system
    kind: registry.entry
    meta:
      type: ui.nav_item
      section: ""
      path: /system
      route_name: system
      title: System
      comment: Users, modules, appearance, and configuration.
      icon: tabler:settings
      order: 100
    access: kickside.ui.api:list_settings_tabs.endpoint
