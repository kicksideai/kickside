version: "1.0"
namespace: app
entries:
  - name: data_dir
    kind: fs.directory
    directory: ./.wippy/
    auto_init: true
    mode: "0700"

  - name: db
    kind: db.sql.sqlite
    file: ./.wippy/app.db
    foreign_keys: true
    # Ordering guard for the postgres profiles: those override app:db to db.sql.postgres and read
    # host/port/database/username/password from KICKSIDE_PG_* via *_env directives. Since wippy
    # 0.3.21a a *_env whose variable is not yet resolvable at load time is no longer retried — it is
    # left empty and the config fails validation ("host is required"). Depending on the env.variable
    # entries makes app:db load after them, so the values resolve deterministically instead of racing
    # the registry. Inert under the sqlite/local profiles (these entries always exist).
    meta:
      depends_on:
        - app.env:pg_host
        - app.env:pg_port
        - app.env:pg_database
        - app.env:pg_username
        - app.env:pg_password
    lifecycle:
      auto_start: true

  - name: cache
    kind: store.memory
    cleanup_interval: 5m
    lifecycle:
      auto_start: true
    max_size: 5000

  - name: uploads
    kind: fs.directory
    directory: ./.wippy/uploads/
    auto_init: true
    mode: "0700"

  - name: branding_fs
    kind: fs.directory
    directory: ./.wippy/branding/
    auto_init: true
    mode: "0700"

  - name: tmp
    kind: fs.directory
    directory: ./.wippy/tmp/
    auto_init: true
    mode: "0700"

  - name: app_fs
    kind: fs.directory
    directory: ./static
    auto_init: true
