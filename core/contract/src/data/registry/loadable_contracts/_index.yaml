version: "1.0"
namespace: kickside.data

entries:
  # ─── Bulk load: many batches, one transaction ─────────────────────────
  # Sibling of writable, not a replacement for it. writable is the per-record
  # ABI: one sink_op, one idempotency_key, one dest_ref in the engine id-map,
  # per record. It can model an atomic multi-record write as a provider-atomic
  # sink_op with a composite input, so a slice replacement that fits one call
  # is expressible. What it cannot express is a load that arrives in many calls:
  # a staging identity that outlives one write, idempotent re-delivery of a
  # batch, a commit that replaces a scope only after every batch has landed, and
  # an abort that leaves nothing behind.
  #
  # loadable is that missing shape. A load is a short-lived transaction identity
  # over one or more targets: begin it, stream batches into it, then commit or
  # discard. The staging area belongs to the receiver, which is the only
  # arrangement that keeps the replacement atomic -- the whole transaction stays
  # on one side of the boundary.
  #
  # The twelve rules below are normative and are what the method schemas cannot
  # state. A receiver that implements the eight methods but not the rules will
  # look correct and lose data under concurrency, so they belong in a
  # conformance suite next to the pullable one.
  #
  #   1. commit is one transaction for the whole load, every target of it.
  #   2. expect is rechecked inside that transaction; a mismatch is conflict
  #      having mutated nothing.
  #   3. Rows are ordered by (batch_index, position), deterministically on
  #      either SQL engine.
  #   4. begin is idempotent on run_id: an open load is returned again, a
  #      committed one (within rule 6's window) answers conflict/already_committed
  #      with the commit result, a discarded or reclaimed one opens a new load.
  #   5. commit is idempotent on load_id: a repeat returns the same per-target
  #      results and applies once.
  #   6. A load with no activity for limits.abandon_after_ms is reclaimed; a
  #      committed load stays answerable for at least as long after its commit.
  #   7. A dry run never calls begin; describe and describe_scope are reads.
  #   8. append is idempotent on (load_id, target, batch_index).
  #   9. With replace_scope.period_in, every staged row's period must be present
  #      and in the list.
  #  10. A non-empty key is enforced at commit: duplicates are conflict, no
  #      upsert.
  #  11. columns_version from describe is echoed in begin and rechecked in commit.
  #  12. A target set the receiver cannot commit together is refused at begin.
  #
  # target is a namespace:id string the receiver resolves; what is behind it is
  # the receiver binding's business, and describe(target) is how a caller learns
  # the columns and key behind it. Nothing here says a target is a registry
  # entry: the same syntax is a logical address the receiver resolves from a
  # table of its own, and list is how a caller learns what exists without either
  # side knowing how the other stores it.
  #
  # Creating a target is deliberately not part of this contract. loadable only
  # loads; creation is schema evolution with its own semantics and would force
  # every receiver to implement DDL before it could accept a single row. That
  # half is kickside.data:definable, and a receiver that binds it answers
  # describe.supports.can_define = true.
  #
  # Reading rows back is not part of it either. list, describe and
  # describe_scope are the reads the load protocol itself needs -- what
  # targets exist, how a row must be shaped, who owns the slice a commit is
  # about to replace -- and none of them answers a row value: describe_scope
  # reports run ids, counts and the source each load's begin supplied, nothing
  # a row holds. Reading rows -- a sample, a profile of a slice, which keys
  # already exist -- is kickside.data:readable, a right a host grants through
  # its own binding, and a receiver that binds it answers
  # describe.supports.can_read = true.
  #
  # DataError is inlined into every output schema's $defs, as the sibling
  # contracts do: there is no cross-schema $ref in this file.
  - name: loadable
    kind: contract.definition
    meta:
      title: Loadable Data Sink
      tags: [data, sink, load, bulk, transaction, slice]
      comment: Bulk load ABI. Batches staged into one load over one or more targets and committed as one transaction, optionally replacing a scope. Receiver owns staging.
    methods:
      - name: list
        description: |
          Existing targets a caller may load into, for a picker or an agent choosing where a recipe
          output goes. A target must exist before a load; this is the only discovery the contract
          offers. query is an optional substring filter on id and title.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "query": { "type": "string", "description": "Optional substring filter on id and title." }
                }
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "targets": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["id", "title"],
                      "properties": {
                        "id": { "type": "string", "pattern": "^[^\\s:]+:[^\\s:]+$" },
                        "title": { "type": "string", "minLength": 1 },
                        "description": { "type": "string" }
                      }
                    }
                  },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["targets"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": { "required": ["error"], "properties": { "targets": false } }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean" },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object" }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: describe
        description: |
          What this target is and what the receiver can do with it. A caller sizes its batches and
          chooses a replacement mode from this answer rather than from a constant of its own.

          A column carries a storage type and, optionally, a role and a format. The type is what a
          caller coerces a value to; the role is what the column is for; the format is a hint a caller
          MAY use and MUST NOT depend on. At most one column may carry role=period, and it is the axis
          replace_scope.period_in replaces by. Stating the axis on the column rather than beside the
          array keeps one fact in one place: a separate period_column field could name a column the
          array does not contain, or one whose type contradicts it. A column whose type the receiver
          cannot express in the enum MUST be omitted; when that column is also required, describe MUST
          fail with invalid_request/unsupported_column instead of describing a target nobody can load.

          columns_version changes whenever columns change; begin echoes it and commit rechecks it.
          key names the columns that identify one row; when non-empty, commit refuses duplicates
          (conflict/duplicate_key). supports.expect = false means the receiver keeps no ownership
          record: describe_scope answers owners=[] with no target_version and commit refuses any
          expect. supports.multi_target = false means begin accepts exactly one target.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "target": {
                    "type": "string",
                    "pattern": "^[^\\s:]+:[^\\s:]+$",
                    "description": "namespace:id the receiver resolves to one loadable relation."
                  }
                },
                "required": ["target"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "columns": {
                    "type": "array",
                    "description": "Columns this target accepts, in declaration order.",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["name", "type", "nullable"],
                      "properties": {
                        "name": { "type": "string", "minLength": 1 },
                        "type": {
                          "type": "string",
                          "enum": ["string", "number", "integer", "boolean", "date"],
                          "description": "Storage type. This is what a caller coerces a value to, and nothing else."
                        },
                        "format": {
                          "type": "string",
                          "description": "Receiver-specific hint such as email or uuid. A caller MAY use it and MUST NOT depend on it."
                        },
                        "role": {
                          "type": "string",
                          "enum": ["period"],
                          "description": "What this column is for, as distinct from what it holds. A period column is the axis replace_scope.period_in replaces by; at most one column may carry it. A period value is not always a date -- 2025-08, 2025-Q1 -- which is why the role does not replace the storage type."
                        },
                        "nullable": { "type": "boolean" }
                      }
                    }
                  },
                  "key": {
                    "type": "array",
                    "description": "Columns naming one row's identity. Empty when the target has no row identity. Enforced at commit when non-empty.",
                    "items": { "type": "string", "minLength": 1 }
                  },
                  "columns_version": {
                    "type": "string", "minLength": 1,
                    "description": "Opaque; changes whenever columns change. Echoed in begin, rechecked in commit."
                  },
                  "limits": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["max_batch_rows", "abandon_after_ms"],
                    "properties": {
                      "max_batch_rows": {
                        "type": "integer", "minimum": 1,
                        "description": "Largest rows array append accepts. The bound belongs to whoever owns the statement."
                      },
                      "max_replace_scopes": {
                        "type": "integer", "minimum": 1,
                        "description": "Upper bound on replace_scope.period_in and describe_scope.period_in cardinality."
                      },
                      "abandon_after_ms": {
                        "type": "integer", "minimum": 1,
                        "description": "A load with no begin, append or commit for this long is reclaimed; a committed load stays answerable for at least this long after its commit."
                      }
                    }
                  },
                  "supports": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["replace_scope", "expect", "allow_shrink", "multi_target"],
                    "properties": {
                      "replace_scope": { "type": "boolean" },
                      "expect": { "type": "boolean" },
                      "allow_shrink": { "type": "boolean" },
                      "multi_target": { "type": "boolean" },
                      "can_define": {
                        "type": "boolean",
                        "description": "True when this receiver also binds kickside.data:definable, so a caller holding a file nobody has a target for can create one instead of stopping."
                      },
                      "rehearse": {
                        "type": "boolean",
                        "description": "True when rehearse runs a load to the end and rolls it back, and begin accepts define for a target it would create or alter."
                      },
                      "can_read": {
                        "type": "boolean",
                        "description": "True when this receiver also binds kickside.data:readable, so a caller can read back what it loaded -- sample a target, profile a slice, find which keys exist -- by the same target ids."
                      }
                    }
                  },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": {
                      "required": ["columns", "key", "columns_version", "limits", "supports"],
                      "properties": { "error": false }
                    }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": {
                      "required": ["error"],
                      "properties": { "columns": false, "key": false, "columns_version": false, "limits": false, "supports": false }
                    }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean" },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object" }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: describe_scope
        description: |
          Who owns the rows a commit is about to replace. This is the read expect is built from: a
          caller looks, decides, then asserts in commit that what it saw is still true.

          With period_in, owners carries one entry per (period, owning run); a period with no rows
          appears once with run_id=null. Without period_in the scope is the whole target and entries
          carry no period; an empty target answers [{run_id: null, rows: 0}]. source is returned
          exactly as the owning load's begin supplied it. target_version is the value to carry into
          expect. A receiver with supports.expect=false answers owners=[] and no target_version, but
          MUST still answer rows.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "target": { "type": "string", "pattern": "^[^\\s:]+:[^\\s:]+$" },
                  "period_in": {
                    "type": "array", "minItems": 1,
                    "items": { "type": "string", "minLength": 1 },
                    "description": "Periods to report on, in the lexical form append accepts for the period column. Bounded by limits.max_replace_scopes. Omit for the whole target."
                  }
                },
                "required": ["target"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "target_version": {
                    "type": "string", "minLength": 1,
                    "description": "Opaque; changes on every commit that mutates the target. Absent when supports.expect is false."
                  },
                  "rows": { "type": "integer", "minimum": 0, "description": "Rows currently in the requested scope." },
                  "owners": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["run_id", "rows"],
                      "properties": {
                        "period": { "type": "string", "description": "Present only when the request carried period_in." },
                        "run_id": { "type": ["string", "null"], "description": "Owning run, or null when the period (or target) holds no rows." },
                        "source": { "type": "object", "description": "The owning load's run.source, verbatim." },
                        "rows": { "type": "integer", "minimum": 0 }
                      }
                    }
                  },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["rows", "owners"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": {
                      "required": ["error"],
                      "properties": { "target_version": false, "rows": false, "owners": false }
                    }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean" },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object" }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: begin
        description: |
          Open a load against one or more targets. run_id is the caller's own run identity: it is the
          lineage the receiver stamps onto every accepted row, and it is the idempotency key of the
          load itself. A second begin for a run whose load is still open MUST return that same
          load_id, or invalid_request/run_targets_differ if the target set is not the same. A begin
          for a run whose load was committed within limits.abandon_after_ms MUST return
          conflict/already_committed with the commit output in error.details.result, so a retry
          after a lost acknowledgement learns the outcome instead of loading twice. A begin for a run
          whose load was discarded or reclaimed opens a new load.

          source is opaque provenance the receiver stores with the load and returns from
          describe_scope; the caller decides what identifies a source. Each target echoes the
          columns_version its caller took from describe; a stale one is conflict/schema_changed.

          Every target of one load commits in one transaction. A receiver that cannot do that for the
          requested set MUST refuse here with invalid_request/targets_not_co_located, never split the
          commit later.

          A target may carry define: the request kickside.data:definable.define takes, for a target
          that does not exist yet or one the definition would alter. The load then stages and checks
          rows as that definition would shape the target, and it can only be rehearsed: commit MUST
          refuse it with invalid_request/rehearsal_only. A receiver that cannot rehearse refuses define
          here with invalid_request/rehearsal_unsupported.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "run": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["run_id"],
                    "properties": {
                      "run_id": { "type": "string", "minLength": 1 },
                      "source": {
                        "type": "object",
                        "description": "Opaque provenance stored with the load and returned by describe_scope."
                      }
                    }
                  },
                  "targets": {
                    "type": "array", "minItems": 1,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["target"],
                      "properties": {
                        "target": { "type": "string", "pattern": "^[^\\s:]+:[^\\s:]+$" },
                        "columns_version": {
                          "type": "string", "minLength": 1,
                          "description": "From describe. Refused with conflict/schema_changed when it has moved."
                        },
                        "define": {
                          "type": "object",
                          "description": "The kickside.data:definable.define request this target is loaded as if applied. Only a rehearsal may carry one."
                        }
                      }
                    }
                  }
                },
                "required": ["run", "targets"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "load_id": { "type": "string", "minLength": 1 },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["load_id"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": { "required": ["error"], "properties": { "load_id": false } }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean" },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object" }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: append
        description: |
          Stage one batch for one target of the load. Rows are plain objects keyed by column name with
          JSON scalar values; a column a row omits or carries as null is absent and stored as NULL. A
          key that is not a declared column is invalid_request/unknown_column; a value the column's
          type cannot hold is invalid_request/type_mismatch. More than limits.max_batch_rows rows MUST
          be refused with invalid_request/batch_too_large rather than split silently, so the caller's
          batching stays honest. An empty batch is accepted and counts toward contiguity.

          batch_index starts at 1 and is the caller's sequence within (load, target). append is
          idempotent on (load_id, target, batch_index): a repeated index MUST be acknowledged and MUST
          NOT be staged again; the receiver MAY compare the row count and refuse a difference with
          conflict/batch_mismatch. Rows are ordered by (batch_index, position) at commit.

          Appending to a committed or discarded load is invalid_request/load_closed; to an unknown
          load, or to a target the load was not opened for, not_found.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "load_id": { "type": "string", "minLength": 1 },
                  "target": { "type": "string", "pattern": "^[^\\s:]+:[^\\s:]+$" },
                  "batch_index": { "type": "integer", "minimum": 1 },
                  "rows": { "type": "array", "items": { "type": "object" } }
                },
                "required": ["load_id", "target", "batch_index", "rows"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "staged": { "type": "integer", "minimum": 0, "description": "Rows accepted in this batch; on a repeated batch_index, the count already held." },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["staged"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": { "required": ["error"], "properties": { "staged": false } }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
