          would shape it -- created, or altered from what exists -- before any rule runs, so a
          rehearsal answers for a target that does not exist yet exactly as its first commit would. A
          receiver that cannot rehearse answers invalid_request/unsupported_option, option rehearse,
          and describes its targets with supports.rehearse = false. data_version in the answer is the
          one the rehearsal saw: nothing moved, so there is nothing to carry into a later expect.
