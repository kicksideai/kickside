      - name: discard
        description: |
          Drop a load's staged rows, every target of it. Idempotent, and discarding an unknown load is
          success: the postcondition the caller wants is already true. Discarding a committed load is
          also success and changes nothing: those rows are data now, not staging. A load that is
          neither committed nor discarded is reclaimed by the receiver after limits.abandon_after_ms
          of inactivity.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": { "load_id": { "type": "string", "minLength": 1 } },
                "required": ["load_id"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
