      - name: commit
        description: |
          Apply the load as one transaction across every target it was opened for. A target with no
          plan entry is committed in append mode. The effect matrix is normative, per target:
          replace_scope omitted MUST insert and delete nothing and return result=appended;
          replace_scope.period_in MUST delete exactly those periods and then insert, returning
          result=replaced; replace_scope.all MUST delete the whole target and then insert, returning
          result=replaced; a target that staged no rows MUST return result=noop, MUST NOT delete
          anything and skips its expect, so an import that produced nothing cannot erase what it was
          meant to restate.

          With period_in, every staged row of that target MUST carry a period value in the list:
          a null or blank one is invalid_request/period_missing, one outside the list is
          invalid_request/period_not_in_scope. period_in on a target with no role=period column is
          invalid_request/period_unsupported. Values are compared after the same coercion append
          applies to the column.

          expect is the caller's assertion, rechecked inside the transaction: target_version asserts
          nothing was committed since the caller looked (conflict/version_changed); owners asserts,
          for each period it lists, that the current owner set equals run_ids exactly, an empty array
          meaning nobody (conflict/owner_changed); an entry without period asserts the whole target.
          Both may be given and both must hold. Without expect a competing commit simply wins; the
          receiver promises nothing about interleaving.

          When replace_scope.all would drop the target below the receiver's shrink floor, the call
          MUST be refused with conflict/shrink unless allow_shrink is true. Only the receiver can
          count what is already there. A non-empty describe.key is enforced here: duplicates among the
          staged rows or against surviving rows are conflict/duplicate_key. columns_version from begin
          is rechecked: conflict/schema_changed. batches, when given, is the number of appends the
          caller made for that target; the receiver MUST verify it holds exactly indexes 1..batches
          and refuse a gap with invalid_request/batches_incomplete.

          Every refusal mutates nothing in any target and carries scope=flow. commit is idempotent
          on load_id: a repeat returns the same per-target results. A discarded or unknown load is
          not_found. A load that carries define for any target is invalid_request/rehearsal_only.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "load_id": { "type": "string", "minLength": 1 },
                  "targets": {
                    "type": "array",
                    "description": "Per-target plan. A target of the load with no entry is committed in append mode.",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["target"],
                      "properties": {
                        "target": { "type": "string", "pattern": "^[^\\s:]+:[^\\s:]+$" },
                        "replace_scope": {
                          "type": "object",
                          "additionalProperties": false,
                          "oneOf": [
                            { "required": ["period_in"] },
                            { "required": ["all"] }
                          ],
                          "properties": {
                            "period_in": {
                              "type": "array", "minItems": 1,
                              "items": { "type": "string", "minLength": 1 },
                              "description": "Values of the target's role=period column whose rows this load replaces, in the lexical form append accepts. Every staged row's period MUST be in this list."
                            },
                            "all": { "const": true }
                          }
                        },
                        "expect": {
                          "type": "object",
                          "additionalProperties": false,
                          "properties": {
                            "target_version": {
                              "type": "string", "minLength": 1,
                              "description": "Version last observed through describe_scope. Receiver refuses when it has moved."
                            },
                            "owners": {
                              "type": "array",
                              "description": "Who the caller believes owns each scope it is about to replace. An entry without period is about the whole target.",
                              "items": {
                                "type": "object",
                                "additionalProperties": false,
                                "required": ["run_ids"],
                                "properties": {
                                  "period": { "type": "string", "minLength": 1 },
                                  "run_ids": {
                                    "type": "array",
                                    "items": { "type": "string", "minLength": 1 },
                                    "description": "The complete owner set the caller saw. Empty asserts the period holds no rows."
                                  }
                                }
                              }
                            }
                          }
                        },
                        "allow_shrink": { "type": "boolean", "default": false },
                        "batches": {
                          "type": "integer", "minimum": 0,
                          "description": "Appends the caller made for this target. When given, the receiver MUST hold exactly indexes 1..batches."
                        }
                      }
                    }
                  }
                },
                "required": ["load_id"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "targets": {
                    "type": "array",
                    "description": "One entry per target of the load, in begin order.",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["target", "result", "inserted", "deleted"],
                      "properties": {
                        "target": { "type": "string" },
                        "result": { "type": "string", "enum": ["appended", "replaced", "noop"] },
                        "inserted": { "type": "integer", "minimum": 0 },
                        "deleted": { "type": "integer", "minimum": 0 },
                        "target_version": {
                          "type": "string", "minLength": 1,
                          "description": "Version of the target after this commit; carry it into the next expect. Absent when supports.expect is false."
                        }
                      }
                    }
                  },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["targets"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": { "required": ["error"], "properties": { "targets": false } }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean" },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object" }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: rehearse
        description: |
          Everything commit would do for this load, in the one transaction commit would do it in, and
          then rolled back. The answer is what commit would have answered -- the per-target results or
          the refusal, by the same rules -- and nothing survives it: no row, no target, no version, no
          definition. The load is discarded whichever way the rehearsal goes.

          A target the load carries define for is shaped inside that transaction as the definition
          would shape it -- created, or altered from what exists -- before any rule runs, so a
          rehearsal answers for a target that does not exist yet exactly as its first commit would. A
          receiver that cannot rehearse answers invalid_request/rehearsal_unsupported and describes
          its targets with supports.rehearse = false.
