                    "description": "One entry per target of the load, in begin order.",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["target", "result", "inserted", "deleted"],
                      "properties": {
                        "target": { "type": "string" },
                        "result": { "type": "string", "enum": ["appended", "replaced", "noop"] },
                        "inserted": { "type": "integer", "minimum": 0 },
                        "deleted": { "type": "integer", "minimum": 0 },
                        "data_version": {
                          "type": "string", "minLength": 1,
                          "description": "data_version of the target after this commit; carry it into the next expect. Absent when supports.expect is false."
                        }
                      }
                    }
                  },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["targets"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": { "required": ["error"], "properties": { "targets": false } }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean", "description": "One rule for the family: true only for rate_limited, stalled and provider_unavailable with reason infrastructure; provider_unavailable always carries reason infrastructure or timeout, and everything else is a decision a retry does not change. A failed call itself -- transport, no binding -- counts as infrastructure." },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object", "description": "reason, and what it names. invalid_request: malformed (a request the grammar does not take, with field), unknown_column, type_mismatch (with column, row and the receiver's own rule), missing_value, batch_too_large, load_closed, period_missing, period_not_in_scope, period_unsupported, period_invalid, batches_incomplete, rehearsal_only, run_targets_differ, targets_not_co_located, unsupported_column, unsupported_option (with option), expect_invalid, define_target_mismatch, limit_exceeded (with limit). conflict: owner_changed, version_changed, shrink, duplicate_key, schema_changed, already_committed (with result), batch_mismatch. not_found for an unknown target or load; permission_denied with target; provider_unavailable with infrastructure or timeout." }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: rehearse
        description: |
