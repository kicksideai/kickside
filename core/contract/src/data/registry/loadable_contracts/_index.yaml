version: "1.0"
namespace: kickside.data

entries:
  - name: loadable
    kind: contract.definition
    meta:
      title: Loadable Target
      tags: [data, load, bulk, transaction, slice]
      comment: Bulk load ABI. Batches staged into one load over one or more targets and committed as one transaction, optionally replacing a scope. Receiver owns staging.
    methods:
      - name: list
        description: |
          Existing targets a caller may load into, for a picker or an agent choosing where a recipe
          output goes. A target must exist before a load; this is the only discovery the contract
          offers. query is an optional substring filter on id and title.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "query": { "type": "string", "description": "Optional substring filter on id and title." }
                }
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "targets": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["id", "title"],
                      "properties": {
                        "id": { "type": "string", "pattern": "^[^\\s:]+:[^\\s:]+$" },
                        "title": { "type": "string", "minLength": 1 },
                        "description": { "type": "string" }
                      }
                    }
                  },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["targets"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": { "required": ["error"], "properties": { "targets": false } }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean", "description": "One rule for the family: true only for rate_limited, stalled and provider_unavailable with reason infrastructure; provider_unavailable always carries reason infrastructure or timeout, and everything else is a decision a retry does not change. A failed call itself -- transport, no binding -- counts as infrastructure." },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object", "description": "reason, and what it names. invalid_request: malformed (a request the grammar does not take, with field), unknown_column, type_mismatch (with column, row and the receiver's own rule), missing_value, batch_too_large, load_closed, period_missing, period_not_in_scope, period_unsupported, period_invalid, batches_incomplete, rehearsal_only, run_targets_differ, targets_not_co_located, unsupported_column, unsupported_option (with option), expect_invalid, define_target_mismatch, limit_exceeded (with limit). conflict: owner_changed, version_changed, shrink, duplicate_key, schema_changed, already_committed (with result), batch_mismatch. not_found for an unknown target or load; permission_denied with target; provider_unavailable with infrastructure or timeout." }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: describe
        description: |
          What this target is and what the receiver can do with it. A caller sizes its batches and
          chooses a replacement mode from this answer rather than from a constant of its own.

          A column carries a storage type and, optionally, a role and a format. The type is what a
          caller coerces a value to; the role is what the column is for; the format is a hint a caller
          MAY use and MUST NOT depend on. At most one column may carry role=period, and it is the axis
          replace_scope.period_in replaces by. Stating the axis on the column rather than beside the
          array keeps one fact in one place: a separate period_column field could name a column the
          array does not contain, or one whose type contradicts it. A column whose type the receiver
          cannot express in the enum MUST be omitted; when that column is also required, describe MUST
          fail with invalid_request/unsupported_column instead of describing a target nobody can load.

          columns_version changes whenever columns change; begin echoes it and commit rechecks it.
          key names the columns that identify one row; when non-empty, commit refuses duplicates
          (conflict/duplicate_key); the columns of a non-empty key are never nullable. supports says
          what this receiver answers for; a request that uses what it declared false is
          invalid_request/unsupported_option with details.option naming the flag: expect = false
          means no ownership record (describe_scope answers owners=[] and no data_version),
          multi_target = false means begin takes exactly one target, replace_scope = false means
          append only, allow_shrink = false means no replace below the floor. Access is per target
          under the calling actor, decided here, at describe_scope and at begin: a denied target is
          permission_denied with details.target.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "target": {
                    "type": "string",
                    "pattern": "^[^\\s:]+:[^\\s:]+$",
                    "description": "namespace:id the receiver resolves to one loadable relation."
                  }
                },
                "required": ["target"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "columns": {
                    "type": "array",
                    "description": "Columns this target accepts, in declaration order.",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["name", "type", "nullable"],
                      "properties": {
                        "name": { "type": "string", "minLength": 1 },
                        "type": {
                          "type": "string",
                          "enum": ["string", "number", "integer", "boolean", "date", "datetime", "time"],
                          "description": "Storage type. This is what a caller coerces a value to, and nothing else. A date is YYYY-MM-DD, a datetime a wall-clock moment without a zone as YYYY-MM-DDTHH:MM:SS, a time HH:MM:SS; all three order in time as text."
                        },
                        "format": {
                          "type": "string",
                          "description": "Receiver-specific hint such as email or uuid. A caller MAY use it and MUST NOT depend on it."
                        },
                        "options": {
                          "type": "object",
                          "description": "The column's options as the receiver holds them, keyed as its types().options_schema names them, every default filled in: a string type's max_length, an enum's values. A caller that read options_schema knows the names; absent for a column whose type takes none."
                        },
                        "role": {
                          "type": "string",
                          "enum": ["period"],
                          "description": "What this column is for, as distinct from what it holds. A period column is the axis replace_scope.period_in replaces by; at most one column may carry it, and only a string, integer, date or datetime column can. A period value is not always a date -- 2025-08, 2025-Q1 -- which is why the role does not replace the storage type. Wherever a period is spelled as text (period_in, owners, scope) it is the column's canonical form: a string or date-like value as stored, an integer as plain decimal digits with no leading zeros or fraction."
                        },
                        "nullable": { "type": "boolean", "description": "False for a column every row must carry; a column of a non-empty key is never nullable." }
                      }
                    }
                  },
                  "key": {
                    "type": "array",
                    "description": "Columns naming one row's identity, none of them nullable. Empty when the target has no row identity. Enforced at commit when non-empty.",
                    "items": { "type": "string", "minLength": 1 }
                  },
                  "columns_version": {
                    "type": "string", "minLength": 1,
                    "description": "Opaque; changes whenever columns change. Echoed in begin, rechecked in commit."
                  },
                  "limits": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["max_batch_rows", "max_period_in", "abandon_after_ms"],
                    "properties": {
                      "max_batch_rows": {
                        "type": "integer", "minimum": 1,
                        "description": "Largest rows array append accepts. The bound belongs to whoever owns the statement."
                      },
                      "max_period_in": {
                        "type": "integer", "minimum": 1,
                        "description": "Upper bound on replace_scope.period_in and describe_scope.period_in cardinality, the same bound readable names for scope.period.in. Exceeding it is invalid_request/limit_exceeded with details.limit."
                      },
                      "abandon_after_ms": {
                        "type": "integer", "minimum": 1,
                        "description": "A load with no begin, append or commit for this long is reclaimed; a committed load stays answerable for at least this long after its commit."
                      }
                    }
                  },
                  "supports": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["replace_scope", "expect", "allow_shrink", "multi_target"],
                    "properties": {
                      "replace_scope": { "type": "boolean", "description": "False: commit takes no replace_scope (unsupported_option)." },
                      "expect": { "type": "boolean", "description": "False: no ownership record; describe_scope answers owners=[] and no data_version, commit refuses expect (unsupported_option)." },
                      "allow_shrink": { "type": "boolean", "description": "False: a replace below the shrink floor cannot be forced (unsupported_option)." },
                      "multi_target": { "type": "boolean", "description": "False: begin takes exactly one target (unsupported_option)." },
                      "can_define": {
                        "type": "boolean",
                        "description": "True when this receiver also binds kickside.data:definable, so a caller holding a file nobody has a target for can create one instead of stopping."
                      },
                      "rehearse": {
                        "type": "boolean",
                        "description": "Two promises under one flag, until a receiver without transactional DDL separates them: rehearse runs a load to the end and rolls it back, and begin accepts define for a target it would create or alter. False: both are unsupported_option with option rehearse."
                      },
                      "can_read": {
                        "type": "boolean",
                        "description": "True when this receiver also binds kickside.data:readable, so a caller can read back what it loaded -- sample a target, profile a slice, find which keys exist -- by the same target ids."
                      }
                    }
                  },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": {
                      "required": ["columns", "key", "columns_version", "limits", "supports"],
                      "properties": { "error": false }
                    }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": {
                      "required": ["error"],
                      "properties": { "columns": false, "key": false, "columns_version": false, "limits": false, "supports": false }
                    }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean", "description": "One rule for the family: true only for rate_limited, stalled and provider_unavailable with reason infrastructure; provider_unavailable always carries reason infrastructure or timeout, and everything else is a decision a retry does not change. A failed call itself -- transport, no binding -- counts as infrastructure." },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object", "description": "reason, and what it names. invalid_request: malformed (a request the grammar does not take, with field), unknown_column, type_mismatch (with column, row and the receiver's own rule), missing_value, batch_too_large, load_closed, period_missing, period_not_in_scope, period_unsupported, period_invalid, batches_incomplete, rehearsal_only, run_targets_differ, targets_not_co_located, unsupported_column, unsupported_option (with option), expect_invalid, define_target_mismatch, limit_exceeded (with limit). conflict: owner_changed, version_changed, shrink, duplicate_key, schema_changed, already_committed (with result), batch_mismatch. not_found for an unknown target or load; permission_denied with target; provider_unavailable with infrastructure or timeout." }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: describe_scope
        description: |
          Who owns the rows a commit is about to replace. This is the read expect is built from: a
          caller looks, decides, then asserts in commit that what it saw is still true.

          A load owns only the rows it stamped with its run_id. owners carries one entry per owning
          run -- per (period, run) with period_in, per run without -- and nothing else: a period or a
          target with no loaded rows contributes no entry, and an empty target answers owners=[].
          Rows no load stamped -- written through another path, by hand -- are nobody's: they are not
          listed, cannot be asserted, and a replace never deletes them. They are counted in rows, so
          rows minus the sum of owners[].rows is how many of them the scope holds. source is returned
          exactly as the owning load's begin supplied it. data_version is the value to carry into
          expect. A receiver with supports.expect=false answers owners=[] and no data_version, but
          MUST still answer rows.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "target": { "type": "string", "pattern": "^[^\\s:]+:[^\\s:]+$" },
                  "period_in": {
                    "type": "array", "minItems": 1,
                    "items": { "type": "string", "minLength": 1 },
                    "description": "Periods to report on, in the period column's canonical form (see describe.columns[].role). Bounded by limits.max_period_in. Omit for the whole target. What describe_scope answers, source included, is visible to anyone with the right to load, so a producer puts no secret in run.source."
                  }
                },
                "required": ["target"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "data_version": {
                    "type": "string", "minLength": 1,
                    "description": "Opaque; moves on every write to the target, a load commit or a record write, and is the value readable.describe answers. Absent when supports.expect is false."
                  },
                  "rows": { "type": "integer", "minimum": 0, "description": "Rows currently in the requested scope, loaded or not." },
                  "owners": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["run_id", "rows"],
                      "properties": {
                        "period": { "type": "string", "description": "Present when the target has a period axis, in the column's canonical form; absent on a target without one." },
                        "run_id": { "type": "string", "minLength": 1, "description": "The owning run." },
                        "source": { "type": "object", "description": "The owning load's run.source, verbatim." },
                        "rows": { "type": "integer", "minimum": 0 }
                      }
                    }
                  },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["rows", "owners"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": {
                      "required": ["error"],
                      "properties": { "data_version": false, "rows": false, "owners": false }
                    }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean", "description": "One rule for the family: true only for rate_limited, stalled and provider_unavailable with reason infrastructure; provider_unavailable always carries reason infrastructure or timeout, and everything else is a decision a retry does not change. A failed call itself -- transport, no binding -- counts as infrastructure." },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object", "description": "reason, and what it names. invalid_request: malformed (a request the grammar does not take, with field), unknown_column, type_mismatch (with column, row and the receiver's own rule), missing_value, batch_too_large, load_closed, period_missing, period_not_in_scope, period_unsupported, period_invalid, batches_incomplete, rehearsal_only, run_targets_differ, targets_not_co_located, unsupported_column, unsupported_option (with option), expect_invalid, define_target_mismatch, limit_exceeded (with limit). conflict: owner_changed, version_changed, shrink, duplicate_key, schema_changed, already_committed (with result), batch_mismatch. not_found for an unknown target or load; permission_denied with target; provider_unavailable with infrastructure or timeout." }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: begin
        description: |
          Open a load against one or more targets. run_id is the caller's own run identity: it is the
          lineage the receiver stamps onto every accepted row, and it is the idempotency key of the
          load itself. A second begin for a run whose load is still open MUST return that same
          load_id, or invalid_request/run_targets_differ if the target set is not the same. A begin
          for a run whose load was committed within limits.abandon_after_ms MUST return
          conflict/already_committed with the commit output in error.details.result, so a retry
          after a lost acknowledgement learns the outcome instead of loading twice. A begin for a run
          whose load was discarded or reclaimed opens a new load. A dry run makes no begin: describe
          and describe_scope are the reads it needs, and a load it never opened leaves nothing behind.

          source is opaque provenance the receiver stores with the load and returns from
          describe_scope; the caller decides what identifies a source. Each target echoes the
          columns_version its caller took from describe; a stale one is conflict/schema_changed.

          Every target of one load commits in one transaction. A receiver that cannot do that for the
          requested set MUST refuse here with invalid_request/targets_not_co_located, never split the
          commit later.

          A target may carry define: the request kickside.data:definable.define takes, for a target
          that does not exist yet or one the definition would alter. The load then stages and checks
          rows as that definition would shape the target, and it can only be rehearsed: commit MUST
          refuse it with invalid_request/rehearsal_only. A receiver that cannot rehearse refuses define
          here with invalid_request/unsupported_option, option rehearse. For a target that does not
          exist yet, target MUST be what define(dry_run) answered for the same request; anything else
          is invalid_request/define_target_mismatch.

          Access is decided here for every target of the load, under the calling actor: one denied
          target refuses the whole begin with permission_denied and details.target, and append,
          rehearse, commit and discard inherit that decision -- load_id is the right they run under.
          A begin that carries define needs only the right to load: a rehearsal leaves nothing
          behind. A begin for a run the receiver no longer remembers -- committed before rule 6's
          window ran out -- opens a new load, and the rows of both commits carry the run_id as one
          lineage.
        input_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "run": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["run_id"],
                    "properties": {
                      "run_id": { "type": "string", "minLength": 1 },
                      "source": {
                        "type": "object",
                        "description": "Opaque provenance stored with the load and returned by describe_scope."
                      }
                    }
                  },
                  "targets": {
                    "type": "array", "minItems": 1,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["target"],
                      "properties": {
                        "target": { "type": "string", "pattern": "^[^\\s:]+:[^\\s:]+$" },
                        "columns_version": {
                          "type": "string", "minLength": 1,
                          "description": "From describe. Refused with conflict/schema_changed when it has moved."
                        },
                        "define": {
                          "type": "object",
                          "description": "The kickside.data:definable.define request this target is loaded as if applied. Only a rehearsal may carry one, and for a new target target MUST equal define(dry_run).target (invalid_request/define_target_mismatch otherwise)."
                        }
                      }
                    }
                  }
                },
                "required": ["run", "targets"]
              }
        output_schemas:
          - format: application/schema+json
            definition: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "success": { "type": "boolean" },
                  "load_id": { "type": "string", "minLength": 1 },
                  "error": { "$ref": "#/$defs/DataError" }
                },
                "required": ["success"],
                "allOf": [
                  {
                    "if": { "properties": { "success": { "const": true } }, "required": ["success"] },
                    "then": { "required": ["load_id"], "properties": { "error": false } }
                  },
                  {
                    "if": { "properties": { "success": { "const": false } }, "required": ["success"] },
                    "then": { "required": ["error"], "properties": { "load_id": false } }
                  }
                ],
                "$defs": {
                  "DataError": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "auth_expired", "rate_limited", "invalid_config", "invalid_request", "not_found",
                          "conflict", "permission_denied", "provider_unavailable", "provider_error",
                          "cursor_expired", "history_unavailable", "stalled", "unknown"
                        ]
                      },
                      "message": { "type": "string" },
                      "retriable": { "type": "boolean", "description": "One rule for the family: true only for rate_limited, stalled and provider_unavailable with reason infrastructure; provider_unavailable always carries reason infrastructure or timeout, and everything else is a decision a retry does not change. A failed call itself -- transport, no binding -- counts as infrastructure." },
                      "retry_after_ms": { "type": "integer", "minimum": 0 },
                      "auth_expired": { "type": "boolean" },
                      "scope": {
                        "type": "string",
                        "enum": ["item", "flow", "connection", "provider", "capacity", "identity"],
                        "description": "Classifies blast radius. item-scope with retriable=false is a poison candidate."
                      },
                      "provider_code": { "type": "string" },
                      "details": { "type": "object", "description": "reason, and what it names. invalid_request: malformed (a request the grammar does not take, with field), unknown_column, type_mismatch (with column, row and the receiver's own rule), missing_value, batch_too_large, load_closed, period_missing, period_not_in_scope, period_unsupported, period_invalid, batches_incomplete, rehearsal_only, run_targets_differ, targets_not_co_located, unsupported_column, unsupported_option (with option), expect_invalid, define_target_mismatch, limit_exceeded (with limit). conflict: owner_changed, version_changed, shrink, duplicate_key, schema_changed, already_committed (with result), batch_mismatch. not_found for an unknown target or load; permission_denied with target; provider_unavailable with infrastructure or timeout." }
                    },
                    "required": ["code", "message", "retriable", "scope"]
                  }
                }
              }

      - name: append
        description: |
          Stage one batch for one target of the load. Rows are plain objects keyed by column name with
          JSON scalar values; a column a row omits or carries as null or as "" is absent and stored as
          NULL, and NULL in a column described nullable = false is invalid_request/missing_value. A
          key that is not a declared column is invalid_request/unknown_column; a value the column's
          storage type cannot hold, or that the receiver's own rule for the column refuses (an enum
          value outside its list, a malformed email), is invalid_request/type_mismatch with
          details.column, details.row and, when the receiver has one, details.rule naming its own
          rule; what is stored is what that rule answers, the same as any other write path of the
          receiver. More than limits.max_batch_rows rows MUST
