version: '1.0'
namespace: app
entries:
- name: projection_owner_policy_test
  kind: function.lua
  meta:
    type: test
    suite: key_owner
  source: file://projection_owner_policy_test.lua
  method: run
  modules:
  - funcs
  - security
  - env
  - registry
  - time
  - sql
  - uuid
  - process
  imports:
    test: wippy.test:test
    worker: kickside.core.projections.persist:worker
    execution_identity: kickside.execution:execution_identity
- name: projection_owner_probe
  kind: function.lua
  source: file://projection_owner_policy_test.lua
  method: probe
  modules:
  - funcs
  - security
  - env
  - registry
  - time
  - sql
  - uuid
  - process
  imports:
    test: wippy.test:test
    worker: kickside.core.projections.persist:worker
    execution_identity: kickside.execution:execution_identity
- name: projection_owner_worker
  kind: function.lua
  meta:
    type: projection.worker
  source: file://projection_owner_policy_test.lua
  method: owner
  modules:
  - funcs
  - security
  - env
  - registry
  - time
  - sql
  - uuid
  imports:
    test: wippy.test:test
    worker: kickside.core.projections.persist:worker
    execution_identity: kickside.execution:execution_identity
  security:
    policies:
    - app:projection_owner_environment
- name: projection_owner_environment
  kind: security.policy
  meta:
    service_only: true
  policy:
    resources:
    - app:projection_owner_value
    actions:
    - env.get
    effect: allow
- name: projection_owner_storage
  kind: env.storage.memory
- name: projection_owner_value
  kind: env.variable
  storage: app:projection_owner_storage
  default: owner-resource-value
- name: projection_owner_caller
  kind: security.policy
  policy:
    resources: '*'
    actions:
    - funcs.call
    - funcs.security
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.security
    - db.get
    - process.context
    - process.spawn
    - process.spawn.monitored
    - process.spawn.linked
    - process.host
    - process.security
    - security.actor.create
    - security.actor.create
    - security.policy_group.get
    - security.policy_group.get
    effect: allow
- name: projection_owner_actor
  kind: function.lua
  meta:
    type: projection.worker
  source: file://projection_owner_policy_test.lua
  method: owner
  modules:
  - funcs
  - security
  - env
  - registry
  - time
  - sql
  - uuid
  imports:
    test: wippy.test:test
    worker: kickside.core.projections.persist:worker
    execution_identity: kickside.execution:execution_identity
  security:
    actor:
      id: system:projection-owner
    policies:
    - app:projection_owner_environment
- name: projection_owner_mixed
  kind: function.lua
  meta:
    type: projection.worker
  source: file://projection_owner_policy_test.lua
  method: owner
  modules:
  - funcs
  - security
  - env
  - registry
  - time
  - sql
  - uuid
  imports:
    test: wippy.test:test
    worker: kickside.core.projections.persist:worker
    execution_identity: kickside.execution:execution_identity
  security:
    policies:
    - app:projection_owner_environment
    - app:test_scope_policy
- name: projection_owner_missing
  kind: function.lua
  meta:
    type: projection.worker
  source: file://projection_owner_policy_test.lua
  method: owner
  modules:
  - funcs
  - security
  - env
  - registry
  - time
  - sql
  - uuid
  imports:
    test: wippy.test:test
    worker: kickside.core.projections.persist:worker
    execution_identity: kickside.execution:execution_identity
  security:
    policies:
