- name: projection_owner_private
  kind: function.lua
  meta:
    type: projection.worker
    private: true
  source: file://projection_owner_policy_test.lua
  method: owner
  modules:
  - funcs
  - security
  - env
  - registry
  - time
  - sql
  - uuid
  imports:
    test: wippy.test:test
    worker: kickside.core.projections.persist:worker
    execution_identity: kickside.execution:execution_identity
  security:
    policies:
