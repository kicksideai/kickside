version: "1.0"
namespace: kickside.core.retention.pin_tests

# Harness-owned declarations for retention pin tests.
entries:
  - name: sweeper_missing_result_test
    kind: function.lua
    meta:
      title: Retention Missing SQL Results
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
    source: file://sweeper_missing_result_test.lua
    method: run
    modules: [sql]
    imports:
      test: wippy.test:test
      sweeper: kickside.core.retention:sweeper

  - name: sweep_expiry_test
    kind: function.lua
    meta:
      title: Core Retention Sweep Bounded By Expiry
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
    source: file://sweep_expiry_test.lua
    method: run
    modules: [sql, uuid]
    imports:
      test: wippy.test:test
      sweeper: kickside.core.retention:sweeper
      threads_writer: kickside.core.threads.persist:writer
      jobs: kickside.core.jobs:jobs
      prune_scaffold: app:prune_scaffold

  - name: policy_test
    kind: function.lua
    meta:
      title: Core Retention Policy
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
    source: file://policy_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      retention_policy: kickside.core:policy_config

  - name: exact_deadline_test
    kind: function.lua
    meta:
      title: Retention Exact Deadlines
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
    source: file://exact_deadline_test.lua
    method: run
    modules: [sql, uuid, time]
    imports:
      test: wippy.test:test
      sweeper: kickside.core.retention:sweeper

  - name: pin_test
    kind: function.lua
    meta:
      title: Retention Pins
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
      comment: Command and pin generation fences, tombstones, prune boundary refusals.
    source: file://pin_test.lua
    method: run
    modules:
      - sql
      - uuid
      - channel
    imports:
      test: wippy.test:test
      pin: kickside.core.retention:pin
      threads_teardown: kickside.core.threads.persist:teardown

  - name: prune_test
    kind: function.lua
    meta:
      title: Retention Prune
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
      comment: Batched prefix prune and boundary advance under Core-local protection.
    source: file://prune_test.lua
    method: run
    modules:
      - sql
      - uuid
    imports:
      test: wippy.test:test
      pin: kickside.core.retention:pin
      prune: kickside.core.retention:prune
      append: kickside.core.threads.persist:append
      prune_scaffold: app:prune_scaffold

  - name: expiry_bound_test
    kind: function.lua
    meta:
      title: Core Retention Bounded By Expiry
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
      comment: Threads grow past former per-thread counts; only age expiry below pin floors prunes them.
      timeout: 600s
    source: file://expiry_bound_test.lua
    method: run
    modules:
      - sql
    imports:
      test: wippy.test:test
      pin: kickside.core.retention:pin
      prune: kickside.core.retention:prune
      append: kickside.core.threads.persist:append
      prune_scaffold: app:prune_scaffold

  - name: prune_concurrency_test
    kind: function.lua
    meta:
      title: Retention Prune Concurrency
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
      comment: Pin/prune lock races and append serialization.
    source: file://prune_concurrency_test.lua
    method: run
    modules:
      - channel
    imports:
      test: wippy.test:test
      pin: kickside.core.retention:pin
      prune: kickside.core.retention:prune
      append: kickside.core.threads.persist:append
      prune_scaffold: app:prune_scaffold

  - name: restart_test
    kind: function.lua
    meta:
      title: Core Retained Writes Across Process Restart
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
    source: file://restart_test.lua
    method: run
    modules: [sql, uuid, process, channel]
    imports:
      test: wippy.test:test
      pin: kickside.core.retention:pin

  - name: restart_probe
    kind: process.lua
    meta:
      type: test_helper
      comment: Holds a core write across a monitored process termination.
    source: file://restart_probe.lua
    method: run
    modules: [sql, process]
    imports:
      append: kickside.core.threads.persist:append
      pin: kickside.core.retention:pin
      write_receipt: kickside.core:write_receipt

  - name: service_test
    kind: function.lua
    meta:
      title: Core Retention Service Runner
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
      comment: Deterministic service wake, exact rearm, and restart recovery coverage.
    source: file://service_test.lua
    method: run
    modules: [sql, uuid, time]
    imports:
      owner_hooks: kickside.core.retention.service:owner_hooks
      test: wippy.test:test
      threads_writer: kickside.core.threads.persist:writer
      retention_repo: kickside.core.retention.persist:repo
      retention_runner: kickside.core.retention.service:runner
      sweeper: kickside.core.retention:sweeper
      pin: kickside.core.retention:pin
      write_receipt: kickside.core:write_receipt
      retention_policy: kickside.core:policy_config

  - name: owner_probe_first
    kind: function.lua
    meta:
      type: kickside.retention.owner
      comment: Probe retention owner armed by the owner isolation suite.
    source: file://owner_probe.lua
    method: first
    modules: [sql, time]

  - name: owner_probe_second
    kind: function.lua
    meta:
      type: kickside.retention.owner
      comment: Probe retention owner armed by the owner isolation suite.
    source: file://owner_probe.lua
    method: second
    modules: [sql, time]

  - name: owner_isolation_test
    kind: function.lua
    meta:
      title: Retention Owner Isolation
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
      comment: One retention owner's failure is reported and never stops the other owners or the Core pass.
    source: file://owner_isolation_test.lua
    method: run
    modules: [sql, process, channel, time, registry, funcs]
    imports:
      test: wippy.test:test
      owner_hooks: kickside.core.retention.service:owner_hooks
      retention_runner: kickside.core.retention.service:runner

  - name: notifier_probe
    kind: function.lua
    meta:
      type: test_helper
      comment: Publishes one retention change from the caller's actor frame.
    source: file://notifier_probe.lua
    method: run
    imports:
      retention_notifier: kickside.core.retention:notifier

  - name: notifier_authority_test
    kind: function.lua
    meta:
      title: Retention Notifier Authority
      type: test
      suite: kickside_core
      group: KickSide Core / Retention
      comment: Retention change notification runs under the retention service identity, not the producer's.
    source: file://notifier_authority_test.lua
    method: run
    modules: [funcs, security, process, channel, time, uuid]
    imports:
      test: wippy.test:test
