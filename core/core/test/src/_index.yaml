version: "1.0"
namespace: app

# Standalone harness for kickside core slices. Supplies explicit dependency
# parameters and provides env storage + bootloader so the slices boot, run their
# migrations, and execute the harness-owned suites in isolation.
# Excluded from publish (see wippy.yaml).

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    component: wippy/test
    version: "*"

  - name: dep.kickside.realtime
    kind: ns.dependency
    component: kickside/realtime
    version: '*'

  - name: dep.wippy.relay
    kind: ns.dependency
    component: wippy/relay
    version: '*'
    parameters:
      - name: user_security_scope
        value: app:user
      - name: env_storage
        value: app:env_storage
      - name: application_host
        value: app:processes

  - name: commit_proc_hook
    kind: function.lua
    meta: { type: projection.worker, post_commit_ref: "proc://app:test_proc_worker" }
    source: file://commit_probe_worker.lua
    method: run
    modules: [sql, json]
  - name: commit_private_hook
    kind: function.lua
    meta: { type: projection.worker, post_commit_ref: "func://app:test_private_projection_worker" }
    source: file://commit_probe_worker.lua
    method: run
    modules: [sql, json]
  - name: commit_scoped_hook
    kind: function.lua
    meta: { type: projection.worker, post_commit_ref: "func://app:test_scoped_projection_worker" }
    source: file://commit_probe_worker.lua
    method: run
    modules: [sql, json]
  - name: commit_undeclared_hook
    kind: function.lua
    meta: { type: projection.worker, post_commit_ref: "func://app:thread_access_gate" }
    source: file://commit_probe_worker.lua
    method: run
    modules: [sql, json]
  - name: commit_probe_worker
    kind: function.lua
    meta: { type: projection.worker, post_commit_ref: "func://app:commit_probe_notify" }
    source: file://commit_probe_worker.lua
    method: run
    modules: [sql, json]
  - name: commit_probe_notify
    kind: function.lua
    meta: { type: projection.worker }
    source: file://commit_probe_worker.lua
    method: after_commit
    modules: [sql, json]
  - name: prune_scaffold
    kind: library.lua
    meta:
      comment: Shared prune-case helpers for the retention prune suites.
    source: file://suites/retention/prune_scaffold.lua
    modules: [sql, uuid, time]
    imports:
      pin: kickside.core.retention:pin
      prune: kickside.core.retention:prune

  - name: test_lifecycle_report_access
    kind: security.policy
    meta:
      comment: Test-only lifecycle report capability grant for authorization coverage.
    groups: [app.security:admin]
    policy:
      resources: kickside.core.lifecycle:report
      actions: lifecycle.report.publish
      effect: allow

  - name: test_lifecycle_report_call
    kind: security.policy
    meta:
      comment: Test-only admin grant for the guarded internal lifecycle publisher call.
    groups: [app.security:admin]
    policy:
      resources: kickside.core.lifecycle:publish_report
      actions: funcs.call
      effect: allow

  # Registry-declared event types for the Threads contract fixtures below.
  - name: threads_test_external
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_cross_output
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      output_kind: kickside.test.threads:shared_output_kind
    schema: { type: object }
  - name: threads_test_other
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_knowledge_created
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_knowledge_denied
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_knowledge_emitted
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_ws_trigger
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_ws_changed
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_not_declared
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_note
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object, properties: { n: { type: number } } }
  - name: threads_keep
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_skip
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_resolver
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_po_trigger
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_cv_trigger
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }
  - name: threads_sys_reap
    kind: registry.entry
    meta: { type: kickside.core.threads.event }
    schema: { type: object }

  - name: threads_test_legacy_output_publish
    kind: security.policy
    meta:
      comment: Obsolete publication capability used only to prove it grants no component access.
    policy:
      resources:
        - kickside.test.threads:changed
        - app:threads_test_external
        - app:threads_cross_output
        - app:threads_knowledge_created
        - app:threads_knowledge_emitted
        - app:threads_note
      actions: threads.output.publish
      effect: allow

  - name: threads_test_user_append_scope
    kind: security.policy
    meta:
      comment: Narrow user test scope with Threads access but no output publication grant.
    policy:
      resources: "*"
      actions: [contract.get, contract.open, contract.call, contract.security, db.get, registry.get, funcs.call, funcs.security, security.policy_group.get]
      effect: allow

  - name: test_output_publisher
    kind: function.lua
    meta:
      type: test_helper
      comment: Test-only owner producer that appends without a publication capability.
    source: file://test_output_publisher.lua
    method: publish
    modules: [security, contract]

  - name: test_legacy_output_publisher
    kind: function.lua
    meta: { type: test_helper }
    source: file://test_output_publisher.lua
    method: publish
    modules: [security, contract]
    security:
      policies: [app:threads_test_legacy_output_publish]

  - name: test_system_output_publisher
    kind: function.lua
    meta:
      private: true
      type: test_helper
      comment: Test-only producer under explicit framework maintenance authority.
    source: file://test_output_publisher.lua
    method: publish
    modules: [security, contract]
    security:
      actor: { id: "system:test-output-publisher" }

  - name: lifecycle_wiring_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_core
    source: file://lifecycle_wiring_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: In-memory database for core slice tests.
    file: "${sqlite_path}"

  - name: migration_db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: Scratch database the core migration suite builds schemas in; on PostgreSQL the <test database>_mig database the suite creates and drops.
    file: ":memory:"

  - name: uploads
    kind: fs.directory
    directory: ./.wippy/uploads
    auto_init: true

  # ─── Test-only callable wrappers ─────────────────────────────────────
  # The writer + reader live below the HTTP layer; their endpoints read
  # http.request, so the suites cannot drive them as plain funcs. These wrappers
  # expose the same library calls as value-returning funcs a scoped test runner
  # invokes under an actor. meta.type test_helper keeps them out of the suite run.
  - name: test_post_message
    kind: function.lua
    meta:
      type: test_helper
      comment: Test wrapper appending one message event through writer.ingest_events_batch.
    source: file://test_ops.lua
    method: post_message
    modules: [sql, json, security]
    imports:
      threads_writer: kickside.core.threads.persist:writer
      threads_reader: kickside.core.threads.persist:reader
      threads_env: kickside.core.threads:env

  - name: test_ingest_events_batch
    kind: function.lua
    meta:
      type: test_helper
      comment: Test wrapper over writer.ingest_events_batch.
    source: file://test_ops.lua
    method: ingest_events_batch
    modules: [sql, json, security]
    imports:
      threads_writer: kickside.core.threads.persist:writer
      threads_reader: kickside.core.threads.persist:reader
      threads_env: kickside.core.threads:env

  - name: test_ingest_multi
    kind: function.lua
    meta:
      type: test_helper
      comment: Test wrapper over writer.ingest_multi.
    source: file://test_ops.lua
    method: ingest_multi
    modules: [sql, json, security]
    imports:
      threads_writer: kickside.core.threads.persist:writer
      threads_reader: kickside.core.threads.persist:reader
      threads_env: kickside.core.threads:env

  - name: test_get_thread
    kind: function.lua
    meta:
      type: test_helper
      comment: Test wrapper over reader.get.
    source: file://test_ops.lua
    method: get
    modules: [sql, json, security]
    imports:
      threads_writer: kickside.core.threads.persist:writer
      threads_reader: kickside.core.threads.persist:reader
      threads_env: kickside.core.threads:env

  - name: test_list_events
    kind: function.lua
    meta:
      type: test_helper
      comment: Test wrapper over reader.list_events.
    source: file://test_ops.lua
    method: list_events
    modules: [sql, json, security]
    imports:
      threads_writer: kickside.core.threads.persist:writer
      threads_reader: kickside.core.threads.persist:reader
      threads_env: kickside.core.threads:env

  - name: test_find_event_by_external
    kind: function.lua
    meta:
      type: test_helper
      comment: Test wrapper over reader.find_event_by_external.
    source: file://test_ops.lua
    method: find_event_by_external
    modules: [sql, json, security]
    imports:
      threads_writer: kickside.core.threads.persist:writer
      threads_reader: kickside.core.threads.persist:reader
      threads_env: kickside.core.threads:env

  - name: endpoint_resolver_test_write
    kind: function.lua
    meta:
      comment: Test helper — calls endpoint_resolver.write inside a funcs:call frame so the thread branch inherits the call actor.
    source: file://endpoint_resolver_test_ops.lua
    method: write
    imports:
      endpoint_resolver: kickside.core.threads:endpoint_resolver

  # The gate runs inside HTTP handlers (they read http.request), so the suite
  # cannot drive the endpoints as plain funcs; this wrapper exposes the gate as a
  # value-returning func a scoped test runner invokes under an actor. meta.type
  # test_helper keeps it out of the suite run.
  - name: test_register_projection
    kind: function.lua
    meta:
      type: test_helper
      comment: Test wrapper over the projection registration request of POST /threads/{id}/projections.
    source: file://test_register_projection.lua
    method: register
    imports:
      register_projection_request: kickside.core.projections.api:register_projection_request

  - name: threads_test_event_kind
    kind: contract.binding
    meta:
      comment: Test-only thread kind that explicitly permits Core Threads integration test event types.
      events:
        input:
          - type: app:threads_test_other
          - type: app:threads_knowledge_denied
          - type: app:threads_ws_trigger
          - type: app:threads_keep
          - type: app:threads_skip
          - type: app:threads_resolver
        output:
          - type: app:threads_test_external
          - type: app:threads_knowledge_created
          - type: app:threads_knowledge_emitted
          - type: app:threads_note
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status

  - name: threads_empty_source_kind
    kind: contract.binding
    meta:
      thread: { class: test.empty.source }
      events:
        input: []
        output:
          - type: app:threads_test_external
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status

  - name: threads_empty_invalid_projection_kind
    kind: contract.binding
    meta:
      thread: { class: test.empty.invalid.projection }
      projections:
        - kind: test.invalid.initialization
          worker_ref: "invalid://worker"
      events:
        input: []
        output:
          - type: app:threads_test_external
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status

  - name: test_gate
    kind: function.lua
    meta:
      type: test_helper
      comment: Test wrapper over thread_access.gate_thread_access.
    source: file://test_gate.lua
    method: gate
    modules: [sql]
    imports:
      thread_access: kickside.core.threads.api:thread_access

  # A registered function.lua used as a func:// projection worker by the worker
  # and catch-up suites. It counts the events it sees and returns a body patch.
  - name: test_count_worker
    kind: function.lua
    meta:
      type: projection.worker
      title: Test Count Worker
      comment: Test-only projection worker; counts events into the projection body.
    source: file://test_count_worker.lua
    method: run
    modules:
      - json
      - sql

  # A func:// projection worker that fails with its declared kind and message.
  - name: test_failing_worker
    kind: function.lua
    meta:
      type: projection.worker
      title: Test Failing Worker
      comment: Test-only projection worker; fails with the kind its worker_config declares.
    source: file://test_failing_worker.lua
    method: run

  # A registered process.lua used as a proc:// projection worker by the runner
  # suite so a proc worker_ref resolves through worker.validate.
  - name: test_proc_worker
    kind: process.lua
    meta:
      type: projection.worker
      title: Test Proc Worker
      comment: Test-only proc:// projection worker; counts events into the projection body.
    source: file://test_proc_worker.lua
    method: run
    modules:
      - json
      - security

  - name: test_refusing_proc_worker
    kind: process.lua
    meta:
      type: projection.worker
      title: Test Refusing Proc Worker
    source: file://test_refusing_proc_worker.lua
    method: run

  - name: test_private_projection_worker
    kind: function.lua
    meta:
      type: projection.worker
      private: true
    source: file://test_count_worker.lua
    method: run
    modules: [json, sql]

  - name: test_actor_projection_worker
    kind: function.lua
    meta:
      type: projection.worker
    source: file://test_count_worker.lua
    method: run
    security:
      actor: { id: "system:projection-test" }
    modules: [json, sql]

  - name: test_scoped_projection_worker
    kind: function.lua
    meta:
      type: projection.worker
    source: file://test_count_worker.lua
    method: run
    security:
      policies: [app:test_scope_policy]
    modules: [json, sql]

  - name: test_private_proc_projection_worker
    kind: process.lua
    meta:
      type: projection.worker
      private: true
    source: file://test_proc_worker.lua
    method: run
    modules: [json, security]

  # Diagnostic pair for the execution-identity call boundary. The process
  # reconstructs a persisted actor row and calls a function through run_as;
  # the function returns selected nested argument fields to the parent suite.
  - name: test_execution_identity_arg_echo
    kind: function.lua
    meta:
      type: test_helper
      comment: Returns nested run_as arguments for the proc-boundary regression test.
    source: file://test_execution_identity_arg_echo.lua
    method: echo

  - name: test_execution_identity_run_as_proc
    kind: process.lua
    meta:
      type: test_helper
      comment: Calls execution_identity.run_as from a real proc context using a stored actor row.
    source: file://test_execution_identity_run_as_proc.lua
    method: run
    imports:
      execution_identity: kickside.execution:execution_identity

  - name: test_sleep_proc
    kind: process.lua
    meta:
      type: test_helper
      title: Test Sleep Proc Worker
      comment: Test-only proc:// projection worker that sleeps a configurable interval; exercises the supervised spawn/terminate path.
    source: file://test_sleep_proc.lua
    method: run
    modules:
      - time

  # The jobs worker_ref fixtures (generic_job_target / job_sleep_proc) and the
  # jobs config env-variable fixtures (KICKSIDE_CORE_JOB_TEST_* / worker-count
  # overrides) moved to the kickside/jobs test harness with the jobs suites.

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server.
    # An ephemeral port: harnesses of concurrent suite runs never collide on a
    # fixed port, whose failed bind would stall this runtime's service starts.
    addr: :0
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      comment: Test API router.
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive scope for core tests (grants db access to the test actor).
    groups:
      - core_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: test_scope_policy
    kind: security.policy
    meta:
      comment: Permissive scope the threads + component suites run their scoped actors under.
    groups:
      - core_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: test_constrained_writer_policy
    kind: security.policy
    meta:
      comment: Runtime scope without process messaging authority; component writes under it notify owning services through their own identities.
    policy:
      resources: '*'
      actions: [funcs.call, funcs.security, contract.get, contract.open, contract.call, contract.security, db.get, registry.get, registry.find, env.get]
      effect: allow

  # The core + component packages are mounted through workspace replacements, so
  # their ns.requirement defaults (app:db / app:processes / app:api) resolve against
  # the harness resources above without a second dependency wiring layer.

  - name: scope_resolver_stub
    kind: function.lua
    meta:
      comment: Test-only kickside.contract:scope_resolver implementation for core actors.
    source: file://scope_resolver_stub.lua
    modules: [security, sql]
    method: resolve
    imports:
      execution_identity: kickside.execution:execution_identity

  - name: scope_resolver_binding
    kind: contract.binding
    meta:
      comment: Core harness resolver; production binds this in kickside/users.
    contracts:
      - contract: kickside.contract:scope_resolver
        default: true
        methods:
          resolve: app:scope_resolver_stub

  - name: provision_declarations
    kind: function.lua
    source: file://provision_test.lua
    method: declarations
    modules: [process, time, channel, sql, uuid, security, contract, json, funcs]
    imports:
      test: wippy.test:test
      provision: kickside.core.threads:provision
      autoinit: kickside.component:autoinit

  - name: provision_kind_read_deny
    kind: security.policy
    policy:
      resources: app:provision_test_decl
      actions: registry.get
      effect: deny

  - name: provision_test_decl
    kind: contract.binding
    meta:
      title: Test Workspace
      icon: tabler:test-pipe
      class:
        - test_ws
      provision:
        scope: user
      projections:
        - kind: test.count
          worker_ref: "func://app:test_count_worker"
      retention:
        event_days: 7
      events:
        input:
          - type: app:threads_ws_trigger
        output:
          - type: app:threads_ws_changed
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status

  # An on-demand kind (no meta.provision) that owns a primary thread: the shape
  # converge walks. Its thread class lives ONLY here — creation and convergence
  # both read it, so a drifting duplicate cannot exist.
  # A kind that declares projections but no primary thread: its threads come from
  # other flows, so convergence registers projections and never invents a class.
  - name: converge_test_projonly
    kind: contract.binding
    meta:
      title: Test Projection-Only Kind
      class:
        - test_projonly
      projections:
        - kind: test.projonly
          worker_ref: "func://app:test_count_worker"
      events:
        input:
          - type: app:threads_po_trigger
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status

  - name: converge_test_decl
    kind: contract.binding
    meta:
      title: Test Converge Kind
      class:
        - test_converge
      thread:
        class: test.converge.thread
      projections:
        - kind: test.converge
          worker_ref: "func://app:test_count_worker"
      events:
        input:
          - type: app:threads_cv_trigger
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status

  - name: provision_system_test_decl
    kind: contract.binding
    meta:
      title: Test System Lifecycle
      class:
        - test_sys
      provision:
        scope: system
        grants:
          - subject_id: app.security:admin
            subject_type: group
            access_mask: 1
          - subject_id: app.security:user
            subject_type: group
            access_mask: 2
      projections:
        - kind: test.reap
          worker_ref: "func://app:test_count_worker"
      events:
        input:
          - type: app:threads_sys_reap
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status

  - name: provision_test
    kind: function.lua
    meta:
      title: Threads Provision
      type: test
      suite: kickside_core
      group: KickSide Core / Threads
      comment: autoinit materialization — component+thread+projection+retention, idempotent.
    source: file://provision_test.lua
    method: run
    modules:
      - process
      - time
      - channel
      - sql
      - uuid
      - security
      - contract
      - json
      - funcs
    imports:
      test: wippy.test:test
      provision: kickside.core.threads:provision
      autoinit: kickside.component:autoinit

  - name: dep.wippy.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Bootloader configuration for testing.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  - name: dep.kickside.core
    version: '*'
    kind: ns.dependency
    meta:
      comment: Core mounted as a root so mandatory host requirements are exercised.
    component: kickside/core
    parameters:
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:admin
        subject_type: group
        access_mask: 11
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user

  - name: dep.kickside.component
    version: '*'
    kind: ns.dependency
    component: kickside/component
    parameters:
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl

  - name: dep.kickside.jobs
    version: '*'
    kind: ns.dependency
    component: kickside/jobs
    parameters:
