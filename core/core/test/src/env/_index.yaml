version: "1.0"
namespace: app.env

# Mirrors the real app's env storage id (app.env:store) so the slices' env
# knobs (env_db_id, env_proc_host, ...) resolve their default storage in
# isolation without relying on per-slice env_storage requirement injection.
# Harness-only; excluded from publish.

entries:
  - name: store
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true
