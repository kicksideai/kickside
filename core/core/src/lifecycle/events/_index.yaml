version: "1.0"
namespace: kickside.lifecycle.events

# Event-type entries for the system lifecycle thread. Both are audit events with
# no port; schema from the shared emit site.
entries:
  - name: principal.deleted
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        subject_id: { type: string }
        principal_kind: { enum: [user, group, service] }
      required: [subject_id]

  - name: component.deleted
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        subject_id: { type: string }
        incarnation: { type: string }
      required: [subject_id]
