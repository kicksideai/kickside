version: '1.0'
namespace: kickside.core.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Core
    surface: kickside.core
    intent: module_access
    includes:
    - kickside.core.security:module_runtime
    - kickside.core.threads:user_workspace_spawn
    - kickside.core.security:core_endpoint_access
  groups: []
  policy:
    resources:
    - kickside.core:*
    - kickside.core.lifecycle:*
    - kickside.core.migrations:*
    - kickside.core.projections:*
    - kickside.core.projections.api:*
    - kickside.core.projections.persist:*
    - kickside.core.provenance:*
    - kickside.core.retention:*
    - kickside.core.retention.api:*
    - kickside.core.retention.persist:*
    - kickside.core.retention.service:*
    - kickside.core.security:*
    - kickside.core.threads:*
    - kickside.core.threads.api:*
    - kickside.core.threads.persist:*
    - kickside.lifecycle.events:*
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: core_endpoint_access
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.core.retention.api:get_thread_retention.endpoint
    - kickside.core.retention.api:upsert_thread_retention.endpoint
    - kickside.core.threads.api:create_thread.endpoint
    - kickside.core.threads.api:delete_thread.endpoint
    - kickside.core.threads.api:get_graph.endpoint
    - kickside.core.threads.api:get_thread.endpoint
    - kickside.core.threads.api:ingest_events_batch.endpoint
    - kickside.core.threads.api:list_children.endpoint
    - kickside.core.threads.api:list_classes.endpoint
    - kickside.core.threads.api:list_events.endpoint
    - kickside.core.threads.api:list_job_runs.endpoint
    - kickside.core.threads.api:list_jobs.endpoint
    - kickside.core.threads.api:list_threads.endpoint
    - kickside.core.threads.api:post_event.endpoint
    - kickside.core.threads.api:post_message.endpoint
    - kickside.core.threads.api:update_thread.endpoint
    actions: access
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.core:*
    - kickside.core.lifecycle:*
    - kickside.core.migrations:*
    - kickside.core.projections:*
    - kickside.core.projections.api:*
    - kickside.core.projections.persist:*
    - kickside.core.provenance:*
    - kickside.core.retention:*
    - kickside.core.retention.api:*
    - kickside.core.retention.persist:*
    - kickside.core.retention.service:*
    - kickside.core.security:*
    - kickside.core.threads:*
    - kickside.core.threads.api:*
    - kickside.core.threads.persist:*
    - kickside.lifecycle.events:*
    actions:
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application group with member access to this module.
  targets:
  - entry: kickside.core.security:module_access
    path: .groups +=
  - entry: kickside.core.security:module_runtime
    path: .groups +=
  - entry: kickside.core.threads:user_workspace_spawn
    path: .groups +=
  - entry: kickside.core.security:core_endpoint_access
    path: .groups +=
