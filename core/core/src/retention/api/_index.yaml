version: "1.0"
namespace: kickside.core.retention.api

entries:
  # Per-thread retention policy endpoints. The router (+ scope on the mutating
  # endpoint) is injected by the slice's api_router / security_scope requirements
  # (declared in ../_index.yaml), so the host wires them without a central edit.

  - name: get_thread_retention
    kind: function.lua
    meta:
      comment: GET handler — a thread's policy or the enforced defaults.
    source: file://get_thread_retention.lua
    method: handler
    modules:
      - http
      - sql
    imports:
      error_envelope: kickside.contract:error_envelope
      http_errors: kickside.contract:http_errors
      core_db: kickside.core:db
      repo: kickside.core.retention.persist:repo
      ret_consts: kickside.core.retention:consts
      thread_access: kickside.core.threads.api:thread_access

  - name: get_thread_retention.endpoint
    kind: http.endpoint
    meta:
      comment: GET /threads/{id}/retention. Router injected by api_router requirement.
    method: GET
    path: /threads/{id}/retention
    func: get_thread_retention

  - name: upsert_thread_retention
    kind: function.lua
    meta:
      comment: PUT handler — validate + persist a thread's policy.
    source: file://upsert_thread_retention.lua
    method: handler
    modules:
      - http
      - json
      - sql
    imports:
      error_envelope: kickside.contract:error_envelope
      http_errors: kickside.contract:http_errors
      core_db: kickside.core:db
      repo: kickside.core.retention.persist:repo
      thread_access: kickside.core.threads.api:thread_access

  - name: upsert_thread_retention.endpoint
    kind: http.endpoint
    meta:
      comment: PUT /threads/{id}/retention. Router + scope injected by requirements.
    method: PUT
    path: /threads/{id}/retention
    func: upsert_thread_retention
