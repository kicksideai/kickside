version: "1.0"
namespace: app

# Standalone harness for the kickside/jobs module. Explicitly maps the module's
# host requirements and mounts kickside/core so the jobs suites drive the real
# projection/thread/catch-up stack. Provides env storage + bootloader so
# the modules boot, run their migrations, and execute harness-owned suites in
# isolation. Excluded from publish (see wippy.yaml).

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    component: wippy/test
    version: "*"

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: Jobs suite database; a per-run file the harness names through vars.sqlite_path (.wippy.yaml), so the migrated schema survives the registry version changes these suites apply.
    file: "${sqlite_path}"

  - name: private_queue_attempt_budget_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_claim_fence_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_claim_selection_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_concurrency_claim_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_concurrency_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_execute_job_routing_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_heartbeat_reclaim_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_claim_sequence_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_run_history_reclaim_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_idle_report_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_pool_registration_and_timers_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_proc_supervision_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_termination_recovery_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_transitions_revocation_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_worker_recycle_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: private_queue_worker_supervision_test
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: queue_isolation_a
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: queue_isolation_b
    kind: db.sql.sqlite
    foreign_keys: true
    file: ":memory:"

  - name: job_fixture
    kind: library.lua
    meta:
      comment: Own-row leasing on the shared queue and the private queue for claim-selection suites.
    source: file://job_fixture.lua
    modules: [sql, uuid, process]
    imports:
      lifecycle: kickside.core.jobs.persist:lifecycle
      config: kickside.core.jobs:config
      wake: kickside.core.jobs.persist:wake

  - name: worker_db_scaffold
    kind: library.lua
    meta:
      comment: Shared DB and enqueue helpers for the worker suites.
    source: file://suites/service/worker_parts/worker_db_scaffold.lua
    modules: [sql, uuid]
    imports:
      job_fixture: app:job_fixture

  - name: uploads
    kind: fs.directory
    meta:
      comment: Harness-owned temporary filesystem for jobs tests.
    directory: ./.wippy/uploads
    auto_init: true

  # ─── Projection worker fixtures ──────────────────────────────────────
  # func:// and proc:// projection workers the scheduler dispatch/reclaim suites
  # register cursors against (the proc worker only has to resolve through
  # worker.validate; the scheduler excludes it from inline dispatch).
  - name: test_count_worker
    kind: function.lua
    meta:
      type: projection.worker
      title: Test Count Worker
      comment: Test-only projection worker; counts events into the projection body.
    source: file://test_count_worker.lua
    method: run
    modules:
      - json

  - name: test_proc_worker
    kind: process.lua
    meta:
      type: projection.worker
      title: Test Proc Worker
      comment: Test-only proc:// projection worker; counts events into the projection body.
    source: file://test_proc_worker.lua
    method: run
    modules:
      - json
      - security

  # ─── Job worker fixtures ─────────────────────────────────────────────
  # func:// and proc:// worker_ref targets driven by jobs.service's worker_test
  # for dispatch coverage.
  - name: generic_job_target
    kind: function.lua
    meta:
      comment: Test-only generic worker_ref target for jobs.worker dispatch coverage.
      options:
        retry:
          max_attempts: 3
          initial_delay: 1
          jitter: 0
    source: file://generic_job_target.lua
    method: run
    modules:
      - security
      - time
      - channel
      - sql
      - json

    imports:
      jobs: kickside.core.jobs:jobs
      lifecycle: kickside.core.jobs.persist:lifecycle
      threads_writer: kickside.core.threads.persist:writer
      retention_notifier: kickside.core.retention:notifier

  - name: concurrency_probe
    kind: process.lua
    meta:
      comment: Concurrent enqueue and batch-claim test requester.
    source: file://concurrency_probe.lua
    method: run
    modules:
      - sql
      - uuid
    imports:
      jobs: kickside.core.jobs:jobs
      claim: kickside.core.jobs.persist:claim

  - name: job_sleep_proc
    kind: process.lua
    meta:
      type: test_helper
      comment: Test-only proc:// worker that sleeps a configurable interval; exercises the supervised spawn/terminate path.
    source: file://job_sleep_proc.lua
    method: run
    modules:
      - time
      - channel
      - process
    imports:
      job_types: kickside.core.jobs:types

  - name: job_crash_probe
    kind: process.lua
    meta:
      type: test_helper
      comment: Marks its first attempt before the harness kills the execution child.
    source: file://job_crash_probe.lua
    method: run
    modules: [sql, process]
    imports:
      job_types: kickside.core.jobs:types

  - name: jobs_service_probe_loop
    kind: process.lua
    meta:
      type: test_helper
      comment: Records its service PID and runs the real jobs worker pool root for restart evidence.
    source: file://jobs_service_probe_loop.lua
    method: run
    modules: [sql, uuid, process, registry, logger, time, channel, events]
    imports:
      worker_pool: kickside.core.jobs.service:worker_pool

  - name: awaited_job_probe
    kind: function.lua
    meta:
      type: test_helper
      job_class: awaited
      comment: A job other jobs wait on; its declared class reserves its worker capacity.
    source: file://awaited_job_probe.lua
    method: run

  - name: awaiting_job_probe
    kind: function.lua
    meta:
      type: test_helper
      comment: Holds its worker until the awaited job it names is done, like a synchronous projection consumer.
    source: file://awaiting_job_probe.lua
    method: run
    modules: [sql, time]

  - name: jobs_cancelled_loop
    kind: process.lua
    meta:
      type: test_helper
      comment: Cancels itself before entering the real worker loop to exercise startup drain ordering.
    source: file://jobs_cancelled_loop.lua
    method: run
    modules: [process]
    imports:
      worker: kickside.core.jobs.service:loop

  - name: jobs_pool_root
    kind: process.lua
    meta:
      type: test_helper
      comment: Runs the real jobs worker pool root under a test-owned process.service.
    source: file://jobs_pool_root.lua
    method: run
    modules: [sql, process, registry, logger, time, channel, events]
    imports:
      worker_pool: kickside.core.jobs.service:worker_pool

  - name: live_job_probe
    kind: function.lua
    meta:
      type: test_helper
      comment: Reports the real claiming worker to its waiting test process.
    source: file://live_job_probe.lua
    method: run
    modules: [sql, process, channel, time]

  - name: jobs_pool_subscription_probe
    kind: process.lua
    meta:
      type: test_helper
      comment: Fails pool registry subscription so the service restart is observable.
    source: file://jobs_pool_subscription_probe.lua
    method: run
    modules: [sql, uuid, process, channel, time]
    imports:
      worker_pool: kickside.core.jobs.service:worker_pool

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  # ─── Host resources ──────────────────────────────────────────────────
  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server.
    # An ephemeral port: harnesses of concurrent suite runs never collide on a
    # fixed port, whose failed bind would stall this runtime's service starts.
    addr: :0
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      comment: Test API router.
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive scope for jobs tests (grants db access to the test actor).
    groups:
      - core_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: test_scope_policy
    kind: security.policy
    meta:
      comment: Permissive scope the projection/catch-up suites run their scoped actors under.
    groups:
      - core_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # ─── Scope resolver ──────────────────────────────────────────────────
  # kickside/core binds no default scope_resolver (production binds it in
  # kickside/users); the harness provides a permissive stub so core actors resolve.
  - name: scope_resolver_stub
    kind: function.lua
    meta:
      comment: Test-only kickside.contract:scope_resolver implementation for core actors.
    source: file://scope_resolver_stub.lua
    modules: [security]
    method: resolve

  - name: scope_resolver_binding
    kind: contract.binding
    meta:
      comment: Jobs harness resolver; production binds this in kickside/users.
    contracts:
      - contract: kickside.contract:scope_resolver
        default: true
        methods:
          resolve: app:scope_resolver_stub

  # kickside/jobs loads once through the dependency replacement; the mappings above
  # are owned by this harness rather than leaking test resource ids into the package.

  - name: dep.wippy.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Bootloader configuration for testing.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  - name: dep.kickside.jobs
    version: '*'
    kind: ns.dependency
    meta:
      comment: Jobs mounted as a root so its mandatory host requirements are exercised.
    component: kickside/jobs
    parameters:
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.jobs:process_host
      value: app:processes

  - name: dep.kickside.core
    version: '*'
    kind: ns.dependency
    component: kickside/core
    parameters:
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 3
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user

  - name: dep.kickside.component
    version: '*'
    kind: ns.dependency
    component: kickside/component
    parameters:
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl

  - name: dep.wippy.migration
    version: "*"
    kind: ns.dependency
    component: wippy/migration
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  # Harness-owned tests copied from the production module.
  - name: packaging_test
    kind: function.lua
    meta:
      title: Jobs Packaging Mount
      type: test
      suite: kickside_core
      group: KickSide Core / Packaging
      comment: jobs src entries resolve under injected requirements; the worker is the single owner, no phantom factory, the loop process exists.
    source: file://suites/packaging_test.lua
    method: run
    modules:
      - registry
    imports:
      test: wippy.test:test
      config: kickside.core.jobs:config

  # Durable leased-job engine, split into layers: the persistence primitives
  # (claim/lease/lifecycle, effect-intent executors) live under
  # kickside.core.jobs.persist; the worker process + its supervised service live
  # under kickside.core.jobs.service. This root keeps only the shared vocabulary
  # both layers read — the state machines, the env-tunable knobs, and the entity
  # shapes.

  # ─── Libraries ───────────────────────────────────────────────────────
  - name: config_test
    kind: function.lua
    meta:
      title: Job Config
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: The kickside.core.jobs:policy shape, its validation and the loaded runtime values.
    source: file://suites/config_test.lua
    method: run
    modules:
      - registry
    imports:
      test: wippy.test:test
      config: kickside.core.jobs:config

  - name: jobs_signal_constrained
    kind: security.policy
    meta:
      comment: Runtime scope without process messaging authority, as a group principal holds; Jobs signals reach their recipients through Jobs identities.
    policy:
      resources: '*'
      actions: [funcs.call, funcs.security, registry.get, registry.find, env.get, db.get]
      effect: allow

  - name: jobs_signal_probe
    kind: function.lua
    meta:
      type: test_helper
      comment: Publishes one lease release or execution revocation in the caller's frame.
    source: file://jobs_signal_probe.lua
    method: run
    imports:
      lease_release: kickside.core.jobs:lease_release
      proc_supervisor: kickside.core.jobs:proc_supervisor

  - name: service_signal_test
    kind: function.lua
    meta:
      title: Jobs Service Signals
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Lease releases and execution revocations reach their recipients from a principal without process messaging authority.
    source: file://suites/service_signal_test.lua
    method: run
    modules: [uuid, security, funcs, process, channel, time]
    imports:
      test: wippy.test:test
      lease_release: kickside.core.jobs:lease_release
      proc_supervisor: kickside.core.jobs:proc_supervisor

  - name: delivery_notification_test
    kind: function.lua
    meta:
      title: Job Delivery Notifications
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Pool notices after durable transition commits and cross-owner migration order.
    source: file://suites/persist/delivery_notification_test.lua
    method: run
    modules:
      - sql
      - uuid
      - time
      - process
      - channel
      - registry
    imports:
      test: wippy.test:test
      job_types: kickside.core.jobs:types
      config: kickside.core.jobs:config
      lifecycle: kickside.core.jobs.persist:lifecycle
      jobs: kickside.core.jobs:jobs

  - name: wake_clock_test
    kind: function.lua
    meta:
      title: Job Wake Clock
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Control wakes store an absolute instant under a non-UTC PostgreSQL session.
    source: file://suites/persist/wake_clock_test.lua
    method: run
    modules: [sql, uuid]
    imports:
      test: wippy.test:test
      wake: kickside.core.jobs.persist:wake

  - name: wake_recovery_test
    kind: function.lua
    meta:
      title: Job Wake Recovery
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Reclaim a crashed continuation without losing fan-out demand.
    source: file://suites/persist/wake_recovery_test.lua
    method: run
    modules: [sql, uuid, process, channel, time]
    imports:
      test: wippy.test:test
      row_bytes: kickside.core.jobs.persist:row_bytes
      jobs: kickside.core.jobs:jobs
      lifecycle: kickside.core.jobs.persist:lifecycle
      reclaim: kickside.core.jobs.persist:reclaim
      wake: kickside.core.jobs.persist:wake
      config: kickside.core.jobs:config
      job_fixture: app:job_fixture

  - name: lease_test
    kind: function.lua
    meta:
      title: Job Lease
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Lease extend for the owner, lost-lease guard, start arg validation.
    source: file://suites/persist/lease_test.lua
    method: run
    modules:
      - sql
      - uuid
    imports:
      test: wippy.test:test
      lease: kickside.core.jobs.persist:lease_heartbeat
      lifecycle: kickside.core.jobs.persist:lifecycle
      job_fixture: app:job_fixture
      config: kickside.core.jobs:config
  - name: worker_pulse_test
    kind: function.lua
    meta:
      title: Job Worker Heartbeat Isolation
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Heartbeat writes do not wait on the worker's job marker.
    source: file://suites/service/worker_pulse_test.lua
    method: run
    modules: [sql, uuid]
    imports:
      test: wippy.test:test
      worker_heartbeat: kickside.core.jobs.service:worker_heartbeat
  - name: worker_recycle_test
    kind: function.lua
    meta:
      title: Job Worker Recycle Fences
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Registry-version notices and immediate fenced release of unstarted assignments.
    source: file://suites/service/worker_recycle_test.lua
    method: run
    modules: [sql, uuid, process]
    imports:
      test: wippy.test:test
      job_types: kickside.core.jobs:types
      claim: kickside.core.jobs.persist:claim
      claim_execution: kickside.core.jobs.persist:claim_execution
      lifecycle: kickside.core.jobs.persist:lifecycle
      worker_pool: kickside.core.jobs.service:worker_pool
      job_fixture: app:job_fixture
  - name: worker_pool_drain_test
    kind: function.lua
    meta:
      title: Job Pool Drain Ordering
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Confirms active and retired loop exits before closing the pool or upgrading its code.
    source: file://suites/service/worker_pool_drain_test.lua
    method: run
    modules: [sql, process]
    imports:
      test: wippy.test:test
      worker_pool: kickside.core.jobs.service:worker_pool
      job_fixture: app:job_fixture

  - name: worker_pool_version_test
    kind: function.lua
    meta:
      title: Job Pool Registry Version Handoff
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Preserves new-version idle slots across registry commit ordering.
    source: file://suites/service/worker_pool_version_test.lua
    method: run
    modules: [sql, process]
    imports:
      test: wippy.test:test
      worker_pool: kickside.core.jobs.service:worker_pool

  - name: awaited_capacity_test
    kind: function.lua
    meta:
      title: Job Pool Awaited Capacity
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: An awaited job runs while every general slot is held by a job waiting on it.
    source: file://suites/service/awaited_capacity_test.lua
    method: run
    modules: [sql, uuid, time, registry]
    imports:
      test: wippy.test:test
      config: kickside.core.jobs:config
      jobs: kickside.core.jobs:jobs

  - name: worker_pool_claim_test
    kind: function.lua
    meta:
      title: Job Pool Claim Failures
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Marker conflicts retire their slot; other claim failures retry on backoff.
    source: file://suites/service/worker_pool_claim_test.lua
    method: run
    modules: [sql, process, time, uuid, events, channel, logger]
    imports:
      test: wippy.test:test
      worker_pool: kickside.core.jobs.service:worker_pool
      job_fixture: app:job_fixture
      clock: kickside.core.jobs:clock
      claim: kickside.core.jobs.persist:claim
      lifecycle: kickside.core.jobs.persist:lifecycle

  - name: idle_report_test
    kind: function.lua
    meta:
      title: Job Assignment Epoch Fences
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Stale idle notices and repeat claims cannot overwrite a live assignment.
    source: file://suites/service/idle_report_test.lua
    method: run
    modules: [sql, uuid, process]
    imports:
      test: wippy.test:test
      worker_pool: kickside.core.jobs.service:worker_pool
      lifecycle: kickside.core.jobs.persist:lifecycle
      lifecycle_cancel: kickside.core.jobs.persist:lifecycle_cancel
      claim: kickside.core.jobs.persist:claim
      reclaim: kickside.core.jobs.persist:reclaim
      job_fixture: app:job_fixture
      worker_fence: kickside.core.jobs.service:worker_fence

  - name: builtin_test
    kind: function.lua
    meta:
      title: Job Built-ins
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: The wake continuation through the supervised execution child.
    source: file://suites/service/builtin_test.lua
    method: run
    modules:
      - sql
      - uuid
    imports:
      test: wippy.test:test
      job_types: kickside.core.jobs:types
      lifecycle: kickside.core.jobs.persist:lifecycle
      worker_child: kickside.core.jobs.service:worker_child
      jobs: kickside.core.jobs:jobs
      wake: kickside.core.jobs.persist:wake
      job_fixture: app:job_fixture

  - name: deadline_clock_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
    source: file://suites/service/deadline_clock_test.lua
    method: run
    imports:
      test: wippy.test:test
      proc_supervisor: kickside.core.jobs:proc_supervisor

  - name: loop_test
    kind: function.lua
    meta:
      title: Job Loop Lifecycle
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Real loop exit, restart, and heartbeat refresh under supervision.
    source: file://suites/service/loop_test.lua
    method: run
    modules:
      - sql
      - uuid
      - time
      - process
      - channel
      - registry
      - events
      - logger
    imports:
      test: wippy.test:test
      job_types: kickside.core.jobs:types
      reclaim: kickside.core.jobs.persist:reclaim
      lifecycle: kickside.core.jobs.persist:lifecycle
      worker_child: kickside.core.jobs.service:worker_child
      worker_heartbeat: kickside.core.jobs.service:worker_heartbeat
      job_fixture: app:job_fixture
      jobs: kickside.core.jobs:jobs

  - name: recovery_test
    kind: function.lua
    meta:
      title: Job Continuation Recovery
      type: test
      timeout: 120s
      suite: kickside_core
      group: KickSide Core / Jobs
      comment: Crash inside the continuation transaction and mixed retained paths.
    source: file://suites/persist/recovery_test.lua
    method: run
    modules:
      - sql
      - uuid
      - time
    imports:
      test: wippy.test:test
      jobs: kickside.core.jobs:jobs
      lifecycle: kickside.core.jobs.persist:lifecycle
      wake: kickside.core.jobs.persist:wake
      job_types: kickside.core.jobs:types
      threads_writer: kickside.core.threads.persist:writer
      retention_notifier: kickside.core.retention:notifier
