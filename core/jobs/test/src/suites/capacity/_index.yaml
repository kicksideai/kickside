    modules: [sql, uuid]
    imports:
      test: wippy.test:test
      lifecycle: kickside.core.jobs.persist:lifecycle
      claim: kickside.core.jobs.persist:claim
      job_fixture: app:job_fixture

  - name: restart_test
    kind: function.lua
