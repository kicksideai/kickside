version: "1.0"
namespace: app

entries:
  - name: claim_fence_test
    kind: function.lua
    meta:
      title: Worker Claim Thread Fence
      type: test
      suite: kickside_core
      group: KickSide Core / Jobs
    source: file://claim_fence_test.lua
