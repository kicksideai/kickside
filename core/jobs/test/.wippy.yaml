version: "1.0"
logmanager:
  stream_to_events: true
  propagate_downstream: true
# The harness starts its own worker probes so ambient job claimers cannot
# race the claims and lifecycle transitions under test.
# The suites apply registry versions mid-run; the runtime reopens an in-memory
# SQLite resource on a registry version change, so the SQLite database is a
# per-run file named by the caller (--set vars.sqlite_path=<fresh file>).
override:
  "app:db:file": "${sqlite_path}"
  "kickside.core.jobs.service:worker.service:lifecycle.auto_start": false
  # The suites run Core retention sweeps themselves; a resident sweeper woken
  # by the retention notifier would prune the evidence they assert on first.
  "kickside.core.retention.service:sweeper.service:lifecycle.auto_start": false
  # A killed reservation owner can close the last SQLite connection; a file
  # keeps committed counters and schema available to its restarted process.
workspace:
  replacements:
    kickside/realtime-dispatch: ../../realtime-dispatch
    kickside/jobs: ..
    kickside/component: ../../component
    kickside/contract: ../../contract
    kickside/core: ../../core
    kickside/execution: ../../execution
vars:
  sqlite_path: ./.wippy/jobs-test.sqlite
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_jobs
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
