version: '1.0'
namespace: kickside.core.jobs.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Jobs
    surface: kickside.core.jobs
    intent: module_access
    includes:
    - kickside.core.jobs.security:module_runtime
    - kickside.core.jobs.security:jobs_endpoint_access
  groups: []
  policy:
    resources:
    - kickside.core.jobs:*
    - kickside.core.jobs.api:*
    - kickside.core.jobs.migrations:*
    - kickside.core.jobs.persist:*
    - kickside.core.jobs.security:*
    - kickside.core.jobs.service:*
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: jobs_endpoint_access
  kind: security.policy
  meta:
    private: true
    comment: Members receive Jobs runtime capabilities; this module declares no member
      endpoints.
  groups: []
  policy:
    resources:
    - kickside.core.jobs:*
    - kickside.core.jobs.api:*
    - kickside.core.jobs.migrations:*
    - kickside.core.jobs.persist:*
    - kickside.core.jobs.security:*
    - kickside.core.jobs.service:*
    actions:
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.core.jobs:*
    - kickside.core.jobs.api:*
    - kickside.core.jobs.migrations:*
    - kickside.core.jobs.persist:*
    - kickside.core.jobs.security:*
    - kickside.core.jobs.service:*
    actions:
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application group with member access to this module.
  targets:
  - entry: kickside.core.jobs.security:module_access
    path: .groups +=
  - entry: kickside.core.jobs.security:jobs_endpoint_access
    path: .groups +=
  - entry: kickside.core.jobs.security:module_runtime
    path: .groups +=
