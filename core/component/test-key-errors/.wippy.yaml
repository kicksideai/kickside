version: '1.0'
override:
  kickside.component:encryption_key:default: app:secret_test_key
  kickside.core.jobs.service:worker.service:lifecycle.auto_start: false
  app:db:file: ${sqlite_path}
workspace:
  replacements:
    kickside/realtime-dispatch: ../../realtime-dispatch
    kickside/component: ..
    kickside/jobs: ../../jobs
    kickside/contract: ../../contract
    kickside/execution: ../../execution
vars:
  sqlite_path: ':memory:'
  pg_host: localhost
  pg_port: 5433
  pg_metadata_migration_database: kickside_test_component_metadata_migration
  pg_database: kickside_test_component
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
