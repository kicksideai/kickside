version: "1.0"
namespace: app

# Standalone test harness for the component module. Provides db / processes /
# bootloader so the module boots and runs its migrations in isolation. Excluded
# from publish (see wippy.yaml exclude: app:**).

entries:
  - name: owned_identity_selection_probe
    kind: function.lua
    source: file://owned_identity_selection_probe.lua
    method: run
    modules: [sql]
    imports:
      context_ops: kickside.component.persist:context_ops
      ops: kickside.component.persist:component_ops

  - name: identity_selection_probe
    kind: function.lua
    source: file://identity_selection_probe.lua
    method: run
    imports:
      component_command: kickside.component:component_command

  - name: identity_selection_resolver
    kind: function.lua
    source: file://identity_selection_resolver.lua
    method: resolve

  - name: identity_selection_binding
    kind: contract.binding
    contracts:
      - contract: kickside.contract:scope_resolver
        default: true
        methods: {resolve: app:identity_selection_resolver}

  - name: dep.wippy.test
    kind: ns.dependency
    component: wippy/test
    version: "*"

  - name: lifecycle_seam_test
    kind: function.lua
    meta:
      type: test
      suite: component_packaging
    source: file://lifecycle_seam_test.lua
    method: run
    modules: [registry, process, channel, contract, security, uuid]
    imports:
      test: wippy.test:test
      component_lifecycle: kickside.component:component_lifecycle
      lifecycle_stub: app:component_lifecycle_test_impl
      unwired: kickside.component:component_lifecycle_unwired

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: In-memory database for component tests
    file: "${sqlite_path}"

  - name: repo_root
    kind: fs.directory
    meta:
      comment: Repo tree root, so the trusted-read guard suite can scan module .lua sources for calls into the component trusted-read tier.
    directory: ../../..

  - name: trusted_read_guard_test
    kind: function.lua
    meta:
      title: Trusted Read Guard
      type: test
      suite: component_trusted_read_guard
      timeout: "120s"
      group: Components
      comment: Enumerates every module-qualified call into the component trusted-read tier (list_system/open_private/list_for_subject/get_private_context/system_delete/resolve_path_prefixes) and requires each caller site to be explicitly allowlisted with an exact count.
    source: file://trusted_read_guard_test.lua
    method: run
    modules:
      - fs
    imports:
      test: wippy.test:test
      allowlist: app:trusted_read_allowlist

  - name: trusted_read_allowlist
    kind: library.lua
    meta:
      comment: Explicit roster of every module-qualified call site into the component trusted-read tier, keyed by repo-relative caller path and method with an exact declared count. Reaching for a trusted read means adding a line here.
    source: file://trusted_read_allowlist.lua

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server for the share endpoints.
    # An ephemeral port: harnesses of concurrent suite runs never collide on a
    # fixed port, whose failed bind would stall this runtime's service starts.
    addr: :0
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      comment: Test API router (app:api) the share endpoints attach to.
      server: gateway
    prefix: /api

  - name: test_scope_policy
    kind: security.policy
    meta:
      comment: Permissive scope for component tests (grants db access to the test actor; component access itself stays grant-based)
    groups:
      - component_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: restricted_base_policy
    kind: security.policy
    meta:
      comment: Grants db/runtime access to the restricted read-port test actor
    groups:
      - component_restricted
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: runtime_meta_base_policy
    kind: security.policy
    meta:
      comment: Runtime plumbing for a scoped runtime-meta writer; grants no component.runtime_meta.write.
    policy:
      resources: '*'
      actions:
        - contract.*
        - db.*
        - funcs.*
        - security.*
        - registry.*
        - env.*
      effect: allow

  - name: runtime_meta_connection_policy
    kind: security.policy
    meta:
      comment: Runtime-meta write scoped to connection components of one provider through component attributes.
    policy:
      resources: '*'
      actions: component.runtime_meta.write
      effect: allow
      conditions:
        - field: meta.class
          operator: eq
          value: connection
        - field: meta.provider
          operator: eq
          value: gateway-test
        - field: meta.region
          operator: eq
          value: trusted

  - name: runtime_meta_impl_policy
    kind: security.policy
    policy:
      resources: '*'
      actions: component.runtime_meta.write
      effect: allow
      conditions:
        - field: meta.impl_id
          operator: eq
          value: kickside.test:runtime_meta

  - name: deny_access_context_call_policy
    kind: security.policy
    meta:
      comment: Denies calling the component_service get_access_context method, so a client call to it fails at dispatch with a typed refusal.
    policy:
      resources: 'get_access_context'
      actions: 'contract.call'
      effect: deny

  - name: deny_access_context_by_meta_call_policy
    kind: security.policy
    meta:
      comment: Denies calling the component_service get_access_context_by_meta method, so a client call to it fails at dispatch with a typed refusal.
    policy:
      resources: 'get_access_context_by_meta'
      actions: 'contract.call'
      effect: deny

  - name: deny_service_open_policy
    kind: security.policy
    meta:
      comment: Denies opening the component_service binding, so the client fails to acquire the service with a typed refusal.
    policy:
      resources: 'kickside.component.binding:component_service_impl'
      actions: 'contract.open'
      effect: deny

  - name: deny_portable_registry_policy
    kind: security.policy
    meta:
      comment: Denies reading the portable test impl's registry entry, so an export or import lookup of it fails with a typed refusal.
    policy:
      resources: 'app:portable_impl'
      actions: 'registry.get'
      effect: deny

  - name: restricted_scope_policy
    kind: security.policy
    meta:
      comment: Denies the list-all capability on components so read-port widening is rejected for the non-privileged actor (deny takes precedence over the base allow)
    groups:
      - component_restricted
    policy:
      resources: 'kickside.component:components'
      actions: 'list_all'
      effect: deny

  # The component module loads directly via directories.src=../src so its tests
  # are included; its ns.requirement defaults (app:db / app:api) resolve against
  # the harness resources above without an explicit ns.dependency wiring here.

  - name: notify_access_realtime_binding
    kind: contract.binding
    meta:
      comment: Harness-local realtime implementation for component.notify_access contract-path coverage.
    contracts:
      - contract: kickside.contract:realtime_batch
        default: true
        methods:
          notify: app:notify_access_realtime_notify
      - contract: kickside.contract:realtime
        default: true
        methods:
          notify: app:notify_access_realtime_notify
          broadcast: app:notify_access_realtime_broadcast

  - name: notify_access_realtime_notify
    kind: function.lua
    meta:
      comment: Records targeted realtime notify calls for component.notify_access tests.
    source: file://notify_access_fake_realtime.lua
    method: notify
    modules:
      - sql
      - json
      - security

  - name: notify_access_realtime_broadcast
    kind: function.lua
    meta:
      comment: Fails if component.notify_access uses broadcast.
    source: file://notify_access_fake_realtime.lua
    method: broadcast
    modules:
      - sql
      - json
      - security

  - name: notify_access_constrained
    kind: security.policy
    meta:
      comment: Runtime scope of a group principal without process messaging or realtime authority; component fanout reaches the stored audience through the component policy.
    policy:
      resources: '*'
      actions: [funcs.call, funcs.security, contract.get, contract.open, contract.call, contract.security, db.get, registry.get, registry.find, env.get]
      effect: allow

  - name: notify_access_probe
    kind: function.lua
    meta:
      type: test_helper
      comment: Fans a component notification out in the caller's frame.
    source: file://notify_access_probe.lua
    method: run
    imports:
      component: kickside.component:component

  - name: notify_access_group_members_binding
    kind: contract.binding
    meta:
      comment: Harness-local group_members so component.notify_access group expansion is exercised.
    contracts:
      - contract: kickside.contract:group_members
        default: true
        methods:
          members: app:notify_access_group_members

  - name: notify_access_group_members
    kind: function.lua
    meta:
      comment: Returns the members the test seeded for a group (table-backed).
    source: file://notify_access_fake_group_members.lua
    method: members
    modules:
      - sql

  # A test-only component-kind binding carrying a provision block, which the
  # provisioner discovers via registry.find on contract.binding + meta.provision.
  # Harness declaration owner: confirms a pending set_execution_identity command whose id
  # starts with "owned-" for the operator and principal the SET names.
  - name: declaration_owner_stub
    kind: function.lua
    meta:
      comment: Confirms harness set_execution_identity commands named owned-* for automation-owned SET coverage.
    source: file://declaration_owner_stub.lua
    method: verify_identity_command

  - name: declaration_owner_binding
    kind: contract.binding
    meta:
      comment: Harness binding of the component declaration-owner contract.
    contracts:
      - contract: kickside.component:declaration_owner
        default: true
        methods:
          verify_identity_command: app:declaration_owner_stub

  - name: component_lifecycle_test_impl
    kind: library.lua
    source: file://component_lifecycle_stub.lua
    modules: [process]

  - name: portable_impl
    kind: registry.entry
    meta:
      comment: A component impl that declares a portable_schema, so export and import accept its components.
      portable_schema:
        context: true

  - name: autoinit_test_decl
    kind: contract.binding
    meta:
      title: Test Workspace
      class:
        - test_workspace
      provision:
        scope: user
      projections:
        - kind: test.lifecycle
          worker_ref: "func://app:test_autoinit_worker"
          on: child.lifecycle
          events:
            input:
              - type: kickside.component.events:created
              - type: kickside.component.events:updated
              - type: kickside.component.events:deleted
      retention:
        event_days: 30
        drain_aware: true
      events:
        input:
          - type: kickside.test.workspace.events:trigger
            schema:
              type: object
        output:
          - type: kickside.test.workspace.events:changed
            via: "func://app:test_autoinit_worker"
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: app:autoinit_test_status

  - name: autoinit_grants_test_decl
    kind: contract.binding
    meta:
      title: Grants Test Workspace
      class:
        - test_grants_workspace
      provision:
        scope: user
        grants:
          - subject_id: grants-user-1
            subject_type: user
            access_mask: 1
          - subject_id: grants-group-1
            subject_type: group
            access_mask: 2
          - subject_id: grants-typeless-1
            access_mask: 1
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: app:autoinit_test_status

  - name: autoinit_test_status
    kind: function.lua
    meta:
      comment: Harness get_status for the test component-kind binding (declaration-parsing coverage only).
    source: file://autoinit_test_status.lua
    method: get_status

  - name: autoinit_test
    kind: function.lua
    meta:
      title: Component Autoinit
      type: test
      suite: component_autoinit
      group: Components
      comment: per-actor autoinit provisioning + idempotency + declaration parsing.
    source: file://autoinit_test.lua
    method: run
    modules:
      - uuid
    imports:
      test: wippy.test:test
      autoinit: kickside.component:autoinit

  - name: autoinit_descriptor_decl
    kind: registry.entry
    meta:
      type: kickside.kb_engine
      thread:
        class: test.descriptor.thread

  - name: share_subject_test
    kind: function.lua
    meta:
      type: test
      suite: component_sharing
    source: file://share_subject_test.lua
    method: run
    imports:
      test: wippy.test:test
      share_subject: kickside.component:share_subject

  - name: share_directory_stub
    kind: function.lua
    source: file://share_directory_stub.lua
    method: resolve

  - name: share_directory_groups_stub
    kind: function.lua
    source: file://share_directory_stub.lua
    method: groups

  - name: share_directory_binding
    kind: contract.binding
    contracts:
      - contract: kickside.contract:directory
        default: true
        methods:
          search: app:share_directory_stub
          groups: app:share_directory_groups_stub
          resolve: app:share_directory_stub
          exists: app:share_directory_stub

  - name: user_endpoint_policy_test
    kind: function.lua
    meta:
      type: test
      suite: member_endpoint_policy
    source: file://user_endpoint_policy_test.lua
    method: run
    modules:
    - registry
    - security
    imports:
      test: wippy.test:test

  - name: dep.member_endpoint_contract
    kind: ns.dependency
    component: kickside/contract
    version: '*'
    parameters:
    - name: kickside.contract.http:user_security_scope
      value: app:user

  - name: runtime_meta_support
    kind: security.policy
    policy:
      resources: '*'
      actions: ['db.get', 'funcs.call', 'registry.get', 'registry.find']
      effect: allow
  - name: runtime_meta_grant
    kind: security.policy
    policy:
      resources: '*'
      actions: component.runtime_meta.write
      effect: allow
      conditions:
        - field: meta.class
          operator: eq
          value: runtime_target

  - name: metadata_migration_db
    kind: db.sql.sqlite
    file: ":memory:"
    pool: { max_open: 1, max_idle: 1 }

  - name: audit_portable_kind
    kind: registry.entry
    meta:
      portable_schema:
        context: [prompt, settings, source_id]
        refs:
          - key: source_id
            path: /source_id
            required: true
      credential_schema:
        fields:
          - key: api_key

  - name: portable_contract_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_component
    source: file://portable_contract_test.lua
    method: run
    modules: [sql, uuid, json, security, contract]
    imports:
      test: wippy.test:test

  - name: contract_open_native_test
