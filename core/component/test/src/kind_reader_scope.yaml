version: "1.0"
namespace: app
entries:
  - name: kind_reader_scope_test
    kind: function.lua
    meta: {type: test, suite: component_kind_reader_scope}
    source: file://kind_reader_scope_test.lua
    method: run
    modules: [contract, funcs, security, sql, uuid, json, registry]
    imports:
      test: wippy.test:test
  - name: kind_reader_runtime
    kind: security.policy
    policy:
      actions: [contract.get, contract.open, contract.call, contract.security, funcs.security, registry.get, registry.find, db.get, env.get]
      resources: '*'
      effect: allow
  - name: kind_reader_probe
    kind: function.lua
    source: file://kind_reader_probe.lua
    method: run
    modules: [funcs]
  - name: kind_reader_calls
    kind: security.policy
    policy:
      actions: funcs.call
      resources: [app:kind_reader_probe, kickside.component:notify_access]
      effect: allow
