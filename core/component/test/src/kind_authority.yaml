version: "1.0"
namespace: app
entries:
  - name: kind_authority_test
    kind: function.lua
    meta: {type: test, suite: component_kind_authority}
    source: file://kind_authority_test.lua
    method: run
    modules: [contract, funcs, security, sql, uuid, json]
    imports:
      test: wippy.test:test
      deletion_worker: app:deletion_test_worker
      placement: kickside.component.persist:placement
  - name: closed_kind
    kind: contract.binding
    meta: {mutation: closed, portable_schema: {context: true}}
    contracts:
      - contract: kickside.contract:component
        methods: {get_status: app:autoinit_test_status}
  - name: other_closed_kind
    kind: contract.binding
    meta: {mutation: closed}
    contracts:
      - contract: kickside.contract:component
        methods: {get_status: app:autoinit_test_status}
  - name: open_kind
    kind: contract.binding
    meta: {mutation: open}
    contracts:
      - contract: kickside.contract:component
        methods: {get_status: app:autoinit_test_status}
  - name: legacy_kind
    kind: contract.binding
    contracts:
      - contract: kickside.contract:component
        methods: {get_status: app:autoinit_test_status}
  - name: kind_member_runtime
    kind: security.policy
    policy:
      actions: [contract.get, contract.open, contract.call, contract.security, funcs.call, funcs.security, registry.get, registry.find, db.get, env.get]
      resources: '*'
      effect: allow
  - name: kind_admission
    kind: function.lua
    source: file://kind_admission.lua
    method: run
    modules: [contract]
    security:
      policies: [app:kind_admission_grant]
  - name: kind_admission_grant
    kind: security.policy
    policy:
      actions: [component.kind.create, component.kind.update]
      resources: app:closed_kind
      effect: allow
  - name: kind_declared_create
    kind: function.lua
    source: file://kind_declared_create.lua
    method: run
    imports:
      command: kickside.component:component_command
      envelope: kickside.component:envelope
  - name: kind_declaration_create_only
    kind: security.policy
    policy:
      actions: component.declaration.create
      resources: kickside.component:declaration
      effect: allow
  - name: kind_adopt_only
    kind: security.policy
    policy:
      actions: component.adopt
      resources: kickside.component:components
      effect: allow
  - name: kind_create_only
    kind: security.policy
    policy:
      actions: component.kind.create
      resources: app:closed_kind
      effect: allow
  - name: kind_maintenance_ownership
    kind: security.policy
    policy:
      actions: component.own.maintenance
      resources: app:closed_kind
      effect: allow
  - name: kind_update_only
    kind: security.policy
    policy:
      actions: component.kind.update
      resources: app:closed_kind
      effect: allow
  - name: kind_registry_deny
    kind: security.policy
    policy:
      actions: [registry.get, registry.find]
      resources: app:closed_kind
      effect: deny
  - name: kind_authority_probe
    kind: function.lua
    source: file://kind_authority_probe.lua
    method: run
    modules: [security]
    imports:
      authority: kickside.component:kind_authority
