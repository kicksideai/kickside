version: "1.0"
namespace: kickside.component

entries:
  - name: component_service
    kind: contract.definition
    meta:
      comment: User component management service contract. Every failed call answers {success=false, error, kind}; kind is INVALID for a malformed request, PERMISSION_DENIED for an access refusal (a "not found or access denied" answer conceals existence), NOT_FOUND or CONFLICT where the service knows them, INTERNAL for a storage or lifecycle failure.
      tags:
        - components
        - kickside
        - contracts
    methods:
      - name: register
        description: "Register a new component with implementation ID, private context, and metadata.\nCreates a component owned by the current actor with full access. Optional\nparent_id/position place it in the hierarchy (root + end-of-siblings when omitted).\nCalling: register_component(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\n      \"type\": \"string\", \n      \"description\": \"Optional component UUID, generated if not provided\"\n    },\n    \"impl_id\": {\n      \"type\": \"string\",\n      \"description\": \"Implementation contract ID (e.g., 'workflow.nodes:http_request')\"\n    },\n    \"private_context\": {\n      \"type\": \"object\",\n      \"description\": \"Private configuration for component execution\",\n      \"default\": {}\n    },\n    \"meta\": {\n      \"type\": \"object\",\n      \"description\": \"Public metadata key-value pairs (title, class, etc.)\",\n      \"default\": {}\n    },\n    \"additional_access\": {\n      \"type\": \"array\",\n      \"description\": \"Additional subject access grants\",\n      \"items\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"subject_id\": {\"type\": \"string\"},\n          \"subject_type\": {\"type\": \"string\", \"enum\": [\"user\", \"group\", \"service\"]},\n          \"access_mask\": {\"type\": \"integer\"}\n        },\n        \"required\": [\"subject_id\", \"subject_type\", \"access_mask\"]\n      },\n      \"default\": []\n    },\n    \"parent_id\": {\n      \"type\": [\"string\", \"null\"],\n      \"description\": \"Optional parent component UUID; root when omitted\"\n    },\n    \"position\": {\n      \"type\": [\"string\", \"null\"],\n      \"description\": \"Optional lexorank position; end-of-siblings when omitted\"\n    },\n    \"thread\": {\n      \"type\": \"object\",\n      \"description\": \"Optional primary thread row of a thread-backed component, written by the component lifecycle in the registration transaction so the component and its thread commit together\"\n    }\n  },\n  \"required\": [\"impl_id\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"component_id\": {\"type\": \"string\"},\n    \"impl_id\": {\"type\": \"string\"},\n    \"parent_id\": {\"type\": [\"string\", \"null\"]},\n    \"thread_id\": {\"type\": \"string\", \"description\": \"The committed primary thread id when the request carried a thread row\"},\n    \"created_at\": {\"type\": \"string\"},\n    \"success\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"component_id\", \"impl_id\", \"created_at\", \"success\"]\n}\n"
            format: application/schema+json
      - name: export
        description: "Export a component's portable shell (the \"kxc\" envelope): schema_version,\nsource_component_id, impl_id, the safe metadata subset, the portable\nprivate_context (credential_schema keys stripped, ref paths cleared), and\nthe ref/credential slots an importer must fill. Requires ADMIN on the\ncomponent. Carries no secrets and no backing data — data-bearing impls\nmove their own rows through the kickside.contract:portable instance contract.\nCalling: export_component(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": { \"type\": \"string\", \"description\": \"Component UUID to export\" }\n  },\n  \"required\": [\"component_id\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"component_id\": { \"type\": \"string\" },\n    \"impl_id\": { \"type\": \"string\" },\n    \"shell\": { \"type\": \"string\", \"description\": \"JSON envelope (the kxc manifest)\" },\n    \"has_portable\": { \"type\": \"boolean\", \"description\": \"impl implements kickside.contract:portable (carries backing data)\" },\n    \"slots\": { \"type\": \"array\", \"items\": { \"type\": \"object\" } },\n    \"success\": { \"type\": \"boolean\" },\n    \"error\": { \"type\": \"string\" }\n  },\n  \"required\": [\"success\"]\n}\n"
            format: application/schema+json
      - name: import
        description: "Reconstruct a component shell from a portable envelope, owned by the\ncurrent actor. The envelope cannot set owner or access — authority comes\nfrom the importing actor, not the blob. The trusted impl portable_schema\n(looked up by impl_id, never the envelope's own claims) drives context\nre-filtering; credential slots come from slot_values, component refs are\nremapped through id_map.components. Registers the new component and returns\nits id (the orchestrator then replays any backing data via import_into and\nrolls back on failure).\nCalling: import_component(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"shell\": { \"type\": \"string\", \"description\": \"JSON envelope produced by export_component\" },\n    \"slot_values\": { \"type\": \"object\", \"description\": \"credential slot key -> value\", \"default\": {} },\n    \"id_map\": { \"type\": \"object\", \"description\": \"namespaced remap; components: {src->new}\", \"default\": {} },\n    \"parent_id\": { \"type\": [\"string\", \"null\"] },\n    \"position\": { \"type\": [\"string\", \"null\"] }\n  },\n  \"required\": [\"shell\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"component_id\": { \"type\": \"string\" },\n    \"impl_id\": { \"type\": \"string\" },\n    \"warnings\": { \"type\": \"array\", \"items\": { \"type\": \"string\" } },\n    \"success\": { \"type\": \"boolean\" },\n    \"error\": { \"type\": \"string\" }\n  },\n  \"required\": [\"success\"]\n}\n"
            format: application/schema+json
      - name: get
        description: "Get component public information (impl_id, metadata, placement) - requires READ access.\nUses current actor for permission check.\nCalling: get_component(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\n      \"type\": \"string\",\n      \"description\": \"Component UUID to retrieve\"\n    }\n  },\n  \"required\": [\"component_id\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"component_id\": {\"type\": \"string\"},\n    \"impl_id\": {\"type\": \"string\"},\n    \"meta\": {\n      \"type\": \"object\",\n      \"description\": \"Component metadata key-value pairs\"\n    },\n    \"parent_id\": {\"type\": [\"string\", \"null\"]},\n    \"position\": {\"type\": [\"string\", \"null\"]},\n    \"created_at\": {\"type\": \"string\"},\n    \"updated_at\": {\"type\": \"string\"}\n  },\n  \"required\": [\"component_id\", \"impl_id\", \"meta\", \"created_at\", \"updated_at\"]\n}\n"
            format: application/schema+json
      - name: get_access_context_by_meta
        description: "Get component access context by metadata filters - requires any access level.\nReturns error if zero or multiple components match the criteria.\nUses current actor for permission check.\nCalling: get_access_context_by_meta(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"meta\": {\n      \"type\": \"object\",\n      \"description\": \"Metadata key-value pairs to match (all must match)\",\n      \"additionalProperties\": {\"type\": \"string\"}\n    },\n    \"access_mask\": {\n      \"type\": \"integer\",\n      \"description\": \"Minimum required access level (defaults to READ)\",\n      \"default\": 1\n    },\n    \"include_context\": {\n      \"type\": \"boolean\",\n      \"description\": \"When true, return the component private execution context after access_mask is satisfied\",\n      \"default\": false\n    }\n  },\n  \"required\": [\"meta\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"id\": {\n      \"type\": \"string\",\n      \"description\": \"Component ID\"\n    },\n    \"context\": {\n      \"type\": \"object\",\n      \"description\": \"Component private execution context when include_context=true; otherwise empty\"\n    },\n    \"context_included\": {\n      \"type\": \"boolean\",\n      \"description\": \"True when private execution context was included\"\n    },\n    \"context_revision\": {\n      \"type\": \"integer\",\n      \"description\": \"Revision of the returned private context when include_context=true\"\n    },\n    \"access_level\": {\n      \"type\": \"integer\",\n      \"description\": \"Access level integer for current actor\"\n    },\n    \"impl_id\": {\n      \"type\": \"string\",\n      \"description\": \"Implementation contract ID\"\n    }\n  },\n  \"required\": [\"id\", \"access_level\", \"impl_id\"]\n}\n"
            format: application/schema+json
      - name: get_access_context
        description: "Get component access context for contract execution - requires any access level.\nReturns structured access information including ID, context, access level, and impl_id.\nCalling: get_access_context(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\n      \"type\": \"string\",\n      \"description\": \"Component UUID to get access context for\"\n    },\n    \"access_mask\": {\n      \"type\": \"integer\",\n      \"description\": \"Minimum required access level (defaults to READ)\",\n      \"default\": 1\n    },\n    \"include_context\": {\n      \"type\": \"boolean\",\n      \"description\": \"When true, return the component private execution context after access_mask is satisfied\",\n      \"default\": false\n    }\n  },\n  \"required\": [\"component_id\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"id\": {\n      \"type\": \"string\",\n      \"description\": \"Component ID\"\n    },\n    \"context\": {\n      \"type\": \"object\",\n      \"description\": \"Component private execution context when include_context=true; otherwise empty\"\n    },\n    \"context_included\": {\n      \"type\": \"boolean\",\n      \"description\": \"True when private execution context was included\"\n    },\n    \"context_revision\": {\n      \"type\": \"integer\",\n      \"description\": \"Revision of the returned private context when include_context=true\"\n    },\n    \"access_level\": {\n      \"type\": \"integer\",\n      \"description\": \"Access level integer for current actor\"\n    },\n    \"impl_id\": {\n      \"type\": \"string\",\n      \"description\": \"Implementation contract ID\"\n    }\n  },\n  \"required\": [\"id\", \"access_level\", \"impl_id\"]\n}\n"
            format: application/schema+json
      - name: list_access
        description: "List the access grants on a component (ADMIN required) for the share UI.\nReturns the raw stored grants — subject id + mask — without subject\nexpansion; display labels are resolved by the caller via the directory.\nCalling: list_access(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": { \"type\": \"string\", \"description\": \"Component UUID to list grants for\" }\n  },\n  \"required\": [\"component_id\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"success\": { \"type\": \"boolean\" },\n    \"error\": { \"type\": \"string\" },\n    \"owner\": { \"type\": \"string\", \"description\": \"Subject id of the component owner, if recorded\" },\n    \"access\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"subject_id\": { \"type\": \"string\", \"description\": \"Subject id (user, group, or service)\" },\n          \"subject_type\": { \"type\": \"string\", \"enum\": [\"user\", \"group\", \"service\"], \"description\": \"Subject kind\" },\n          \"access_mask\": { \"type\": \"integer\", \"description\": \"Granted access bitmask\" },\n          \"owner\": { \"type\": \"boolean\", \"description\": \"True if this subject owns the component\" }\n        },\n        \"required\": [\"subject_id\", \"subject_type\", \"access_mask\"]\n      }\n    }\n  },\n  \"required\": [\"success\"]\n}\n"
            format: application/schema+json
      - name: set_meta
        description: "Set public component metadata used by render/read-model views.\nPrivate config, credentials, and execution identity must not be stored here.\nRuntime grants evaluate the stored implementation ID and its registry metadata; public component metadata does not supply authorization claims.\nCalling: set_meta_component(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\n      \"type\": \"string\",\n      \"description\": \"Component UUID to update\"\n    },\n    \"fields\": {\n      \"type\": \"object\",\n      \"description\": \"Public metadata fields to upsert\"\n    },\n    \"delete_keys\": {\n      \"type\": \"array\",\n      \"description\": \"Public metadata keys to delete before fields are upserted\",\n      \"items\": { \"type\": \"string\" }\n    }\n  },\n  \"required\": [\"component_id\", \"fields\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"component_id\": {\"type\": \"string\"},\n    \"changes_made\": {\"type\": \"boolean\"},\n    \"results\": {\n      \"type\": \"array\",\n      \"description\": \"Results for each metadata field written\"\n    }\n  },\n  \"required\": [\"component_id\", \"changes_made\", \"results\"]\n}\n"
            format: application/schema+json
      - name: update
        description: "Atomically apply public metadata and private component context commands.\nEvery SET_CONTEXT/PATCH_CONTEXT advances the component's context_revision;\nPATCH_CONTEXT merges under the row lock, so concurrent patches keep every key.\nOptional expected_revision checks the context subject version under the row lock before any write.\nAccess changes use grant_subtree/revoke_subtree.\nCalling: update_component(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\n      \"type\": \"string\",\n      \"description\": \"Component UUID to update\"\n    },\n    \"commands\": {\n      \"type\": \"array\",\n      \"description\": \"Array of private context commands to execute\",\n      \"items\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"type\": {\n            \"type\": \"string\",\n            \"enum\": [\n              \"SET_CONTEXT\",\n              \"PATCH_CONTEXT\",\n              \"SET_META\"\n            ]\n          },\n          \"payload\": {\n            \"type\": \"object\"\n          }\n        },\n        \"required\": [\n          \"type\",\n          \"payload\"\n        ]\n      }\n    },\n    \"expected_revision\": {\n      \"type\": \"integer\",\n      \"minimum\": 0,\n      \"description\": \"Context subject version expectation; stale versions return CONFLICT without writes\"\n    }\n  },\n  \"required\": [\n    \"component_id\",\n    \"commands\"\n  ]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\n      \"type\": \"string\"\n    },\n    \"changes_made\": {\n      \"type\": \"boolean\"\n    },\n    \"context_revision\": {\n      \"type\": \"integer\",\n      \"description\": \"The component's context_revision after the batch\"\n    },\n    \"results\": {\n      \"type\": \"array\",\n      \"description\": \"Results for each command executed\"\n    },\n    \"success\": {\n      \"type\": \"boolean\"\n    },\n    \"error\": {\n      \"type\": \"string\"\n    },\n    \"kind\": {\n      \"type\": \"string\",\n      \"description\": \"Error kind on failure\"\n    },\n    \"details\": {\n      \"type\": \"object\",\n      \"description\": \"Structured error details, including context subject version conflicts\"\n    }\n  },\n  \"required\": [\n    \"success\"\n  ]\n}\n"
            format: application/schema+json
      - name: list
        description: "List components accessible to current actor with optional filtering.\nSupports filtering by metadata, impl_id, and access level.\nCalling: list_components(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"filters\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"impl_ids\": {\n          \"type\": \"array\",\n          \"items\": {\"type\": \"string\"},\n          \"description\": \"Filter by implementation IDs\"\n        },\n        \"meta\": {\n          \"type\": \"object\",\n          \"description\": \"Filter by metadata key-value pairs\"\n        },\n        \"text\": {\n          \"type\": \"string\",\n          \"description\": \"Case-insensitive substring of the component id, implementation id, or any metadata value\"\n        },\n        \"access_mask\": {\n          \"type\": \"integer\",\n          \"description\": \"Minimum required access level\"\n        }\n      }\n    },\n    \"pagination\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"limit\": {\"type\": \"integer\", \"minimum\": 1, \"maximum\": 100, \"default\": 50},\n        \"offset\": {\"type\": \"integer\", \"minimum\": 0, \"default\": 0}\n      }\n    },\n    \"ordering\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"field\": {\"type\": \"string\", \"enum\": [\"created_at\", \"updated_at\"], \"default\": \"created_at\"},\n        \"direction\": {\"type\": \"string\", \"enum\": [\"ASC\", \"DESC\"], \"default\": \"DESC\"}\n      }\n    }\n  },\n  \"default\": {}\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"components\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"component_id\": {\"type\": \"string\"},\n          \"impl_id\": {\"type\": \"string\"},\n          \"meta\": {\"type\": \"object\"},\n          \"created_at\": {\"type\": \"string\"},\n          \"updated_at\": {\"type\": \"string\"}\n        }\n      }\n    },\n    \"total_count\": {\"type\": \"integer\"},\n    \"has_more\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"components\", \"total_count\", \"has_more\"]\n}\n"
            format: application/schema+json
      - name: query
        description: "Read-port: return components matching a flat filter DTO. The read is\naccess-filtered to the current actor by default (with_access_mask\ndefaults to READ). Widening — actor_id (read AS another user) or\nscope=\"all\" (unscoped/admin read) — requires the list-all capability;\na non-privileged caller passing either receives an access error.\nOmitting a field never widens. include selects optional projections\n(meta / access, plus private_context only for list-all-capable callers).\norder_by is { field, direction } or the literal \"position\".\nCalling: query_components(filter)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"actor_id\": {\"type\": \"string\", \"description\": \"Read AS this user (privileged delegation; requires list-all capability)\"},\n    \"scope\": {\"type\": \"string\", \"enum\": [\"all\"], \"description\": \"\\\"all\\\" reads unscoped/admin (requires list-all capability)\"},\n    \"access_mask\": {\"type\": \"integer\", \"description\": \"Minimum required access level for the scoped read (defaults to READ)\"},\n    \"component_ids\": {\"type\": \"array\", \"items\": {\"type\": \"string\"}},\n    \"impl_ids\": {\"type\": \"array\", \"items\": {\"type\": \"string\"}},\n    \"parent_id\": {\"type\": [\"string\", \"null\"]},\n    \"path_prefix\": {\"type\": \"string\"},\n    \"meta\": {\"type\": \"object\", \"description\": \"Exact-match metadata key-value pairs\"},\n    \"text\": {\"type\": \"string\", \"description\": \"Case-insensitive substring of the component id, implementation id, or any metadata value\"},\n    \"include\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"meta\": {\"type\": \"boolean\"},\n        \"private_context\": {\"type\": \"boolean\"},\n        \"access\": {\"type\": \"boolean\"}\n      }\n    },\n    \"limit\": {\"type\": \"integer\"},\n    \"offset\": {\"type\": \"integer\"},\n    \"order_by\": {\n      \"oneOf\": [\n        {\"type\": \"string\", \"enum\": [\"position\"]},\n        {\n          \"type\": \"object\",\n          \"properties\": {\n            \"field\": {\"type\": \"string\"},\n            \"direction\": {\"type\": \"string\", \"enum\": [\"ASC\", \"DESC\"]}\n          }\n        }\n      ]\n    }\n  },\n  \"default\": {}\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"components\": {\"type\": \"array\"},\n    \"success\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"components\", \"success\"]\n}\n"
            format: application/schema+json
      - name: count
        description: "Read-port: count components matching a flat filter DTO. Same scope and\ncapability gate as query_components (default actor-scoped; actor_id /\nscope=\"all\" require the list-all capability). Ordering and pagination\nare irrelevant to a count and are ignored.\nCalling: count_components(filter)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"actor_id\": {\"type\": \"string\"},\n    \"scope\": {\"type\": \"string\", \"enum\": [\"all\"]},\n    \"access_mask\": {\"type\": \"integer\"},\n    \"component_ids\": {\"type\": \"array\", \"items\": {\"type\": \"string\"}},\n    \"impl_ids\": {\"type\": \"array\", \"items\": {\"type\": \"string\"}},\n    \"parent_id\": {\"type\": [\"string\", \"null\"]},\n    \"path_prefix\": {\"type\": \"string\"},\n    \"meta\": {\"type\": \"object\"},\n    \"text\": {\"type\": \"string\"}\n  },\n  \"default\": {}\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"count\": {\"type\": \"integer\"},\n    \"success\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"count\", \"success\"]\n}\n"
            format: application/schema+json
      - name: delete
        description: "Delete a component - requires DELETE access.\nIf the component implements the deletable contract, cleanup is delegated first.\nThe service unregisters after successful cleanup; failed or blocked cleanup retains the component. Direct children make the delete\nfail unless child_policy is explicitly set to reparent_root.\nCalling: delete_component(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\n      \"type\": \"string\",\n      \"description\": \"Component UUID to delete\"\n    },\n    \"child_policy\": {\n      \"type\": \"string\",\n      \"enum\": [\"reparent_root\"],\n      \"description\": \"Optional placement policy for direct children. Omit to refuse parent deletes; reparent_root detaches direct children to root.\"\n    },\n    \"delete_options\": {\n      \"type\": \"object\",\n      \"description\": \"Optional kind-specific cleanup options forwarded to the deletable contract.\"\n    }\n  },\n  \"required\": [\"component_id\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"component_id\": {\"type\": \"string\"},\n    \"deleted\": {\"type\": \"boolean\"},\n    \"success\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"component_id\", \"deleted\", \"success\"]\n}"
            format: application/schema+json
      - name: set_placement
        description: "Re-parent and/or reorder a component within the hierarchy - requires WRITE access.\nRejects cycles (moving under self or a descendant; tree unchanged). Re-materializes\nthe path for the node and all descendants. parent_id null/false moves to root;\nposition defaults to end-of-siblings.\nCalling: set_placement(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\"type\": \"string\", \"description\": \"Component UUID to place\"},\n    \"parent_id\": {\n      \"type\": [\"string\", \"null\", \"boolean\"],\n      \"description\": \"New parent UUID; null/false moves to root; omit to keep current parent\"\n    },\n    \"position\": {\n      \"type\": [\"string\", \"null\"],\n      \"description\": \"Optional lexorank position; end-of-siblings when omitted\"\n    }\n  },\n  \"required\": [\"component_id\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"component_id\": {\"type\": \"string\"},\n    \"parent_id\": {\"type\": [\"string\", \"null\"]},\n    \"position\": {\"type\": \"string\"},\n    \"changes_made\": {\"type\": \"boolean\"},\n    \"success\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"component_id\", \"success\"]\n}\n"
            format: application/schema+json
      - name: list_children
        description: "List the children of a component (root-level when parent_id omitted), ordered by\nposition then created_at, access-filtered for the current actor.\nCalling: list_children(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"parent_id\": {\n      \"type\": [\"string\", \"null\"],\n      \"description\": \"Parent component UUID; root-level when omitted\"\n    },\n    \"pagination\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"limit\": {\"type\": \"integer\", \"minimum\": 1, \"maximum\": 100, \"default\": 50},\n        \"offset\": {\"type\": \"integer\", \"minimum\": 0, \"default\": 0}\n      }\n    }\n  },\n  \"default\": {}\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"components\": {\"type\": \"array\"},\n    \"total_count\": {\"type\": \"integer\"},\n    \"has_more\": {\"type\": \"boolean\"},\n    \"parent_id\": {\"type\": [\"string\", \"null\"]}\n  },\n  \"required\": [\"components\", \"total_count\", \"has_more\"]\n}\n"
            format: application/schema+json
      - name: grant_subtree
        description: "Grant access to a component and all its descendants - requires ADMIN on the root.\nThe subject is { subject_id, subject_type }. Uses the shared typed-grant persistence path; update accepts only context and metadata commands.\nCalling: grant_subtree(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"root_component_id\": {\"type\": \"string\", \"description\": \"Subtree root UUID\"},\n    \"subject\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"subject_id\": {\"type\": \"string\"},\n        \"subject_type\": {\"type\": \"string\", \"enum\": [\"user\", \"group\", \"service\"]}\n      },\n      \"required\": [\"subject_id\", \"subject_type\"],\n      \"description\": \"Subject id and kind (user, group or service)\"\n    },\n    \"access_mask\": {\"type\": \"integer\", \"minimum\": 0, \"description\": \"Bitmask of permissions to grant\"}\n  },\n  \"required\": [\"root_component_id\", \"subject\", \"access_mask\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"root_component_id\": {\"type\": \"string\"},\n    \"affected\": {\"type\": \"integer\"},\n    \"changes_made\": {\"type\": \"boolean\"},\n    \"success\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"root_component_id\", \"affected\", \"success\"]\n}\n"
            format: application/schema+json
      - name: revoke_subtree
        description: "Revoke a subject's access from a component and all its descendants - requires ADMIN\non the root. The subject is { subject_id, subject_type }.\nCalling: revoke_subtree(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"root_component_id\": {\"type\": \"string\", \"description\": \"Subtree root UUID\"},\n    \"subject\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"subject_id\": {\"type\": \"string\"},\n        \"subject_type\": {\"type\": \"string\", \"enum\": [\"user\", \"group\", \"service\"]}\n      },\n      \"required\": [\"subject_id\", \"subject_type\"],\n      \"description\": \"Subject id and kind (user, group or service)\"\n    }\n  },\n  \"required\": [\"root_component_id\", \"subject\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED (including a concealed not-found), NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"root_component_id\": {\"type\": \"string\"},\n    \"affected\": {\"type\": \"integer\"},\n    \"changes_made\": {\"type\": \"boolean\"},\n    \"success\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"root_component_id\", \"affected\", \"success\"]\n}\n"
            format: application/schema+json
      - name: adopt
        description: "Adopt a component no principal holds access to - every grant reaching it names a\nframework maintenance actor. Requires a user principal whose frame holds\ncomponent.adopt on kickside.component:components. The caller gains full access,\nbecomes the recorded owner and execution principal, and the identity audit records\nthe adoption with the prior access list. A component a principal holds access to\nrefuses with CONFLICT.\nCalling: adopt(request_dto)\n"
        input_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"component_id\": {\"type\": \"string\", \"description\": \"Component UUID to adopt\"}\n  },\n  \"required\": [\"component_id\"]\n}\n"
            format: application/schema+json
        output_schemas:
          - definition: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"retryable\": {\"type\": \"boolean\"},\n    \"details\": {\"type\": \"object\", \"description\": \"Structured failure details when provided by the lower layer\"},\n    \"kind\": {\"type\": \"string\", \"description\": \"Error kind when success is false: INVALID, PERMISSION_DENIED, NOT_FOUND, CONFLICT, INTERNAL, or the kind a lower layer assigned\"},\n    \"component_id\": {\"type\": \"string\"},\n    \"adopted_by\": {\"type\": \"string\"},\n    \"identity_generation\": {\"type\": \"integer\"},\n    \"request_id\": {\"type\": \"string\"},\n    \"prior_access\": {\"type\": \"array\"},\n    \"success\": {\"type\": \"boolean\"}\n  },\n  \"required\": [\"success\"]\n}\n"
            format: application/schema+json

  # ─── Generic share API (kickside.component.api child namespace) ───────
  # Component-level sharing endpoints live in kickside.component.api; the host
  # wires the router they attach to via ns.dependency (api_router).
