        - metadata
    source: file://set_meta_component_func.lua
    imports:
      meta_service: kickside.component:meta_service
    method: handle

  # kickside.component.binding:set_placement_func
  - name: set_placement_func
    kind: function.lua
    meta:
      comment: Re-parent and/or reorder a component within the hierarchy
      tags:
