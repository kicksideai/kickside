version: '1.0'
namespace: kickside.component.system
entries:
  - name: list_runtime_context
    kind: function.lua
    meta: {private: true}
    source: file://../system_query.lua
    method: runtime
    imports:
      secrets_document: kickside.component:secrets_document
      component_reader: kickside.component.persist:component_reader
      component_types: kickside.component:types
    security:
      policies: [kickside.component:kind_read_call, kickside.component:secrets_codec_access]
  - name: seal_secrets
    kind: function.lua
    meta: {private: true}
    source: file://../secrets_cipher.lua
    method: encode
    modules: [env, json, uuid]
    imports:
      secrets_document: kickside.component:secrets_document
      secret_cipher: kickside.contract:secret_cipher
      component_types: kickside.component:types
      persisted_json: kickside.contract:persisted_json
    security:
      policies: [kickside.component:secrets_key_access]
  - name: open_secrets
    kind: function.lua
    meta: {private: true}
    source: file://../secrets_cipher.lua
    method: decode
    modules: [env, json, uuid]
    imports:
      secrets_document: kickside.component:secrets_document
      secret_cipher: kickside.contract:secret_cipher
      component_types: kickside.component:types
      persisted_json: kickside.contract:persisted_json
    security:
      policies: [kickside.component:secrets_key_access]
  - name: exists
    kind: function.lua
    meta:
      private: true
      comment: Trusted existence check; returns no component metadata or private context.
    source: file://exists.lua
    method: exists
    modules: [security, funcs]
    security:
      policies: [kickside.component.system:exists_access]
    imports:
      component_reader: kickside.component.persist:component_reader
  - name: read_exists
    kind: function.lua
    meta: {private: true}
    source: file://exists.lua
    method: read
    modules: [security, funcs]
    imports:
      component_reader: kickside.component.persist:component_reader
  - name: exists_access
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: [security.policy.get, security.scope.create, funcs.security, funcs.call]
      resources:
        - kickside.component.system:read_config
        - kickside.component.system:read_db
        - kickside.component.system:read_exists
        - custom
        - security
      effect: allow
  - name: read_config
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: registry.get
      resources: kickside.component:db_config
      effect: allow
  - name: read_db
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: db.get
      resources: []
      effect: allow

  - name: read_runtime_context
    kind: function.lua
    meta: {private: true}
    source: file://../secrets_read.lua
    method: runtime
    modules: [security]
    imports:
      secrets_document: kickside.component:secrets_document
      component_reader: kickside.component.persist:component_reader
      component_types: kickside.component:types
      envelope: kickside.component:envelope
      access_policy: kickside.component:access_policy
      context_policy: kickside.component:context_policy
      secret_fields: kickside.component:secret_fields
    security:
      policies: [kickside.component:kind_read_call, kickside.component:secrets_codec_access]

  - name: read_private_context
    kind: function.lua
    meta: {private: true}
    source: file://../secrets_read.lua
    method: private
    modules: [security]
    imports:
      secrets_document: kickside.component:secrets_document
      component_reader: kickside.component.persist:component_reader
      component_types: kickside.component:types
      envelope: kickside.component:envelope
      access_policy: kickside.component:access_policy
      context_policy: kickside.component:context_policy
      secret_fields: kickside.component:secret_fields
    security:
      policies: [kickside.component:kind_read_call, kickside.component:secrets_codec_access]
