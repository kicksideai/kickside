            sed -E ''s/\x1B\[[0-?]*[ -/]*[@-~]//g'' .wippy-test.log > .wippy-test.clean.log

            awk ''/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/
            { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty
            || failed || !passed) }'' .wippy-test.clean.log

            cd "$source_root"

            version=$(jq -er --arg path platform/widgets ''.[$path]'' .release-please-manifest.json)

            wippy publish --config platform/widgets --version "$version" --dry-run
            --create --module-visibility public --module-type plugin --embed kickside.widgets:ui_fs

            '
