            wippy test --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433 2>&1 | tee .wippy-test.log
            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path platform/workflows '.[$path]' .release-please-manifest.json)
            wippy publish --config platform/workflows --version "$version" --dry-run --create --module-visibility public --module-type plugin --embed kickside.workflows:ui_fs
        - module: app
          engine: sqlite
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            npm ci --prefix app --no-audit --no-fund
            python3 -m unittest discover -s app/test -p test_documentation_sources.py
            make -C app lockrefresh
            cd app/test
            mkdir -p .wippy
            wippy lint  --set "vars.sqlite_path=$PWD/.wippy/ci.sqlite"
            wippy test --set "vars.sqlite_path=$PWD/.wippy/ci.sqlite" 2>&1 | tee .wippy-test.log
            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path app '.[$path]' .release-please-manifest.json)
            wippy publish --config app --version "$version" --dry-run --create --module-visibility public --module-type application --embed app:app_fs
        - module: app
          engine: postgres
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            npm ci --prefix app --no-audit --no-fund
            python3 -m unittest discover -s app/test -p test_documentation_sources.py
            make -C app lockrefresh
            cd app/test
            databases=()
            cleanup_databases() { for database in "${databases[@]}"; do dropdb "$database"; done; }
            trap cleanup_databases EXIT
            database="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_0"
            createdb "$database"
            databases+=("$database")
            wippy lint  --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433
            wippy test --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433 2>&1 | tee .wippy-test.log
            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path app '.[$path]' .release-please-manifest.json)
            wippy publish --config app --version "$version" --dry-run --create --module-visibility public --module-type application --embed app:app_fs
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kickside
          POSTGRES_PASSWORD: kickside
          POSTGRES_DB: postgres
        ports:
        - 5433:5432
        options: --health-cmd "pg_isready -U kickside -d postgres" --health-interval 5s --health-timeout
          5s --health-retries 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        path: source
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: kicksideai/.github/actions/setup-wippy@5401fa65bed7d8648125957520e94206ed1ffd0b
      with:
        version: 0.3.47a
        hub-url: https://hub.wippy.ai
    - name: Check out components module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/components
        ref: main
        path: components
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check out converters module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/converters
        ref: main
        path: converters
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check out providers module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/providers
        ref: main
        path: providers
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check native harness database ownership
      run: python3 -m unittest discover -s tests -p test_public_harnesses.py
    - name: Build, lint and Lua module tests
      run: ${{ matrix.commands }}
    defaults:
      run:
        working-directory: source
