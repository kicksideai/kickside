    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kickside
          POSTGRES_PASSWORD: kickside
          POSTGRES_DB: postgres
        ports:
        - 5433:5432
        options: --health-cmd "pg_isready -U kickside -d postgres" --health-interval
          5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        path: source
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: kicksideai/.github/actions/setup-wippy@5401fa65bed7d8648125957520e94206ed1ffd0b
      with:
        version: 0.3.47a
        hub-url: https://hub.wippy.ai
    - name: Check out components module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/components
        ref: main
        path: components
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check out converters module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/converters
        ref: main
        path: converters
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check out providers module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/providers
        ref: main
        path: providers
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Build, lint and Lua module tests
      run: ${{ matrix.commands }}
    defaults:
      run:
        working-directory: source
