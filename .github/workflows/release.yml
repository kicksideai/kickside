name: Release
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app_created: ${{ steps.release.outputs['app--release_created'] }}
      app_version: ${{ steps.release.outputs['app--version'] }}
      app_tag: ${{ steps.release.outputs['app--tag_name'] }}
      released_paths: ${{ steps.release.outputs.paths_released }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
    - id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
      with:
        token: ${{ github.token }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    # Events from GITHUB_TOKEN do not start workflows, so start CI on the release PR branch.
    - name: Run CI on the release PR
      if: ${{ steps.release.outputs.prs_created == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_PRS: ${{ steps.release.outputs.prs }}
      run: |
        set -euo pipefail
        jq -r '.[].headBranchName' <<<"${RELEASE_PRS:-[]}" | while read -r branch; do
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
        done
  publish-modules:
    needs: release-please
    if: needs.release-please.outputs.released_paths != '' && needs.release-please.outputs.released_paths != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: kicksideai/.github/actions/setup-wippy@5401fa65bed7d8648125957520e94206ed1ffd0b
      with:
        version: 0.3.55a
        hub-url: https://hub.wippy.ai
    - name: Publish companion artifacts from their release tags
      env:
        RELEASE_PATHS_JSON: ${{ needs.release-please.outputs.released_paths }}
        WIPPY_HUB_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
      run: |
        set -euo pipefail
        test -n "$WIPPY_HUB_TOKEN" || { echo 'WIPPY_HUB_TOKEN is required to publish companion modules' >&2; exit 1; }
        wippy auth login --registry https://hub.wippy.ai --token "$WIPPY_HUB_TOKEN"
        python3 scripts/publish-release-modules.py --repository . --wippy wippy
  publish-app:
    needs: [release-please, publish-modules]
    if: needs.release-please.outputs.app_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release-please.outputs.app_tag }}
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: kicksideai/.github/actions/setup-wippy@5401fa65bed7d8648125957520e94206ed1ffd0b
      with:
        version: 0.3.55a
        hub-url: https://hub.wippy.ai
    - name: Verify companion module artifacts
      env:
        RELEASE_PATHS_JSON: ${{ needs.release-please.outputs.released_paths }}
        WIPPY_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
      run: make -C app release-dependencies WIPPY=wippy
    - name: Build and verify application package
      env:
        APP_VERSION: ${{ needs.release-please.outputs.app_version }}
      run: make -C app release-check VERSION="$APP_VERSION" WIPPY_BIN=wippy
    - name: Publish verified application release
      env:
        APP_VERSION: ${{ needs.release-please.outputs.app_version }}
        WIPPY_HUB_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
      run: |
        set -euo pipefail
        test -n "$WIPPY_HUB_TOKEN" || { echo 'WIPPY_HUB_TOKEN is required to publish the application' >&2; exit 1; }
        wippy auth login --registry https://hub.wippy.ai --token "$WIPPY_HUB_TOKEN"
        make -C app release-publish VERSION="$APP_VERSION" WIPPY_BIN=wippy
