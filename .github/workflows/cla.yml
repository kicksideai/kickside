name: CLA

'on':
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  check:
    uses: kicksideai/.github/.github/workflows/cla.yml@c3adc177932a7d5c2a8f445384697720fd31566c
    secrets:
      CLA_TOKEN: ${{ secrets.CLA_TOKEN }}
