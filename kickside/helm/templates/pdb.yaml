{{- if .Values.autoscaling.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kickside.fullname" . }}
  labels:
    {{- include "kickside.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "kickside.selectorLabels" . | nindent 6 }}
{{- end }}
