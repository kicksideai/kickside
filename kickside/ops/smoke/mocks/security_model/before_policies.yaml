- name: before_26
  kind: security.policy
  meta:
    private: true
    original_id: app.security:user.runtime_dataflow_registry
  groups:
  - security.model:before
  policy:
    resources:
    - dataflow.*
    actions:
    - process.registry.register
    - process.registry.unregister
    effect: allow
    conditions:
    - field: resource
      operator: matches
      value: ^dataflow[.][0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
- name: before_27
  kind: security.policy
  meta:
    private: true
    original_id: app.security:user.runtime_dataflow_node_spawn
  groups:
  - security.model:before
  policy:
    resources:
    - userspace.dataflow.node.*
    actions:
    - process.spawn
    - process.spawn.monitored
    - process.spawn.linked
    effect: allow
    conditions:
    - field: resource
      operator: matches
      value: ^userspace[.]dataflow[.]node[.][a-z][a-z0-9_]*:[a-z][a-z0-9_]*$
- name: before_shared_endpoints
  kind: security.policy
  meta:
    private: true
  groups:
  - security.model:before
  policy:
    actions: access
    resources: '*'
    effect: allow
    conditions:
    - field: resource
      operator: matches
      value: ^[^:]+:[^:]+\.user\.endpoint$
