regexTarget = "secret"
paths = ['''(^|/)kickside/platform/workflows/ui/src/app/__fixtures__/run\-88444c66\-agent\-node\.json$''']
regexes = ['''^019f48ab\-3063\-7313\-ad9b\-481e0df7ddca$''']

[[allowlists]]
