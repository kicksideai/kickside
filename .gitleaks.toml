regexTarget = "secret"
paths = ['''(^|/)platform/security/test\-bot\-accounts/\.wippy\.yaml$''']
regexes = ['''^0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "Literal replacement password in the users unit suite"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)platform/users/test/suites/user_cases/users_basic_reads_credentials_and_groups_test\.lua$''']
