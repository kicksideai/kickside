# Extends the default gitleaks rules with allowlists for values that match
# secret patterns but carry no secret.

[extend]
useDefault = true

[[allowlists]]
description = "UUID identifiers"
regexTarget = "secret"
regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']

[[allowlists]]
description = "Header-only JWT test tokens"
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9\.[a-z]+$''']

[[allowlists]]
description = "Owner-verified dummy test credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)platform/identity/test\-bot\-accounts/\.wippy\.yaml$''']
regexes = ['''^0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "Owner-verified dummy test credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)platform/mcp/test\-bot\-accounts/\.wippy\.yaml$''']
regexes = ['''^0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "Owner-verified dummy test credential"
