[extend]
useDefault = true

[[allowlists]]
description = "Literal idempotency key in an automation test fixture"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)kickside/ops/smoke/scenarios_automation\.py$''']
regexes = ['''^northwind\-receiving\-NW\-2048$''']

[[allowlists]]
description = "Owner-verified dummy test credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)kickside/platform/identity/test\-bot\-accounts/\.wippy\.yaml$''']
regexes = ['''^0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "Owner-verified dummy test credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)kickside/platform/mcp/test\-bot\-accounts/\.wippy\.yaml$''']
regexes = ['''^0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "Owner-verified dummy test credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)kickside/platform/security/test\-bot\-accounts/\.wippy\.yaml$''']
regexes = ['''^0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "Literal idempotency key and UUID identifiers in a UI fixture"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)kickside/platform/automation/ui/src/app/automations\.interactions\.spec\.ts$''']
regexes = ['''^019f4b1f\-df4d\-7009\-935c\-35b75aed03a7$''']

[[allowlists]]
